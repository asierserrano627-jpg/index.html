<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pistola de dinero</title>
<style>
  html,body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    background:
      radial-gradient(circle at 30% 30%, #1a0d40 0%, transparent 55%),
      radial-gradient(circle at 75% 75%, #0a1a30 0%, transparent 55%),
      #06040f;
    font-family:system-ui,sans-serif;
    overflow:hidden;
  }
  .stage{
    width:360px;
    height:360px;
    position:relative;
  }
  .stage svg{
    width:100%;
    height:100%;
    overflow:visible;
    filter:drop-shadow(0 0 22px rgba(139,123,255,.5));
  }
  .hint{
    position:fixed;bottom:16px;left:0;right:0;text-align:center;
    font-size:13px;color:#8b7bff;opacity:.85;
  }
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ====== COLORES NOVA ====== -->
    <linearGradient id="cuerpoArma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b8aaff"/>
      <stop offset="35%"  stop-color="#8b7bff"/>
      <stop offset="75%"  stop-color="#5a4ad9"/>
      <stop offset="100%" stop-color="#2a1a80"/>
    </linearGradient>
    <linearGradient id="cuerpoArmaCara" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c4b8ff"/>
      <stop offset="50%"  stop-color="#8b7bff"/>
      <stop offset="100%" stop-color="#5a4ad9"/>
    </linearGradient>
    <linearGradient id="empunadura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6a5aff"/>
      <stop offset="50%"  stop-color="#3a2ab0"/>
      <stop offset="100%" stop-color="#1a0d60"/>
    </linearGradient>
    <linearGradient id="cañon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c4b8ff"/>
      <stop offset="50%"  stop-color="#8b7bff"/>
      <stop offset="100%" stop-color="#3a2ab0"/>
    </linearGradient>
    <radialGradient id="agujeroCañon" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000"/>
      <stop offset="70%"  stop-color="#1a0d40"/>
      <stop offset="100%" stop-color="#3a2ab0"/>
    </radialGradient>
    <linearGradient id="metalBrillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity=".7"/>
      <stop offset="40%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- ====== BILLETES DE EURO ====== -->
    <linearGradient id="billeteGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d4e4e0"/>
      <stop offset="50%"  stop-color="#a8c8c4"/>
      <stop offset="100%" stop-color="#7a9a96"/>
    </linearGradient>
    <linearGradient id="billeteGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c4d8d4"/>
      <stop offset="50%"  stop-color="#94b8b4"/>
      <stop offset="100%" stop-color="#6a8a86"/>
    </linearGradient>

    <!-- ====== FILTROS ====== -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="billeteSom" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- ============ GRUPO DE LA PISTOLA ============ -->
  <!-- Retroceso al disparar (todo el grupo se mueve) -->
  <g id="pistolaGrupo">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,0; -18,-4; -10,0; 0,0; 0,0; 0,0"
      keyTimes="0; .30; .34; .38; .42; .70; 1"
      dur="1.6s" repeatCount="indefinite"/>

    <!-- ============ EMPUÑADURA ============ -->
    <path d="M 105 220
             Q 95 240 105 275
             Q 115 300 145 305
             L 175 305
             Q 195 300 195 275
             L 195 230
             Q 185 210 165 205
             Q 130 200 105 220 Z"
          fill="url(#empunadura)" stroke="#1a0d60" stroke-width="2"/>

    <!-- Textura de la empuñadura (rayas diagonales) -->
    <g stroke="#1a0d60" stroke-width="1" opacity=".45">
      <line x1="112" y1="240" x2="130" y2="240"/>
      <line x1="110" y1="252" x2="135" y2="252"/>
      <line x1="110" y1="264" x2="140" y2="264"/>
      <line x1="115" y1="276" x2="150" y2="276"/>
      <line x1="125" y1="288" x2="165" y2="288"/>
      <line x1="140" y1="298" x2="180" y2="298"/>
    </g>

    <!-- Tornillos de la empuñadura -->
    <circle cx="150" cy="235" r="3" fill="#1a0d60" stroke="#c4b8ff" stroke-width=".8"/>
    <circle cx="168" cy="285" r="3" fill="#1a0d60" stroke="#c4b8ff" stroke-width=".8"/>

    <!-- Brillo de la empuñadura -->
    <path d="M 118 225 Q 112 250 120 280 L 135 280 Q 128 250 132 225 Z"
          fill="url(#metalBrillo)" opacity=".6"/>

    <!-- ============ CUERPO / CAÑÓN ============ -->
    <!-- Cuerpo principal -->
    <path d="M 140 200
             L 320 200
             Q 340 200 340 215
             L 340 235
             Q 340 250 320 250
             L 140 250
             Q 120 250 115 235
             Q 115 210 140 200 Z"
          fill="url(#cuerpoArma)" stroke="#1a0d60" stroke-width="2"/>

    <!-- Parte superior del cañón (parte de arriba más clara) -->
    <path d="M 165 200
             L 320 200
             Q 340 200 340 215
             L 340 220
             L 165 220 Z"
          fill="url(#cuerpoArmaCara)" opacity=".8"/>

    <!-- Brillo del cuerpo -->
    <path d="M 170 204
             L 315 204
             Q 328 204 328 213
             L 328 218
             L 170 218 Z"
          fill="url(#metalBrillo)" opacity=".5"/>

    <!-- Línea decorativa en el cañón -->
    <line x1="180" y1="235" x2="320" y2="235" stroke="#c4b8ff" stroke-width="1" opacity=".5"/>
    <circle cx="200" cy="235" r="2.5" fill="#1a0d60" stroke="#c4b8ff" stroke-width=".8"/>
    <circle cx="240" cy="235" r="2.5" fill="#1a0d60" stroke="#c4b8ff" stroke-width=".8"/>
    <circle cx="280" cy="235" r="2.5" fill="#1a0d60" stroke="#c4b8ff" stroke-width=".8"/>

    <!-- Mira superior -->
    <rect x="240" y="188" width="30" height="14" rx="3" fill="url(#cuerpoArma)" stroke="#1a0d60" stroke-width="1.5"/>
    <rect x="252" y="184" width="6" height="6" rx="1" fill="#ffd700" stroke="#7a4a00" stroke-width="1"/>

    <!-- ============ BOQUILLA / AGUJERO DEL CAÑÓN ============ -->
    <!-- Borde exterior del cañón -->
    <ellipse cx="340" cy="225" rx="10" ry="18" fill="url(#cañon)" stroke="#1a0d60" stroke-width="2"/>
    <!-- Agujero oscuro -->
    <ellipse cx="340" cy="225" rx="6" ry="12" fill="url(#agujeroCañon)"/>
    <!-- Brillo interior -->
    <ellipse cx="338" cy="220" rx="2.5" ry="4" fill="#8b7bff" opacity=".7"/>

    <!-- ============ GATILLO ============ -->
    <path d="M 155 255
             Q 148 275 155 290
             Q 165 295 172 285
             L 175 250 Z"
          fill="#2a1a80" stroke="#1a0d60" stroke-width="1.5"/>

    <!-- Guardamonte -->
    <path d="M 145 250
             Q 130 268 145 288"
          fill="none" stroke="#5a4ad9" stroke-width="5" stroke-linecap="round"/>

    <!-- ============ DESTELLO DEL DISPARO ============ -->
    <g id="fogonazo">
      <!-- Rayos de luz -->
      <g transform="translate(340,225)">
        <path d="M 0 0 L 30 -8 L 8 -2 Z" fill="#fff8b0" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.30;.35;.50" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 0 0 L 30 0 L 8 0 Z" fill="#ffe27a" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.30;.35;.50" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 0 0 L 30 8 L 8 2 Z" fill="#fff8b0" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.30;.35;.50" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 0 0 L 25 -15 L 6 -4 Z" fill="#ffb800" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.30;.35;.50" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M 0 0 L 25 15 L 6 4 Z" fill="#ffb800" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.30;.35;.50" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <!-- Núcleo brillante -->
        <circle cx="0" cy="0" r="12" fill="#fff" opacity="0" filter="url(#glow)">
          <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.30;.34;.50" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="r" values="8;8;14;8" keyTimes="0;.30;.34;.50" dur="1.6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <!-- ============ HUMO DEL CAÑÓN ============ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;.7;0" keyTimes="0;.30;.40;.70" dur="1.6s" repeatCount="indefinite"/>
    <circle cx="355" cy="215" r="8" fill="#c4b8ff" filter="url(#softBlur)">
      <animate attributeName="cx" values="350;390" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;195" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;18" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="355" cy="235" r="6" fill="#8b7bff" filter="url(#softBlur)">
      <animate attributeName="cx" values="350;385" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="225;255" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;15" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ BILLETES VOLANDO ============ -->
  <!-- Cada billete sale del cañón y vuela en distintas direcciones -->
  <!-- Billete 1: hacia arriba-derecha -->
  <g filter="url(#billeteSom)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.35;.85;1" dur="1.6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="340,225; 340,225; 340,225; 500,120; 540,80"
        keyTimes="0;.30;.32;.70;1"
        dur="1.6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0;0;-200;-540" keyTimes="0;.30;.70;1"
          dur="1.6s" repeatCount="indefinite" additive="sum"/>
        <!-- Billete de 50€ -->
        <rect x="-18" y="-10" width="36" height="20" rx="1.5" fill="url(#billeteGrad)" stroke="#4a6a66" stroke-width=".8"/>
        <rect x="-16" y="-8" width="32" height="16" rx="1" fill="none" stroke="#7a9a96" stroke-width=".4"/>
        <text x="0" y="3" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="#2a4a48">50€</text>
        <circle cx="-10" cy="0" r="3" fill="#a8c8c4" opacity=".7"/>
        <circle cx="10" cy="0" r="3" fill="#a8c8c4" opacity=".7"/>
      </g>
    </g>
  </g>

  <!-- Billete 2: hacia arriba -->
  <g filter="url(#billeteSom)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.35;.85;1" dur="1.6s" begin=".1s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="340,225; 340,225; 380,60; 420,-20"
        keyTimes="0;.30;.70;1"
        dur="1.6s" begin=".1s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0;0;180;400" keyTimes="0;.30;.70;1"
          dur="1.6s" begin=".1s" repeatCount="indefinite" additive="sum"/>
        <rect x="-18" y="-10" width="36" height="20" rx="1.5" fill="url(#billeteGrad2)" stroke="#4a6a66" stroke-width=".8"/>
        <rect x="-16" y="-8" width="32" height="16" rx="1" fill="none" stroke="#7a9a96" stroke-width=".4"/>
        <text x="0" y="3" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="#2a4a48">20€</text>
      </g>
    </g>
  </g>

  <!-- Billete 3: hacia la derecha -->
  <g filter="url(#billeteSom)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.35;.85;1" dur="1.6s" begin=".2s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="340,225; 340,225; 480,200; 560,180"
        keyTimes="0;.30;.70;1"
        dur="1.6s" begin=".2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0;0;-90;-300" keyTimes="0;.30;.70;1"
          dur="1.6s" begin=".2s" repeatCount="indefinite" additive="sum"/>
        <rect x="-18" y="-10" width="36" height="20" rx="1.5" fill="url(#billeteGrad)" stroke="#4a6a66" stroke-width=".8"/>
        <text x="0" y="3" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="#2a4a48">100€</text>
      </g>
    </g>
  </g>

  <!-- Billete 4: hacia abajo-derecha -->
  <g filter="url(#billeteSom)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.35;.85;1" dur="1.6s" begin=".25s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="340,225; 340,225; 460,320; 520,400"
        keyTimes="0;.30;.70;1"
        dur="1.6s" begin=".25s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0;0;150;350" keyTimes="0;.30;.70;1"
          dur="1.6s" begin=".25s" repeatCount="indefinite" additive="sum"/>
        <rect x="-18" y="-10" width="36" height="20" rx="1.5" fill="url(#billeteGrad2)" stroke="#4a6a66" stroke-width=".8"/>
        <text x="0" y="3" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="#2a4a48">10€</text>
      </g>
    </g>
  </g>

  <!-- Billete 5: hacia arriba-izquierda -->
  <g filter="url(#billeteSom)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.35;.85;1" dur="1.6s" begin=".3s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="340,225; 340,225; 380,120; 420,40"
        keyTimes="0;.30;.70;1"
        dur="1.6s" begin=".3s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0;0;-270;-580" keyTimes="0;.30;.70;1"
          dur="1.6s" begin=".3s" repeatCount="indefinite" additive="sum"/>
        <rect x="-18" y="-10" width="36" height="20" rx="1.5" fill="url(#billeteGrad)" stroke="#4a6a66" stroke-width=".8"/>
        <text x="0" y="3" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="#2a4a48">500€</text>
      </g>
    </g>
  </g>

  <!-- Billete 6: recto hacia arriba -->
  <g filter="url(#billeteSom)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.30;.35;.85;1" dur="1.6s" begin=".35s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="340,225; 340,225; 430,120; 480,60"
        keyTimes="0;.30;.70;1"
        dur="1.6s" begin=".35s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0;0;200;460" keyTimes="0;.30;.70;1"
          dur="1.6s" begin=".35s" repeatCount="indefinite" additive="sum"/>
        <rect x="-18" y="-10" width="36" height="20" rx="1.5" fill="url(#billeteGrad2)" stroke="#4a6a66" stroke-width=".8"/>
        <text x="0" y="3" text-anchor="middle" font-family="Georgia,serif" font-size="8" font-weight="bold" fill="#2a4a48">200€</text>
      </g>
    </g>
  </g>

</svg>
</div>

<div class="hint">Pistola Nova · Dispara euros 💶</div>

</body>
</html>
