<!DOCTYPE html>

<meta charset="utf-8">

    background:#111;
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    font-family:system-ui,sans-serif;
    color:#fff;
  }
  .sticker-box{
    width:280px;
    height:280px;
    display:grid;
    place-items:center;
    cursor:pointer;
  }
  .sticker-box svg{width:100%;height:100%}
  .hint{margin-top:10px;font-size:13px;color:#888;text-align:center}
</style>

    <defs>

        <stop offset="100%" stop-color="#7a4a28"/>
      </radialGradient>
      <radialGradient id="pielSombra" cx="60%" cy="70%" r="60%">

<div class="hint">Toca para activar el sonido</div>

<script>
// Sistema de sonido con Web Audio API (sin archivos externos)
let audioCtx = null;
let audioEnabled = false;

function initAudio(){
  if(!audioCtx){
    try{
      audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      audioEnabled = true;
    }catch(e){console.warn('Sin audio:', e)}
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

// Sonido de palmada realista: ruido blanco filtrado + envolvente
function clapSound(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;

  // Capa 1: ruido blanco (el "chasquido" de la piel)
  const bufferSize = audioCtx.sampleRate * 0.15;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++){
    // Ruido con envolvente exponencial
    const t = i / bufferSize;
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3);
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  // Filtro bandpass para que suene "seco"
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1800;
  filter.Q.value = 1.5;

  // Envolvente rápida (ataque agudo, caída rápida)
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.9, now + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(now);
  noise.stop(now + 0.15);

  // Capa 2: "pop" de cuerpo (tono muy bajo)
  const pop = audioCtx.createOscillator();
  const popGain = audioCtx.createGain();
  pop.type = 'sine';
  pop.frequency.setValueAtTime(180, now);
  pop.frequency.exponentialRampToValueAtTime(60, now + 0.08);
  popGain.gain.setValueAtTime(0.0001, now);
  popGain.gain.exponentialRampToValueAtTime(0.4, now + 0.003);
  popGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
  pop.connect(popGain);
  popGain.connect(audioCtx.destination);
  pop.start(now);
  pop.stop(now + 0.12);

  // Capa 3: "tick" agudo (el impacto seco)
  const tick = audioCtx.createOscillator();
  const tickGain = audioCtx.createGain();
  tick.type = 'triangle';
  tick.frequency.setValueAtTime(2800, now);
  tickGain.gain.setValueAtTime(0.0001, now);
  tickGain.gain.exponentialRampToValueAtTime(0.25, now + 0.002);
  tickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
  tick.connect(tickGain);
  tickGain.connect(audioCtx.destination);
  tick.start(now);
  tick.stop(now + 0.05);
}

// Reproducir clap cada vez que las manos chocan
// El ciclo dura 1.4s, las manos chocan en el centro en ~0.7s (50% del ciclo)
function startClapLoop(){
  const cycleMs = 1400;
  const clapOffset = 700; // cuando las manos se juntan
  const tick = () => {
    if(!audioEnabled) return;
    setTimeout(() => clapSound(), clapOffset);
    setTimeout(tick, cycleMs);
  };
  tick();
}

// Activación al primer toque (los navegadores bloquean autoplay)
document.getElementById('clapBox').addEventListener('click', () => {
  initAudio();
  if(!window.__clapStarted){
    window.__clapStarted = true;
    startClapLoop();
    document.querySelector('.hint').textContent = '¡Sonando! 👏';
  } else {
    clapSound(); // clic manual = un clap extra
  }
});

// También activar al primer toque en cualquier parte
document.addEventListener('touchstart', initAudio, {once:true});
document.addEventListener('click', initAudio, {once:true});
</script>
