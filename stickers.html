<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Piel de la mano con volumen -->
    <radialGradient id="piel1" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe4c4"/>
      <stop offset="35%" stop-color="#f5c199"/>
      <stop offset="70%" stop-color="#d99a70"/>
      <stop offset="100%" stop-color="#a86a45"/>
    </radialGradient>
    <radialGradient id="piel2" cx="40%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe9cf"/>
      <stop offset="40%" stop-color="#eebd94"/>
      <stop offset="80%" stop-color="#c98a5e"/>
      <stop offset="100%" stop-color="#8e5632"/>
    </radialGradient>
    <!-- Sombra proyectada -->
    <radialGradient id="sombraMano" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- Ondas de choque con brillo -->
    <radialGradient id="ondaBrillo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="85%" stop-color="#ffe27a" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
    <!-- Filtros -->
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="off"/>
      <feComposite in="SourceGraphic" in2="off" operator="atop"/>
    </filter>
  </defs>

  <!-- Fondo: sombra circular suave -->
  <ellipse cx="100" cy="185" rx="55" ry="8" fill="url(#sombraMano)"/>

  <!-- Ondas de choque (anillos) -->
  <g>
    <circle cx="100" cy="95" r="25" fill="none" stroke="#ffe27a" stroke-width="3" opacity=".9" filter="url(#softBlur)">
      <animate attributeName="r" values="15;75" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="95" r="15" fill="none" stroke="#fff" stroke-width="2" opacity=".7">
      <animate attributeName="r" values="5;60" dur="1.4s" begin=".3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0" dur="1.4s" begin=".3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- MANO IZQUIERDA -->
  <g transform="translate(60,90) rotate(-25)">
    <!-- Sombra base -->
    <ellipse cx="0" cy="10" rx="26" ry="42" fill="#000" opacity=".3" filter="url(#shadowBlur)"/>
    <!-- Palma -->
    <ellipse cx="0" cy="0" rx="26" ry="42" fill="url(#piel1)"/>
    <!-- Sombra interior (borde derecho más oscuro) -->
    <ellipse cx="6" cy="4" rx="22" ry="38" fill="url(#piel2)" opacity=".55"/>
    <!-- Línea de la palma -->
    <path d="M-14 -12 Q 0 -3 14 -12" fill="none" stroke="#8e5632" stroke-width="1.3" opacity=".55" stroke-linecap="round"/>
    <path d="M-16 5 Q 0 14 16 5" fill="none" stroke="#8e5632" stroke-width="1" opacity=".4" stroke-linecap="round"/>
    <!-- Dedos (4) -->
    <g>
      <!-- Índice -->
      <ellipse cx="-16" cy="-32" rx="7" ry="18" fill="url(#piel1)"/>
      <ellipse cx="-15" cy="-34" rx="5" ry="14" fill="url(#piel2)" opacity=".5"/>
      <ellipse cx="-18" cy="-42" rx="3.5" ry="3" fill="#fff" opacity=".35"/>
      <!-- Medio -->
      <ellipse cx="-5" cy="-38" rx="7" ry="20" fill="url(#piel1)"/>
      <ellipse cx="-4" cy="-40" rx="5" ry="16" fill="url(#piel2)" opacity=".5"/>
      <ellipse cx="-7" cy="-50" rx="3.5" ry="3" fill="#fff" opacity=".35"/>
      <!-- Anular -->
      <ellipse cx="6" cy="-36" rx="7" ry="19" fill="url(#piel1)"/>
      <ellipse cx="7" cy="-38" rx="5" ry="15" fill="url(#piel2)" opacity=".5"/>
      <ellipse cx="4" cy="-47" rx="3.5" ry="3" fill="#fff" opacity=".35"/>
      <!-- Meñique -->
      <ellipse cx="17" cy="-30" rx="6.5" ry="15" fill="url(#piel1)"/>
      <ellipse cx="18" cy="-32" rx="4.5" ry="12" fill="url(#piel2)" opacity=".5"/>
      <ellipse cx="15" cy="-39" rx="3" ry="2.5" fill="#fff" opacity=".35"/>
    </g>
    <!-- Uñas sutiles -->
    <ellipse cx="-16" cy="-47" rx="3" ry="4" fill="#ffe9cf" opacity=".6"/>
    <ellipse cx="-5" cy="-55" rx="3" ry="4" fill="#ffe9cf" opacity=".6"/>
    <ellipse cx="6" cy="-52" rx="3" ry="4" fill="#ffe9cf" opacity=".6"/>
    <ellipse cx="17" cy="-43" rx="2.5" ry="3.5" fill="#ffe9cf" opacity=".6"/>
  </g>

  <!-- MANO DERECHA (espejada) -->
  <g transform="translate(140,90) rotate(25)">
    <ellipse cx="0" cy="10" rx="26" ry="42" fill="#000" opacity=".3" filter="url(#shadowBlur)"/>
    <ellipse cx="0" cy="0" rx="26" ry="42" fill="url(#piel1)"/>
    <ellipse cx="-6" cy="4" rx="22" ry="38" fill="url(#piel2)" opacity=".55"/>
    <path d="M-14 -12 Q 0 -3 14 -12" fill="none" stroke="#8e5632" stroke-width="1.3" opacity=".55" stroke-linecap="round"/>
    <path d="M-16 5 Q 0 14 16 5" fill="none" stroke="#8e5632" stroke-width="1" opacity=".4" stroke-linecap="round"/>
    <g>
      <ellipse cx="16" cy="-32" rx="7" ry="18" fill="url(#piel1)"/>
      <ellipse cx="15" cy="-34" rx="5" ry="14" fill="url(#piel2)" opacity=".5"/>
      <ellipse cx="18" cy="-42" rx="3.5" ry="3" fill="#fff" opacity=".35"/>
      <ellipse cx="5" cy="-38" rx="7" ry="20" fill="url(#piel1)"/>
      <ellipse cx="4" cy="-40" rx="5" ry="16" fill="url(#piel2)" opacity=".5"/>
      <ellipse cx="7" cy="-50" rx="3.5" ry="3" fill="#fff" opacity=".35"/>
      <ellipse cx="-6" cy="-36" rx="7" ry="19" fill="url(#piel1)"/>
      <ellipse cx="-7" cy="-38" rx="5" ry="15" fill="url(#piel2)" opacity=".5"/>
      <ellipse cx="-4" cy="-47" rx="3.5" ry="3" fill="#fff" opacity=".35"/>
      <ellipse cx="-17" cy="-30" rx="6.5" ry="15" fill="url(#piel1)"/>
      <ellipse cx="-18" cy="-32" rx="4.5" ry="12" fill="url(#piel2)" opacity=".5"/>
      <ellipse cx="-15" cy="-39" rx="3" ry="2.5" fill="#fff" opacity=".35"/>
    </g>
    <ellipse cx="16" cy="-47" rx="3" ry="4" fill="#ffe9cf" opacity=".6"/>
    <ellipse cx="5" cy="-55" rx="3" ry="4" fill="#ffe9cf" opacity=".6"/>
    <ellipse cx="-6" cy="-52" rx="3" ry="4" fill="#ffe9cf" opacity=".6"/>
    <ellipse cx="-17" cy="-43" rx="2.5" ry="3.5" fill="#ffe9cf" opacity=".6"/>
  </g>

  <!-- Destellos voladores -->
  <g>
    <path d="M40 40 L 42 46 L 48 48 L 42 50 L 40 56 L 38 50 L 32 48 L 38 46 Z" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M160 40 L 162 46 L 168 48 L 162 50 L 160 56 L 158 50 L 152 48 L 158 46 Z" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin=".9s" repeatCount="indefinite"/>
    </path>
    <circle cx="70" cy="40" r="2.5" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="45" r="2" fill="#fff">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin=".5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
