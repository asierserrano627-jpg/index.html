function review(){camOff();const u=URL.createObjectURL(blob);$('#m').innerHTML=`<div class="rv"><video style="${esc(cf)}" src="${u}" playsinline controls loop autoplay></video><div class="pn"><div class="chips c"><button class="btn o" id="rt">Repetir</button><button class="btn" id="nx">Siguiente</button></div></div></div>`;
 $('#rt').onclick=()=>open(true);$('#nx').onclick=()=>editor(new File([blob],'grabacion.webm',{type:blob.type}),cf)}
function editor(f,fl=''){document.body.classList.remove('nl');camOff();const u=URL.createObjectURL(f);$('#m').innerHTML=`<div class="pg"><h2>Detalles del vídeo</h2><video src="${u}" controls muted playsinline class="pv"></video><p><input id="d" maxlength="150" placeholder="Descripción" aria-label="Descripción"></p><p><input id="h" placeholder="#hashtags separados por espacios" aria-label="Hashtags"></p><p><select id="fl" aria-label="Filtro"><option value="">Sin filtro</option><option value="filter:grayscale(1) contrast(1.1)">Blanco y negro</option><option value="filter:saturate(1.9) contrast(1.05)">Vívido</option><option value="filter:sepia(.8)">Retro</option><option value="filter:hue-rotate(200deg) saturate(1.4)">Neón frío</option><option value="filter:sepia(.35) saturate(1.5) hue-rotate(-20deg)">Cálido</option><option value="filter:contrast(1.35) brightness(.9) saturate(.8)">Cine</option></select></p><p><input id="tx" maxlength="40" placeholder="Texto sobre el vídeo (opcional)" aria-label="Texto"></p><p><select id="sp" aria-label="Velocidad"><option value="0.5">Velocidad 0.5×</option><option value="1" selected>Velocidad 1×</option><option value="1.5">Velocidad 1.5×</option><option value="2">Velocidad 2×</option></select></p><p><label><input type="checkbox" id="cc" checked style="width:auto"> Permitir comentarios</label></p><p><label><input type="checkbox" id="mu" style="width:auto"> Silenciar audio original</label></p><div class="chips"><button class="btn o" id="dr">Guardar borrador</button><button class="btn" id="pb">Publicar</button></div></div>`;
 $('#fl').value=fl;$('.pv').style.cssText=fl;$('#fl').onchange=()=>{$('.pv').style.cssText=$('#fl').value};$('#dr').onclick=()=>toast('Borrador guardado (demo)');
 $('#pb').onclick=async()=>{const id='u'+Date.now().toString(36);S.meta.unshift({id,d:$('#d').value.trim()||'Mi vídeo',tags:($('#h').value.match(/#[\w\u00C0-\u024F]{1,30}/g)||[]).slice(0,8),t:Date.now(),src:u,f:$('#fl').value,txt:$('#tx').value.trim(),sp:+$('#sp').value,nc:!$('#cc').checked,mu:$('#mu').checked});await idb('put',f,id);save();toast('Vídeo publicado');go('#/v/'+id)}}
/* Paneles */
const closeSheet=()=>{$('#ov').innerHTML=''};
function sheet(t,body,foot=''){$('#ov').innerHTML=`<div class="sheet" role="dialog" aria-label="${t}"><div class="sh"><span>${t}</span><button data-a="x" aria-label="Cerrar">${ic('x',20)}</button></div><div class="sb">${body}</div>${foot}</div>`}
const cmH=id=>cms(id).map(c=>`<div class="cm" style="display:flex;gap:8px">${avt(30)}<div><b>@${esc(c.u)}</b><div>${esc(c.t)}</div></div></div>`).join('')||'<p class="mu">Sé el primero en comentar.</p>';
/* Acciones */
function readAv(f){const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const z=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-z)/2,(i.height-z)/2,z,z,0,0,256,256);URL.revokeObjectURL(u);ME.av=c.toDataURL('image/jpeg',.85);save();$('#ap').innerHTML=avt(96);toast('Foto actualizada')};i.onerror=()=>toast('No se pudo leer la foto');i.src=u}
const A={x:closeSheet,pk:()=>$('#pf').click(),
 like:e=>like(e.closest('.card')),
 sv:e=>{const id=e.closest('.card').dataset.id;S.saved[id]?delete S.saved[id]:S.saved[id]=1;save();refresh(id);toast(S.saved[id]?'Guardado':'Eliminado de guardados')},
 mute:()=>{S.muted=!S.muted;save();document.querySelectorAll('video').forEach(v=>v.muted=S.muted);document.querySelectorAll('[data-a=mute] b').forEach(b=>b.innerHTML=ic(S.muted?'voloff':'volon'));toast(S.muted?'Silenciado':'Sonido activado')},
 cm:e=>{curC=e.closest('.card').dataset.id;if(vid(curC).nc)return toast('Comentarios desactivados');sheet('Comentarios',`<div id="cl">${cmH(curC)}</div>`,`<div class="cf"><input id="ci" placeholder="Escribe un comentario…" aria-label="Comentario" autocomplete="off"><button class="btn" data-a="cmp">Publicar</button></div>`);$('#ci').onkeydown=ev=>{ev.key=='Enter'&&A.cmp()}},
 cmp:()=>{const t=$('#ci').value.trim();if(!t)return;cms(curC).unshift({u:ME.u,t});save();$('#cl').innerHTML=cmH(curC);$('#ci').value='';refresh(curC)},
 del:async e=>{const id=e.closest('.card').dataset.id;if(!confirm('¿Borrar este vídeo?'))return;S.meta=S.meta.filter(v=>v.id!=id);await idb('delete',id);save();go('#/')},
 bio:()=>{const ln=t=>t?Math.max(0,Math.ceil((t+D7-Date.now())/864e5)):0,a=ln(ME.nAt),b=ln(ME.uAt),nt=d=>d?'Podrás cambiarlo de nuevo en '+d+(d>1?' días':' día'):'Solo puedes cambiarlo una vez cada 7 días';
  sheet('Editar perfil',`<div style="text-align:center"><button id="ap" data-a="pk" aria-label="Cambiar foto">${avt(96)}</button><p><button class="btn o" data-a="pk">Cambiar foto</button></p></div><label for="en">Nombre visible</label><p><input id="en" value="${esc(ME.n)}" maxlength="24" ${a?'disabled':''}></p><p class="mu" style="font-size:12px">${nt(a)}</p><label for="eu">Nombre de usuario</label><p><input id="eu" value="${esc(ME.u)}" maxlength="20" ${b?'disabled':''}></p><p class="mu" style="font-size:12px">${nt(b)}</p><label for="bi">Biografía</label><p><input id="bi" value="${esc(ME.bio||'')}" maxlength="120"></p><input id="pf" type="file" accept="image/*" hidden><button class="btn" data-a="bios">Guardar</button>`);
  $('#pf').onchange=e=>{const f=e.target.files[0];f&&readAv(f)}},
 bios:()=>{const n=$('#en').value.trim(),u=cl($('#eu').value),cn=!$('#en').disabled&&n!=ME.n,cu=!$('#eu').disabled&&u!=ME.u;
  if(cn&&n.length<2)return toast('El nombre necesita al menos 2 letras');
  if(cu&&u.length<3)return toast('El usuario necesita 3 caracteres o más');
  if(cn){ME.n=n;ME.nAt=Date.now()}
  if(cu){const o=ME.u;ME.u=u;ME.uAt=Date.now();Object.values(S.com).forEach(a=>a.forEach(c=>{if(c.u==o)c.u=u}))}
  ME.bio=$('#bi').value;save();closeSheet();toast('Perfil actualizado');profile()},
 th:()=>{S.theme={auto:'dark',dark:'light',light:'auto'}[S.theme];theme();save();profile()},
 out:()=>{S.acct=null;ME=null;save();welcome()}};
document.addEventListener('click',ev=>{const al=ev.target.closest('a[href^="#/"]');if(al){ev.preventDefault();ME&&go(al.getAttribute('href'));return}
 const b=ev.target.closest('[data-a]');if(b){const f=A[b.dataset.a];f&&f(b);return}
 const c=ev.target.closest('.card');if(c&&!ev.target.closest('a,button')){const n=Date.now(),v=c.querySelector('video'),tg=()=>v.paused?v.play().catch(()=>{}):v.pause();tg();if(n-lastTap<300){tg();like(c,true)}lastTap=n}});
window.addEventListener('hashchange',()=>{if(ME&&location.hash&&location.hash!=H){H=location.hash;route()}});
/* Rutas */
function route(){const[r,a]=H.slice(2).split('/'),p=decodeURIComponent(a||'');closeSheet();camOff();document.body.classList.remove('nl');
 document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.r==(r=='v'||r=='t'?'':r)));
 try{(({'':()=>feed(),v:()=>feed(p),discover,create:()=>open(true),profile,activity,hist:history2,t:()=>tagPage(p)})[r]||(()=>feed()))()}
 catch(e){$('#m').innerHTML='<div class="em">Ups, algo salió mal.<br><br><a class="btn" href="#/">Volver al inicio</a></div>'}}
/* Bienvenida (corregido: la función se llama enter y ya no se llama a sí misma) */
function welcome(){document.body.classList.add('nl');closeSheet();
 $('#m').innerHTML=`<div class="wl"><div class="wc"><span class="logo">Nova</span><p style="font-size:19px;opacity:.85">Tu historia, en vertical.</p>
 <div class="gl" id="wf"><label for="wn">Tu nombre</label><input id="wn" maxlength="24" placeholder="Ej. Alex" autocomplete="off"><label for="wu">Nombre de usuario</label><input id="wu" maxlength="20" placeholder="alex.nova" autocomplete="off"><p id="we" role="alert" style="color:#ffb4c0;min-height:20px;font-size:13px"></p><button type="button" id="wb" class="btn" style="width:100%;padding:14px;font-size:16px">Entrar a Nova</button><p style="text-align:center;margin-top:12px;font-size:12px;color:#c4c4d8">Cuenta local: se guarda solo en este dispositivo.</p></div></div></div>`;
 const enter=()=>{const n=$('#wn').value.trim(),cl=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9._]/g,'');let u=cl($('#wu').value.trim())||cl(n);
  if(n.length<2){$('#we').textContent='Escribe tu nombre (mínimo 2 letras).';$('#wn').focus();return}
  if(u.length<3)u=(u+'nova'+(Math.random()*900+100|0)).slice(0,20);
  S.acct={n,u,bio:''};ME=S.acct;save();document.body.classList.remove('nl');go('#/')};
 $('#wb').onclick=enter;$('#wf').onkeydown=e=>{e.key=='Enter'&&enter()}}
/* Inicio */
(async()=>{await Promise.all(S.meta.map(async v=>{const b=await idb('get',v.id);if(b)v.src=URL.createObjectURL(b)}));S.meta=S.meta.filter(v=>v.src);theme();
 if(S.acct){ME=S.acct;route()}else welcome()})();
</script></body></html>
