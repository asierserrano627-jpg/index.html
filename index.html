<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Nova · vídeos verticales</title>
<style>
:root{--bg:#0b0b12;--sf:#16161f;--tx:#f5f5fa;--mu:#9a9ab0;--ac:#8b7bff;--ac2:#35d0ff;--bd:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f5f5fa;--sf:#fff;--tx:#14141c;--mu:#62627a;--bd:rgba(0,0,0,.1)}}
:root[data-theme=light]{--bg:#f5f5fa;--sf:#fff;--tx:#14141c;--mu:#62627a;--bd:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0}html,body{height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
main{flex:1;min-height:0;position:relative;overflow:hidden}
nav{display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--bd);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
nav a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mu);padding:4px 10px}nav a.on{color:var(--tx)}
nav a b{display:grid;place-items:center;height:30px;font-weight:400}nav a.mk b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:12px;width:44px}
body.nl nav{display:none}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}.feed::-webkit-scrollbar{display:none}
.v{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;place-items:center}
.card{position:relative;width:100%;max-width:calc((100dvh - 70px)*9/16);height:100%;overflow:hidden;background:#000;color:#fff;user-select:none;touch-action:pan-y}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.75));pointer-events:none}
.info{position:absolute;left:14px;right:80px;bottom:16px;display:flex;flex-direction:column;gap:6px;text-shadow:0 1px 6px #0008}
.tags a{color:#cfe8ff;font-weight:600}
.rail{position:absolute;right:8px;bottom:20px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:600;gap:2px;text-shadow:0 1px 4px #0008}
.rail b{width:46px;height:46px;border-radius:50%;background:rgba(40,20,90,.3);border:1px solid rgba(170,150,255,.4);backdrop-filter:blur(6px);display:grid;place-items:center;transition:transform .15s}
.rail button:active b{transform:scale(.85)}.rail .act b{background:rgba(139,123,255,.45);box-shadow:0 0 16px rgba(139,123,255,.6)}
.heart{position:absolute;left:50%;top:45%;animation:hp .8s forwards;pointer-events:none}
@keyframes hp{0%{transform:translate(-50%,-50%) scale(0)}30%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-90%);opacity:0}}
.pg{height:100%;overflow-y:auto;padding:16px;max-width:760px;margin:auto}
.pg p{margin:10px 0}h2{font-size:22px;margin:16px 0 10px}h2:first-child{margin-top:4px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;width:100%}
textarea{resize:none;font-family:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}.c{justify-content:center}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gi{aspect-ratio:9/14;border-radius:14px;background:#000;color:#fff;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:8px;font-size:12px}
.gi video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.gi span{position:relative;text-shadow:0 1px 4px #000}
.mu{color:var(--mu)}.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:99px;padding:10px 20px;font-weight:700;display:inline-block;transition:transform .15s}.btn:active{transform:scale(.93)}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.st{display:flex;gap:24px;margin:12px 0}.st b{display:block;font-size:20px}
.em{text-align:center;padding:50px 10px;color:var(--mu)}.em b{display:block;margin-bottom:8px}.em h2{color:var(--tx)}
.ic{flex:none;vertical-align:middle}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;height:70dvh;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .3s}
@media(min-width:900px){.sheet{left:auto;width:380px;top:0;height:auto;border-radius:0}}
@keyframes up{from{transform:translateY(100%)}}
.sh{display:flex;justify-content:space-between;padding:14px 16px;font-weight:700;border-bottom:1px solid var(--bd)}.sb{flex:1;overflow:auto;padding:8px 16px}
.cm{padding:8px 0}.cf{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
.tt{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:99px;z-index:99;font-weight:600;animation:tt 2s forwards;pointer-events:none}
@keyframes tt{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}
.logo{font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wl{position:absolute;inset:0;overflow:auto;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#2b1c78,transparent 55%),radial-gradient(circle at 85% 95%,#0a4f78,transparent 55%),#07070d;color:#fff}
.wc{width:min(100%,400px);text-align:center}.wc .logo{font-size:72px;display:block}
.gl{background:#ffffff12;border:1px solid #ffffff28;border-radius:28px;padding:22px;margin-top:22px;text-align:left}
.gl input{background:#ffffff14;border-color:#ffffff30;color:#fff;margin:4px 0 12px}.gl input::placeholder{color:#fff9}.gl label{color:#c4c4d8;font-size:13px}
.cam,.rv{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.cb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(40,20,90,.45);border:1px solid rgba(170,150,255,.45);color:#fff}
.tm{position:absolute;top:calc(68px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#0007;border-radius:99px;padding:4px 14px;font-weight:700;z-index:3}
.tm.rc:before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b5c;margin-right:8px}
.cbot{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;z-index:3}
.rec{width:80px;height:80px;flex:none;border-radius:50%;border:4px solid #fff;background:#fe2c55;box-shadow:inset 0 0 0 4px rgba(0,0,0,.55);transition:border-radius .3s,transform .25s}.rec.on{border-radius:22px;transform:scale(.65)}
.rv{display:flex;flex-direction:column}.rv video{flex:1;min-height:0;width:100%;object-fit:contain}.rv .pn{background:var(--sf);color:var(--tx);padding:14px}
.tx{position:absolute;left:14px;right:14px;top:36%;text-align:center;font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 14px #000;pointer-events:none}.pv{width:100%;max-height:40vh;border-radius:16px;background:#000}
.cshade{position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.tl{position:absolute;right:10px;top:calc(76px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:20px;z-index:3}
.tb{color:#fff;filter:drop-shadow(0 1px 4px #000a);display:grid;place-items:center;width:40px;height:40px;border-radius:50%}.tb.on{background:rgba(255,255,255,.28)}
.cd{display:none;position:absolute;inset:0;place-items:center;font-size:120px;font-weight:800;background:#0005;z-index:4;pointer-events:none}
.durs{display:flex;gap:4px;font-size:13px;font-weight:700}.durs button{color:#fffc;padding:6px 12px;border-radius:99px}.durs .on{background:#fff;color:#000}
.fx{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid transparent;color:#fff;font-size:9px;font-weight:700}.fx.on{border-color:#fff}
.brow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;padding:0 14px}
.gal{width:38px;height:38px;border:2px solid #fff;border-radius:9px;display:grid;place-items:center;color:#fff;background:#fff3}
.gx,nav a b,.rail b,.cb,.tb,.btn.o{background:radial-gradient(circle at 25% 20%,rgba(139,123,255,.5),transparent 60%),radial-gradient(circle at 80% 90%,rgba(53,208,255,.38),transparent 60%),radial-gradient(1px 1px at 20% 70%,#fff,transparent),radial-gradient(1px 1px at 70% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 55%,#fff9,transparent),rgba(30,15,80,.35);border:1px solid rgba(170,150,255,.4);backdrop-filter:blur(8px);box-shadow:0 0 14px rgba(139,123,255,.35),inset 0 0 10px rgba(255,255,255,.08);color:#f0ecff}
nav a b{width:44px;border-radius:14px}nav a.mk b{border:0;color:#fff}nav a.on b{box-shadow:0 0 18px rgba(139,123,255,.8);animation:pop .45s}
.rail .act b{animation:pop .45s}
button,.btn,nav a{transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
button:active,.btn:active,nav a:active{transform:scale(.88)}
@media(hover:hover){.btn:hover,.rail button:hover b,.cb:hover,.tb:hover,nav a:hover b{transform:translateY(-2px) scale(1.06);box-shadow:0 0 20px rgba(139,123,255,.7)}}
@keyframes pop{40%{transform:scale(1.25) rotate(-6deg)}}
nav a.mk b{animation:glow 3s infinite}@keyframes glow{50%{box-shadow:0 0 22px rgba(53,208,255,.8)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.cam{background:radial-gradient(circle at 20% 15%,#2b1c78,transparent 55%),radial-gradient(circle at 85% 90%,#0a4f78,transparent 55%),#07070d}
.av{border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:800;flex:none;overflow:hidden}.rail .av{border:2px solid #fff}
input:disabled{opacity:.5}
.nc{display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 32px 170px;z-index:2}.nc p{max-width:420px}
.tl{gap:18px}.tb{width:46px;height:46px}.cbot{gap:22px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
.brow{display:flex;justify-content:space-between;align-items:center;padding:0 36px}.brow>*{width:46px}.brow .rec{width:80px}
.durs{gap:8px}.durs button{padding:8px 14px}
#intro{position:fixed;inset:0;z-index:200;background:#06040f;display:grid;place-items:center;overflow:hidden;color:#fff;transition:background 2.2s ease-in,opacity .9s}
#intro.out{background:#000}#intro.end{opacity:0;pointer-events:none}
#ic{position:absolute;inset:0;width:100%;height:100%;transition:opacity 2.2s ease-in}
#inw{position:relative;z-index:2;text-align:center;transition:opacity 2.2s ease-in}
#intro.out #ic,#intro.out #inw{opacity:0}
#inm{display:flex;justify-content:center;font-size:clamp(68px,24vw,130px);font-weight:800;letter-spacing:.04em;line-height:1.1}
#inm span{opacity:0;transform:scale(2.4) translateY(12px);filter:blur(18px);background:linear-gradient(110deg,#c9bfff 0%,#8b7bff 35%,#fff 50%,#35d0ff 65%,#8b7bff 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
#inm span.on{animation:lt 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes lt{to{opacity:1;transform:none;filter:blur(0) drop-shadow(0 0 22px rgba(139,123,255,.9))}}
#inm.sh span.on{animation:lt 0s forwards,sw 1.8s ease-in-out var(--d) both}
@keyframes sw{from{background-position:100% 0}to{background-position:0 0}}
.fl{position:absolute;left:-35%;right:-35%;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,rgba(170,205,255,.95),transparent);box-shadow:0 0 30px 6px rgba(139,123,255,.5);transform:scaleX(0);opacity:0}
.fl.on{animation:fl 1.6s ease-out forwards}@keyframes fl{0%{transform:scaleX(0);opacity:1}60%{opacity:1}100%{transform:scaleX(1);opacity:0}}
#isub{margin-top:8px;opacity:0;font-size:17px;color:#d6d0ff;letter-spacing:.06em;transition:opacity 1.2s}#isub.on{opacity:.85}
#ild{position:absolute;opacity:0;font-size:20px;font-weight:600;letter-spacing:.14em;color:#cfc8ff;transition:opacity 1s;z-index:3}#intro.ld #ild{opacity:1}
#ild i{font-style:normal;animation:bl 1.2s infinite both}#ild i:nth-child(2){animation-delay:.2s}#ild i:nth-child(3){animation-delay:.4s}@keyframes bl{0%,100%{opacity:.15}50%{opacity:1}}
#ihint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:#cfc8ff;opacity:0;transition:opacity .6s;z-index:3}#ihint.on{opacity:.8}#intro.out #ihint{opacity:0}

@media(max-width:430px){
  nav{padding-left:2px;padding-right:2px}
  nav a{padding:3px 4px;font-size:10px;min-width:0}
  nav a b{width:38px;height:28px}
  nav a.mk b{width:40px}
}
@media(max-width:360px){
  nav a{padding-left:2px;padding-right:2px;font-size:9px}
  nav a b{width:34px}
  nav a.mk b{width:36px}
}

.live-stage{position:absolute;inset:0;background:#050507;color:#fff;overflow:hidden}
.live-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#09090d}
.live-stage .live-dark{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.48),transparent 28%,transparent 48%,rgba(0,0,0,.72));pointer-events:none}
.live-head{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:5;display:flex;justify-content:space-between;align-items:center}
.live-me{display:flex;align-items:center;gap:9px;padding:5px 11px 5px 5px;border-radius:999px;background:rgba(0,0,0,.38);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);text-shadow:0 1px 5px #000;cursor:pointer}
.live-me .av{border:2px solid #fff}
.live-me .live-name{display:flex;flex-direction:column;line-height:1.08}.live-name b{font-size:13px}.live-name span{font-size:11px;color:#ddd}
.live-actions{display:flex;gap:7px}.live-pill{min-width:42px;height:36px;padding:0 11px;border-radius:999px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;backdrop-filter:blur(12px)}
.live-chat{position:absolute;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));height:45%;z-index:4;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.live-msgs{display:flex;flex-direction:column;align-items:flex-start;gap:5px;max-height:100%;overflow:auto;scrollbar-width:none;padding-bottom:7px}.live-msgs::-webkit-scrollbar{display:none}
.live-msg{max-width:min(82%,430px);display:flex;align-items:flex-start;gap:7px;padding:5px 9px;border-radius:16px;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);font-size:14px;text-shadow:0 1px 3px #000;animation:livein .18s ease-out}.live-msg .av{margin-top:1px}.live-msg-body{min-width:0}.live-msg-user{font-size:11px;font-weight:800;color:#e6dcff}.live-msg-text{word-break:break-word}
@keyframes livein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.live-compose{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;pointer-events:auto}.live-compose input{height:46px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(12px)}.live-compose input::placeholder{color:#ddd}.live-compose button{height:46px;border-radius:999px;padding:0 17px}
.live-cam-off{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;background:radial-gradient(circle,#251d48,#050507 62%);text-align:center;padding:30px}.live-cam-off>div{max-width:310px}.live-cam-off b{display:block;font-size:22px;margin-bottom:8px}
.live-list{position:absolute;left:0;right:0;bottom:0;transform:translateY(100%);transition:transform .25s;background:rgba(12,10,20,.96);border-radius:22px 22px 0 0;z-index:8;padding:18px}.live-list.on{transform:none}
.google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#111;border-radius:14px;padding:12px 16px;font-weight:750;border:1px solid #ddd;margin-bottom:12px}.google-btn svg{width:20px;height:20px}
.auth-divider{display:flex;align-items:center;gap:10px;color:#aaa;margin:8px 0 12px;font-size:12px}.auth-divider:before,.auth-divider:after{content:'';height:1px;background:#ffffff22;flex:1}

/* ---------- NUEVO: personas, perfil público, chat, racha ---------- */
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;border:1px solid var(--bd);background:var(--sf);cursor:pointer}
.person:active{transform:scale(.98)}
.person .pname{flex:1;min-width:0}
.person .pname b{display:block;font-size:15px}
.person .pname span{font-size:12px;color:var(--mu)}
.person .pact{display:flex;gap:6px}
.person .pact button{padding:6px 12px;font-size:12px}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:16px 0 6px}
.pfhead{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0}
.pfhead .av{width:96px;height:96px;font-size:40px}
.pfstats{display:flex;gap:28px;justify-content:center;margin:12px 0}
.pfstats .s{text-align:center}.pfstats .s b{display:block;font-size:20px}.pfstats .s span{font-size:12px;color:var(--mu)}

/* Chat */
.chatwrap{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--bd);background:var(--bg);z-index:5}
.chathead .av{width:38px;height:38px;font-size:15px}
.chathead .who{flex:1;min-width:0}
.chathead .who b{font-size:15px}
.chathead .who .mu{font-size:12px}
.chathead .back{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sf);border:1px solid var(--bd)}
.streak{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-weight:800;font-size:13px;background:linear-gradient(135deg,#ffb37b,#ff5c8a);color:#fff;box-shadow:0 0 12px rgba(255,92,138,.4)}
.streak.off{background:var(--sf);color:var(--mu);border:1px solid var(--bd);box-shadow:none}
.streak .fire{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.chatbody{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.chatbody::-webkit-scrollbar{width:0}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:6px}
.bub .time{display:block;font-size:10px;opacity:.7;margin-top:4px}
.chatfoot{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--bg);align-items:flex-end}
.chatfoot textarea{flex:1;max-height:120px;min-height:44px;border-radius:22px;padding:11px 16px;line-height:1.35}
.chatfoot button{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.msg-row{display:flex;flex-direction:column}
.msg-row.me{align-items:flex-end}
.msg-row.them{align-items:flex-start}
.typing{font-size:11px;color:var(--mu);padding:0 12px}
.conv-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.conv{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);cursor:pointer}

const SUPABASE_URL='https://eyuqgvdwnauyeykbtxdw.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV5dXFndmR3bmF1eWV5a2J0eGR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTYzMzQsImV4cCI6MjEwNjc5MjMzNH0.hgSqrOjLcWiJgS6LOR-Yu5klYzj1_uh-Uxl8hAHZhVU';

const usernameCache=new Map();
async function getUsername(userId){
  if(!userId)return 'usuario';
  if(usernameCache.has(userId))return usernameCache.get(userId);
  if(supabaseUser&&userId===supabaseUser.id&&ME?.u){usernameCache.set(userId,ME.u);return ME.u}
  const {data}=await sb.from('profiles').select('username').eq('id',userId).maybeSingle();
  const u=data?.username||'usuario';
  usernameCache.set(userId,u);
  return u;
}

  if(!userId)return null;
  const {data}=await sb.from('profiles').select('id,username,display_name,bio,avatar_url').eq('id',userId).maybeSingle();
  return data;
}
async function getMyId(){
  if(supabaseUser)return supabaseUser.id;
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){supabaseUser=session.user;return session.user.id}
  const u=await ensureSupabaseUser();
  return u.id;
}

async function ensureSupabaseUser(){
  if(!sb) throw new Error('No se pudo cargar Supabase JS.');
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){supabaseUser=session.user;return session.user;}
  const {data,error}=await sb.auth.signInAnonymously();
  if(error){
    if(/anonymous|disabled/i.test(error.message||''))
      throw new Error('Activa "Anonymous sign-ins" en Supabase → Authentication → Providers.');
    throw error;
  }
  supabaseUser=data.user;
  return data.user;
}

async function ensureSupabaseProfile(user){
  if(!sb||!user) throw new Error('Sesión de Supabase no disponible.');
  let desired=cl((ME&&ME.u)||user.user_metadata?.preferred_username||user.user_metadata?.user_name||'');
  if(desired.length<3){
    const base=cl((user.user_metadata?.name||user.user_metadata?.full_name||user.email?.split('@')[0]||'nova'));
    desired=(base||'nova').slice(0,14)+'_'+String(user.id||'').replace(/-/g,'').slice(0,5);
  }
  desired=desired.slice(0,20);

  const existing=await sb.from('profiles').select('id,username').eq('id',user.id).maybeSingle();
  if(existing.error) throw existing.error;
  if(existing.data?.id){
    if(existing.data.username&&ME&&ME.u!==existing.data.username){
      ME.u=existing.data.username;S.acct=ME;save();
    }
    return existing.data.username||desired;
  }

  let payload={id:user.id,username:desired};
  let res=await sb.from('profiles').insert(payload).select('id,username').single();
  let attempts=0;
  while(res.error&&String(res.error.code)==='23505'&&attempts<3){
    attempts++;
    payload.username=(desired.slice(0,14)+'_'+Math.random().toString(36).slice(2,7)).slice(0,20);
    res=await sb.from('profiles').insert(payload).select('id,username').single();
  }
  if(res.error) throw res.error;
  if(ME&&ME.u!==payload.username){ME.u=payload.username;S.acct=ME;save()}
  return payload.username;
}

/* ---------- VIDEOS ---------- */
const VIDEO_BUCKET='videos';

async function loadCloudVideos(){
  if(!sb) throw new Error('Supabase no está disponible.');
  const {data,error}=await sb.from('videos')
    .select('id,description,video_url,user_id,profiles(username)')
    .order('id',{ascending:false});
  if(error){
    console.warn('Join profiles falló, reintentando sin join:',error);
    const r2=await sb.from('videos')
      .select('id,description,video_url,user_id')
      .order('id',{ascending:false});
    if(r2.error) throw r2.error;
    return processRemoteVideos(r2.data);
  }
  return processRemoteVideos(data);
}
function processRemoteVideos(data){
  const remote=(data||[]).filter(v=>v&&v.video_url).map(v=>({
    id:String(v.id),d:v.description||'Mi vídeo',tags:[],t:0,src:v.video_url,
    f:'',txt:'',sp:1,nc:false,mu:false,remote:true,
    userId:v.user_id||null,
    username:v.profiles?.username||null,
    likeCount:0,commentCount:0,saveCount:0
  }));
  const remoteIds=new Set(remote.map(v=>String(v.id)));
  const kept=S.meta.filter(v=>!remoteIds.has(String(v.id)));
  S.meta=[...remote,...kept];
  save();
  return remote.length;
}

/* ---------- SOCIAL (likes/comments/saves) ---------- */
async function loadSocialState(videoIds){
  if(!sb||!videoIds.length)return;
  const ids=videoIds.map(String);
  const {data:{session}}=await sb.auth.getSession();
  const uid=session?.user?.id;

  const [likes, comments, saves]=await Promise.all([
    sb.from('likes').select('video_id').in('video_id',ids),
    sb.from('comments').select('video_id').in('video_id',ids),
    sb.from('saves').select('video_id').in('video_id',ids)
  ]);
  const likeMap={}, commentMap={}, saveMap={};
  (likes.data||[]).forEach(r=>likeMap[r.video_id]=(likeMap[r.video_id]||0)+1);
  (comments.data||[]).forEach(r=>commentMap[r.video_id]=(commentMap[r.video_id]||0)+1);
  (saves.data||[]).forEach(r=>saveMap[r.video_id]=(saveMap[r.video_id]||0)+1);

  S.meta.forEach(v=>{
    const key=String(v.id);
    if(!ids.includes(key))return;
    v.likeCount=likeMap[key]||0;
    v.commentCount=commentMap[key]||0;
    v.saveCount=saveMap[key]||0;
  });

  if(uid){
    const [myLikes, mySaves]=await Promise.all([
      sb.from('likes').select('video_id').eq('user_id',uid).in('video_id',ids),
      sb.from('saves').select('video_id').eq('user_id',uid).in('video_id',ids)
    ]);
    S.liked={}; S.saved={};
    (myLikes.data||[]).forEach(r=>S.liked[r.video_id]=1);
    (mySaves.data||[]).forEach(r=>S.saved[r.video_id]=1);
    save();
  }
}
async function toggleLike(videoId){
  const user=await ensureSupabaseUser();
  const id=String(videoId);
  const liked=!!S.liked[id];
  if(liked){
    delete S.liked[id];
    await sb.from('likes').delete().eq('video_id',id).eq('user_id',user.id);
  }else{
    S.liked[id]=1;
    await sb.from('likes').insert({video_id:id,user_id:user.id});
  }
  save();
  const v=vid(videoId);
  if(v)v.likeCount=Math.max(0,(v.likeCount||0)+(liked?-1:1));
  refresh(videoId);
}
async function toggleSave(videoId){
  const user=await ensureSupabaseUser();
  const id=String(videoId);

}

async function refreshCloudFeed(){
  try{
    const count=await loadCloudVideos();
    const remoteIds=S.meta.filter(v=>v.remote).map(v=>String(v.id));
    if(remoteIds.length) await loadSocialState(remoteIds);
    if(ME&&location.hash!=='#/create') route();

  }catch(e){
    console.error('Nova: no se pudieron cargar los vídeos:',e);
    toast('No se pudieron cargar los vídeos de Supabase');
    return -1;
  }
}
async function publishCloudVideo(file, description){
  if(!sb) throw new Error('Supabase no está disponible.');
  const user=await ensureSupabaseUser();
  await ensureSupabaseProfile(user);
  const mime=file.type||'video/webm';
  const ext=mime.includes('mp4')?'mp4':'webm';
  const uid=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
  const path=`${user.id}/${uid}.${ext}`;

  const upload=await sb.storage.from(VIDEO_BUCKET).upload(path,file,{contentType:mime,upsert:false});
  if(upload.error) throw upload.error;

  const {data:pub}=sb.storage.from(VIDEO_BUCKET).getPublicUrl(path);
  const videoUrl=pub?.publicUrl;
  if(!videoUrl){
    await sb.storage.from(VIDEO_BUCKET).remove([path]).catch(()=>{});
    throw new Error('No se pudo obtener la URL pública del vídeo.');
  }

  const res=await sb.from('videos')
    .insert({description:description||'Mi vídeo',video_url:videoUrl,user_id:user.id})
    .select('id,description,video_url,user_id').single();
  if(res.error){
    console.error('Nova: error guardando vídeo',res.error);
    await sb.storage.from(VIDEO_BUCKET).remove([path]).catch(()=>{});
    throw new Error(`No se pudo guardar el vídeo: ${res.error.message||'error'}${res.error.code?` (código ${res.error.code})`:''}`);
  }
  return {
    id:String(res.data.id),d:res.data.description||description||'Mi vídeo',
    tags:[],t:Date.now(),src:res.data.video_url,f:'',txt:'',sp:1,nc:false,mu:false,remote:true,
    userId:res.data.user_id,username:ME?.u||null,
    likeCount:0,commentCount:0,saveCount:0
  };
}

/* ---------- FOLLOWS ---------- */
async function isFollowing(userId){
  const me=await getMyId();
  const {data}=await sb.from('follows').select('following_id').eq('follower_id',me).eq('following_id',userId).maybeSingle();
  return !!data;
}
async function toggleFollow(userId){
  const me=await getMyId();
  const following=await isFollowing(userId);
  if(following){
    await sb.from('follows').delete().eq('follower_id',me).eq('following_id',userId);
    return false;
  }else{
    await sb.from('follows').insert({follower_id:me,following_id:userId});
    return true;
  }
}
async function getFollowCounts(userId){
  const [f1,f2]=await Promise.all([
    sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',userId),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',userId)
  ]);
  return {followers:f1.count||0,following:f2.count||0};
}

async function loadConversationList(){

  const {data,error}=await sb.from('conversations')
    .select('id,user_a,user_b,streak_count,streak_last,a_last_msg,b_last_msg,updated_at')
    .or(`user_a.eq.${me},user_b.eq.${me}`)
    .order('updated_at',{ascending:false})

  if(error){console.error(error);return []}

  const rows=await Promise.all((data||[]).map(async c=>{
    const otherId=c.user_a===me?c.user_b:c.user_a;
    const prof=await getProfile(otherId);
    // Último mensaje
    const {data:lastArr}=await sb.from('messages')
      .select('content,created_at,sender_id')
      .eq('conversation_id',c.id)
      .order('created_at',{ascending:false})
      .limit(1);
    const last=lastArr?.[0]||null;
    return {
      ...c,otherId,

      otherDisplay:prof?.display_name||prof?.username||'usuario',
      lastMsg:last?.content||'',
      lastAt:last?.created_at||c.updated_at
    };
  }));
  return rows;
}

/* ---------- RACHA: lógica de visualización ----------
   Devuelve {count, active, label}
   - active = true si AMBOS escribieron en las últimas 24h (o el trigger ya lo puso)
   - Reset visual: si streak_last < hoy-1 → mostrar 0
*/
function computeStreakDisplay(c){
  if(!c)return {count:0,active:false};
  const today=new Date().toISOString().slice(0,10);
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  let count=c.streak_count||0;
  let active=count>0 && (c.streak_last===today || c.streak_last===y);
  if(c.streak_last && c.streak_last < y){
    // Se rompió
    count=0; active=false;
  }
  return {count,active};
}

async function subscribeLive(liveId){
  if(liveChannel){await sb.removeChannel(liveChannel);liveChannel=null}
  liveChannel=sb.channel('nova-live-'+liveId);
  liveChannel
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'live_messages',filter:'live_id=eq.'+liveId},
      async payload=>{
        const m=payload.new;
        m.__username=await getUsername(m.user_id);
        renderLiveMessage(m);
        const b=$('#liveMessages');if(b)b.scrollTop=b.scrollHeight;
      })
    .on('broadcast',{event:'rtc'},async ({payload})=>{try{await handleRTCSignal(payload)}catch(e){console.error(e)}})
    .subscribe(status=>{
      if(status==='SUBSCRIBED'&&rtcRole==='viewer'){
        liveChannel.send({type:'broadcast',event:'rtc',payload:{type:'viewer-join',from:rtcClientId}});
      }
    });
}
function getLiveVideo(){return $('#liveCam')}
function rtcConfig(){return {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}}
function cleanupRTCPeers(){
  rtcPeers.forEach(pc=>{try{pc.close()}catch(e){}});rtcPeers.clear();rtcRole='';
  const v=getLiveVideo(); if(v&&v.srcObject&&v.srcObject!==liveStream)v.srcObject=null;
}
async function sendRTC(payload){
  if(!liveChannel)return;
  try{await liveChannel.send({type:'broadcast',event:'rtc',payload:{...payload,liveId:currentLive?.id}})}catch(e){}
}
async function makeBroadcasterPeer(viewerId){
  if(!liveStream||!liveChannel)return;
  const old=rtcPeers.get(viewerId); if(old){try{old.close()}catch(e){};rtcPeers.delete(viewerId)}
  const pc=new RTCPeerConnection(rtcConfig()); rtcPeers.set(viewerId,pc);
  liveStream.getTracks().forEach(track=>pc.addTrack(track,liveStream));
  pc.onicecandidate=e=>{if(e.candidate)sendRTC({type:'ice',to:viewerId,from:rtcClientId,candidate:e.candidate})};
  pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){try{pc.close()}catch(e){};rtcPeers.delete(viewerId)}};
  setTimeout(()=>{if(pc.connectionState!=='connected'){try{pc.close()}catch(e){};rtcPeers.delete(viewerId)}},15000);
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await sendRTC({type:'offer',to:viewerId,from:rtcClientId,offer:pc.localDescription});
}
async function handleRTCSignal(msg){
  if(!msg||msg.liveId!==currentLive?.id)return;
  if(msg.type==='viewer-join'&&rtcRole==='broadcaster'&&msg.from){await makeBroadcasterPeer(msg.from);return}
  if(msg.to&&msg.to!==rtcClientId)return;
  if(msg.type==='offer'&&rtcRole==='viewer'){
    const old=rtcPeers.get('broadcaster');if(old){try{old.close()}catch(e){}}
    const pc=new RTCPeerConnection(rtcConfig()); rtcPeers.set('broadcaster',pc);
    pc.ontrack=e=>{
      const v=getLiveVideo();
      if(v&&e.streams[0]){
        v.srcObject=e.streams[0];v.muted=false;v.controls=false;v.style.display='';
        v.play().catch(()=>{});
        const off=$('#liveCamOff');if(off)off.style.display='none';
      }
    };
    pc.onicecandidate=e=>{if(e.candidate)sendRTC({type:'ice',to:msg.from,from:rtcClientId,candidate:e.candidate})};
    pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState))toast('Se perdió la conexión del Live')};
    await pc.setRemoteDescription(msg.offer);
    const answer=await pc.createAnswer(); await pc.setLocalDescription(answer);
    await sendRTC({type:'answer',to:msg.from,from:rtcClientId,answer:pc.localDescription});
    return;
  }
  if(msg.type==='answer'&&rtcRole==='broadcaster'&&msg.from){const pc=rtcPeers.get(msg.from);if(!pc)return;await pc.setRemoteDescription(msg.answer);return}
  if(msg.type==='ice'&&msg.from&&msg.candidate){
    const key=rtcRole==='broadcaster'?msg.from:'broadcaster';
    const pc=rtcPeers.get(key);if(!pc)return;
    try{await pc.addIceCandidate(msg.candidate)}catch(e){console.warn('ICE:',e)}
  }
}

  rtcRole='broadcaster';
  const v=getLiveVideo(); if(v){v.srcObject=liveStream;v.muted=true;v.play().catch(()=>{})}
}
async function joinLiveRTC(){
  if(!window.RTCPeerConnection)throw new Error('Este navegador no admite WebRTC.');
  rtcRole='viewer';
  const v=getLiveVideo();if(v){v.srcObject=null;v.muted=false}
}
let liveStream=null;
async function startLiveCamera(){
  if(liveStream)return liveStream;
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Este navegador no permite usar la cámara aquí.');
  liveStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1080},height:{ideal:1920}},audio:true});
  const v=getLiveVideo(); if(v){v.srcObject=liveStream;v.muted=true;await v.play().catch(()=>{})}
  return liveStream;
}
function stopLiveCamera(){if(liveStream){liveStream.getTracks().forEach(t=>t.stop());liveStream=null}const v=getLiveVideo();if(v)v.srcObject=null}

async function startLive(){
  const title='Mi directo';
  try{

    await startLiveCamera();
    const {data,error}=await sb.from('lives').insert({user_id:user.id,title,status:'live'}).select().single();

    toast('Live iniciado');
  }catch(e){console.error(e);stopLiveCamera();cleanupRTCPeers();toast('No se pudo iniciar el Live: '+(e.message||''))}
}
async function joinLive(id){
  try{
    const {data,error}=await sb.from('lives').select('*').eq('id',id).single();
    if(error)throw error;
    currentLive=data; stopLiveCamera(); cleanupRTCPeers();
    const off=$('#liveCamOff');if(off)off.style.display='grid';
    await loadLiveMessages(id); await subscribeLive(id); await joinLiveRTC();
    $('#liveStatusPill').textContent='VIENDO LIVE';
    $('#startLiveBtn').style.display='none'; $('#endLiveBtn').style.display='none';
    toast('Conectado al Live');
  }catch(e){toast('No se pudo abrir el Live: '+(e.message||''))}
}
async function endLive(){
  if(!currentLive)return;
  try{
    const {error}=await sb.from('lives').update({status:'ended',ended_at:new Date().toISOString()}).eq('id',currentLive.id);
    if(error)throw error;
    if(liveChannel){await sb.removeChannel(liveChannel);liveChannel=null}

    $('#liveStatusPill').textContent='LIVE'; $('#startLiveBtn').style.display=''; $('#endLiveBtn').style.display='none';

function feed(first){
  let l=[...S.meta];
  if(first){const f=vid(first);if(f)l=[f,...l.filter(v=>v!=f)]}

    ?`<div class="feed" id="fd" tabindex="0">${l.map(slide).join('')}</div>`
    :`<div class="em" style="padding-top:28vh"><b>${ic('play',44)}</b><h2>Aquí aparecerán los vídeos</h2><p>Todavía no se ha publicado nada.</p><div class="chips c"><button class="btn o" id="reloadCloud">Actualizar</button><a class="btn" href="#/create">Crear vídeo</a></div></div>`;
  const fd=$('#fd');
  if(!fd){const rb=$('#reloadCloud');rb&&(rb.onclick=refreshCloudFeed);return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    const vd=e.target.querySelector('video');
    const cd=e.target.querySelector('.card');
    const m=vid(cd.dataset.id)||{};
    if(e.isIntersecting){
      vd.playbackRate=m.sp||1;
      vd.muted=S.muted||!!m.mu;
      vd.play().catch(()=>{});
      cd._t=setTimeout(()=>{if(!S.hist.includes(m.id)){S.hist.unshift(m.id);S.hist=S.hist.slice(0,50);save()}},2000);
    }else{clearTimeout(cd._t);vd.pause()}
  }),{root:fd,threshold:.6});
  fd.querySelectorAll('.v').forEach(s=>io.observe(s));
}

/* ---------- DESCUBRIR (vídeos + hashtags + personas) ---------- */
function discover(){
  $('#m').innerHTML=`<div class="pg">
    <input id="q" type="search" placeholder="Buscar vídeos, #hashtags o @personas…" aria-label="Buscar" autocomplete="off">
    <div id="res" style="margin-top:14px"></div>
  </div>`;
  const run=async()=>{
    const raw=$('#q').value.trim().toLowerCase();
    const t=raw.replace(/^[#@]/,'');
    // Vídeos + hashtags
    const videos=S.meta.filter(v=>!t||v.d.toLowerCase().includes(t)||v.tags.some(x=>x.toLowerCase().includes(t)));
    let videosHtml=videos.length?`<div class="sec-t">Vídeos</div>${grid(videos)}`:'';
    // Personas
    let peopleHtml='';
    if(t.length>=2){
      const {data,error}=await sb.from('profiles')
        .select('id,username,display_name')
        .or(`username.ilike.%${t}%,display_name.ilike.%${t}%`)
        .limit(20);
      if(!error&&data?.length){
        const rows=await Promise.all(data.map(async p=>{
          const {count}=await sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',p.id);
          return `<div class="person" data-uid="${esc(p.id)}">
            ${avt(44,p.username)}
            <div class="pname"><b>${esc(p.display_name||p.username)}</b><span>@${esc(p.username)} · ${count||0} seguidores</span></div>
            <div class="pact">
              <button class="btn o" data-follow="${esc(p.id)}">Seguir</button>
              <button class="btn" data-msg="${esc(p.id)}" data-uname="${esc(p.username)}">Mensaje</button>
            </div>
          </div>`;
        }));
        peopleHtml=`<div class="sec-t">Personas</div><div class="people">${rows.join('')}</div>`;
      }
    }
    $('#res').innerHTML=(peopleHtml||videosHtml)?(peopleHtml+videosHtml):'<div class="em">Nada por aquí.</div>';
    // listeners
    $('#res').querySelectorAll('.person').forEach(el=>el.onclick=ev=>{
      if(ev.target.closest('button'))return;
      go('#/u/'+el.dataset.uid);
    });
    $('#res').querySelectorAll('[data-follow]').forEach(b=>b.onclick=async ev=>{
      ev.stopPropagation();
      try{
        const id=b.dataset.follow;
        const now=await toggleFollow(id);
        toast(now?'Siguiendo ✅':'Dejaste de seguir');
        b.textContent=now?'Siguiendo':'Seguir';
      }catch(e){toast('Error: '+e.message)}
    });
    $('#res').querySelectorAll('[data-msg]').forEach(b=>b.onclick=async ev=>{
      ev.stopPropagation();
      try{
        const id=b.dataset.msg;
        const convId=await getOrCreateConversation(id);
        go('#/c/'+convId);
      }catch(e){toast('Error: '+e.message)}
    });
  };
  let tmr=null;
  $('#q').oninput=()=>{clearTimeout(tmr);tmr=setTimeout(run,250)};
  run();
}

async function sendCurrentMessage(){
  const ta=$('#chatInput'); if(!ta)return;
  const content=ta.value.trim(); if(!content)return;

    await sendChatMessage(currentChat.convId,content);
    ta.value=''; ta.style.height='auto';

async function loadAndRenderMessages(convId){
  const box=$('#chatBody'); if(!box)return;
  const msgs=await loadMessages(convId);
  const me=await getMyId();
  renderMessages(box,msgs,me);
}

function renderMessages(box,msgs,me){
  box.innerHTML=msgs.map(m=>{
    const mine=m.sender_id===me;
    const t=new Date(m.created_at);
    const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    return `<div class="msg-row ${mine?'me':'them'}"><div class="bub ${mine?'me':'them'}">${esc(m.content)}<span class="time">${hh}</span></div></div>`;
  }).join('')||'<div class="em" style="padding:30px 10px"><b>'+ic('chat',36)+'</b>Envía el primer mensaje para empezar la racha 🔥</div>';
  box.scrollTop=box.scrollHeight;
}

function updateStreakPill(conv){
  const pill=$('#streakPill'); if(!pill)return;
  const s=computeStreakDisplay(conv);
  pill.querySelector('#streakNum').textContent=s.count;
  pill.classList.toggle('off',!s.active||s.count===0);
}

async function subscribeChat(convId){
  if(chatChannel){await sb.removeChannel(chatChannel);chatChannel=null}
  chatChannel=sb.channel('nova-chat-'+convId)
    .on('postgres_changes',
      {event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+convId},
      async payload=>{
        const box=$('#chatBody'); if(!box)return;
        const me=await getMyId();
        const m=payload.new;
        const mine=m.sender_id===me;
        const t=new Date(m.created_at);
        const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
        const empty=box.querySelector('.em'); if(empty)box.innerHTML='';
        const row=document.createElement('div');
        row.className='msg-row '+(mine?'me':'them');
        row.innerHTML=`<div class="bub ${mine?'me':'them'}">${esc(m.content)}<span class="time">${hh}</span></div>`;
        box.append(row);
        box.scrollTop=box.scrollHeight;
      })
    .on('postgres_changes',
      {event:'UPDATE',schema:'public',table:'conversations',filter:'id=eq.'+convId},
      payload=>{
        updateStreakPill(payload.new);
      })
    .subscribe(status=>console.log('Chat Realtime:',status));
}

/* ---------- CREAR ---------- */
function camOff(){
  clearInterval(iv);clearInterval(cdv);cdv=null;tor=0;
  try{mr&&mr.state!='inactive'&&(mr.onstop=null,mr.stop())}catch(e){}
  st&&st.getTracks().forEach(t=>t.stop());
  st=null;mr=null;
}
async function open(first){
  if(first)cam();
  const nocam=(msg)=>{
    st=null;
    const v=$('#cv'),n=$('#nc'),er=$('#nce');
    v&&(v.style.display='none');n&&(n.style.display='flex');
    er&&(er.textContent=msg||'Permite el acceso a la cámara y al micrófono.');
  };
  if(!(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))
    return nocam('Tu navegador no admite la cámara.');
  try{
    st&&st.getTracks().forEach(t=>t.stop());
    try{
      st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:fc},width:{ideal:1080},height:{ideal:1920}},audio:true});
    }catch(e){
      if(e&&(e.name==='NotFoundError'||e.name==='OverconstrainedError')){
        st=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
      }else throw e;
    }
    const v=$('#cv'),n=$('#nc');
    v&&(v.style.display='');n&&(n.style.display='none');
    att();
  }catch(e){
    const msg=e&&e.name==='NotAllowedError'?'Permiso de cámara denegado.'
      :e&&e.name==='NotReadableError'?'La cámara está siendo utilizada por otra app.'
      :'No se pudo acceder a la cámara.';
    nocam(msg);
  }
}
function att(){
  const v=$('#cv');if(!v)return;
  v.srcObject=st;
  v.style.cssText=safeFilter(cf)+';transform:'+(fc=='user'?'scaleX(-1)':'none');
  tor=0; const z=$('#fz');z&&z.classList.remove('on');
  v.play().catch(()=>{});
}
const mm=t=>String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
const FL=[['','Normal','#444'],['filter:grayscale(1) contrast(1.1)','B/N','#888'],['filter:saturate(1.9) contrast(1.05)','Vívido','#e0457b'],['filter:contrast(1.35) brightness(.9) saturate(.8)','Cine','#2b6c8f'],['filter:sepia(.8)','Retro','#8a6a3c'],['filter:hue-rotate(200deg) saturate(1.4)','Neón','#3a5bd9'],['filter:sepia(.35) saturate(1.5) hue-rotate(-20deg)','Cálido','#c9772e']];
function setF(f){cf=safeFilter(f);fxi=Math.max(0,FL.findIndex(x=>x[0]==cf));att();document.querySelectorAll('.fx').forEach(b=>b.classList.toggle('on',FL[+b.dataset.f][0]==cf))}
function cnt(){
  if(!tim)return start();
  let n=tim;const o=$('#cd');o.textContent=n;o.style.display='grid';
  cdv=setInterval(()=>{n--;if(n>0){o.textContent=n;return}clearInterval(cdv);cdv=null;o.style.display='none';start()},1000);
}
function cam(){
  document.body.classList.add('nl');
  const tb=(a,n,l)=>`<button class="tb" id="${a}" aria-label="${l}">${ic(n,26)}</button>`;
  $('#m').innerHTML=`<div class="cam"><video id="cv" playsinline muted autoplay></video><div class="cshade"></div><div class="tm" id="tm">00:00</div><div class="cd" id="cd"></div>
  <div class="nc" id="nc"><b>${ic('play',44)}</b><h2 style="margin:0">Cámara integrada</h2><p id="nce">Permite el acceso a la cámara y al micrófono para grabar dentro de Nova.</p><button class="btn" id="ncretry">Reintentar</button></div>
  <div class="top"><button class="cb" id="cx" aria-label="Cerrar">${ic('x',22)}</button>${tb('fp','flip','Girar cámara')}</div>
  <div class="tl">${tb('fz','flash','Flash')}${tb('tmr','timer','Temporizador')}${tb('fxn','fx','Cambiar filtro')}</div>
  <div class="cbot"><div class="durs">${[['600','10 min'],['60','60 s'],['15','15 s']].map(([v,t])=>`<button data-d="${v}" class="${dur==v?'on':''}">${t}</button>`).join('')}</div>
  <div class="brow"><button class="gal" id="gb" aria-label="Subir de la galería">${ic('gal',22)}</button><button class="rec" id="rb" aria-label="Grabar"></button><span></span></div></div><input id="gf" type="file" accept="video/*" hidden>`;
  att();
  $('#cx').onclick=()=>go('#/');
  $('#ncretry').onclick=()=>open(false);
  $('#fp').onclick=async()=>{
    if(!st)return toast('Primero necesitas la cámara');
    if(mr)return toast('Para el vídeo antes de girar');
    const next=fc=='user'?'environment':'user';
    const track=st.getVideoTracks&&st.getVideoTracks()[0];
    if(track&&track.applyConstraints){try{await track.applyConstraints({facingMode:{exact:next}});fc=next;att();return}catch(e){}}
    fc=next; try{if(st)st.getTracks().forEach(t=>t.stop());await new Promise(r=>setTimeout(r,180));await open(false)}catch(e){toast('No se pudo cambiar de cámara')}
  };
  $('#fz').onclick=()=>{
    const t=st&&st.getVideoTracks()[0];
    if(!t||!(t.getCapabilities&&t.getCapabilities().torch))return toast('Esta cámara no tiene flash');
    tor=!tor; t.applyConstraints({advanced:[{torch:!!tor}]}).catch(()=>{}); $('#fz').classList.toggle('on',!!tor);
  };
  $('#tmr').onclick=()=>{tim={0:3,3:10,10:0}[tim];toast(tim?'Temporizador: '+tim+' s':'Temporizador desactivado');$('#tmr').classList.toggle('on',!!tim)};
  $('#fxn').onclick=()=>{setF(FL[(fxi+1)%FL.length][0]);toast('Filtro: '+FL[fxi][1])};
  document.querySelectorAll('.durs [data-d]').forEach(b=>b.onclick=()=>{if(mr)return;dur=+b.dataset.d;document.querySelectorAll('.durs [data-d]').forEach(x=>x.classList.toggle('on',x==b))});
  $('#gb').onclick=()=>$('#gf').click();
  $('#gf').onchange=e=>{const f=e.target.files[0];f&&editor(f,cf)};
  $('#rb').onclick=()=>{
    if(!st)return toast('Primero permite el acceso a la cámara');
    if(mr)return stop();
    if(cdv){clearInterval(cdv);cdv=null;$('#cd').style.display='none';return}
    cnt();
  };
}
function start(){
  ch=[];el=0;
  const mt=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  try{mr=new MediaRecorder(st,mt?{mimeType:mt}:{})}catch(e){mr=null;return toast('No se pudo iniciar la grabación')}
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=()=>{clearInterval(iv);blob=new Blob(ch,{type:mr.mimeType||'video/webm'});mr=null;review()};
  mr.start(500);
  $('#rb').classList.add('on');$('#tm').classList.add('rc');
  iv=setInterval(()=>{el++;$('#tm').textContent=mm(el);if(el>=dur)stop()},1000);
}
function stop(){mr&&mr.state!='inactive'&&mr.stop()}
function review(){
  camOff();
  const u=URL.createObjectURL(blob);
  $('#m').innerHTML=`<div class="rv"><video style="${esc(safeFilter(cf))}" src="${u}" playsinline controls loop autoplay></video><div class="pn"><div class="chips c"><button class="btn o" id="rt">Repetir</button><button class="btn" id="nx">Siguiente</button></div></div></div>`;
  $('#rt').onclick=()=>open(true);
  $('#nx').onclick=()=>editor(new File([blob],'grabacion.webm',{type:blob.type}),cf);
}
function editor(f,fl=''){
  document.body.classList.remove('nl');camOff();
  const u=URL.createObjectURL(f);
  $('#m').innerHTML=`<div class="pg"><h2>Detalles del vídeo</h2><video src="${u}" controls muted playsinline class="pv"></video><p><input id="d" maxlength="150" placeholder="Descripción" aria-label="Descripción"></p><p><input id="h" placeholder="#hashtags separados por espacios" aria-label="Hashtags"></p><p><select id="fl" aria-label="Filtro"><option value="">Sin filtro</option><option value="filter:grayscale(1) contrast(1.1)">Blanco y negro</option><option value="filter:saturate(1.9) contrast(1.05)">Vívido</option><option value="filter:sepia(.8)">Retro</option><option value="filter:hue-rotate(200deg) saturate(1.4)">Neón frío</option><option value="filter:sepia(.35) saturate(1.5) hue-rotate(-20deg)">Cálido</option><option value="filter:contrast(1.35) brightness(.9) saturate(.8)">Cine</option></select></p><p><input id="tx" maxlength="40" placeholder="Texto sobre el vídeo (opcional)"></p><p><select id="sp"><option value="0.5">Velocidad 0.5×</option><option value="1" selected>Velocidad 1×</option><option value="1.5">Velocidad 1.5×</option><option value="2">Velocidad 2×</option></select></p><p><label><input type="checkbox" id="cc" checked style="width:auto"> Permitir comentarios</label></p><p><label><input type="checkbox" id="mu" style="width:auto"> Silenciar audio original</label></p><div class="chips"><button class="btn o" id="dr">Guardar borrador</button><button class="btn" id="pb">Publicar</button></div></div>`;
  $('#fl').value=safeFilter(fl);$('.pv').style.cssText=safeFilter(fl);
  $('#fl').onchange=()=>{$('.pv').style.cssText=safeFilter($('#fl').value)};
  $('#dr').onclick=()=>toast('Borrador guardado (demo)');
  $('#pb').onclick=async()=>{
    const btn=$('#pb');
    const description=$('#d').value.trim()||'Mi vídeo';
    btn.disabled=true;btn.textContent='Publicando…';
    try{
      const cloud=await publishCloudVideo(f,description);
      S.meta.unshift(cloud);save();
      await refreshCloudFeed();
      toast('Vídeo publicado');
      go('#/v/'+cloud.id);
    }catch(e){
      console.error(e);
      const msg=String(e?.message||e);
      if(/bucket|not found/i.test(msg)) toast('Falta crear el bucket "videos" en Supabase');
      else if(/user_id/i.test(msg)) toast('Falta la columna user_id en videos');
      else if(/row-level|permission|policy/i.test(msg)) toast('Revisa las políticas RLS');
      else toast('No se pudo publicar: '+msg.slice(0,90));
    }finally{btn.disabled=false;btn.textContent='Publicar'}
  };
}

/* ---------- Paneles ---------- */
const closeSheet=()=>{curC=null;currentCommentsVideoId=null;$('#ov').innerHTML=''};
function sheet(t,body,foot=''){
  $('#ov').innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(t)}"><div class="sh"><span>${esc(t)}</span><button data-a="x" aria-label="Cerrar">${ic('x',20)}</button></div><div class="sb">${body}</div>${foot}</div>`;
}
function readAv(f){
  const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=256;
    const z=Math.min(i.width,i.height);
    c.getContext('2d').drawImage(i,(i.width-z)/2,(i.height-z)/2,z,z,0,0,256,256);
    URL.revokeObjectURL(u);
    ME.av=c.toDataURL('image/jpeg',.85);save();
    $('#ap').innerHTML=avt(96);toast('Foto actualizada');
  };
  i.onerror=()=>toast('No se pudo leer la foto');
  i.src=u;
}
const renderCommentsList=list=>list.length
  ?list.map(c=>`<div class="cm" style="display:flex;gap:8px;align-items:flex-start">${avt(30)}<div style="flex:1;min-width:0"><b>@${esc(c.u)}</b><div>${esc(c.t)}</div></div><button class="btn o" style="padding:4px 10px;font-size:12px" data-del-cm="${c.id}">Borrar</button></div>`).join('')
  :'<p class="mu">Sé el primero en comentar.</p>';
async function renderCommentSheetFor(videoId){
  const list=await loadComments(videoId);
  const sbEl=$('.sb');if(!sbEl)return;
  sbEl.innerHTML=renderCommentsList(list);
  sbEl.querySelectorAll('[data-del-cm]').forEach(b=>b.onclick=async()=>{
    try{await deleteComment(+b.dataset.delCm,videoId);await renderCommentSheetFor(videoId)}catch(e){toast('No se pudo borrar')}
  });
}

const A={
  x:closeSheet,
  pk:()=>$('#pf').click(),
  like:async e=>{
    const c=e.closest('.card'); const id=c.dataset.id;
    try{
      const wasLiked=!!S.liked[id];
      if(!wasLiked){const h=document.createElement('div');h.className='heart';h.innerHTML=ic('heart',110,1);c.append(h);setTimeout(()=>h.remove(),800)}
      await toggleLike(id);
    }catch(err){console.error(err);toast('No se pudo dar like')}
  },
  sv:async e=>{
    const id=e.closest('.card').dataset.id;
    try{await toggleSave(id);toast(S.saved[id]?'Guardado':'Eliminado')}catch(err){toast('No se pudo guardar')}
  },
  mute:()=>{
    S.muted=!S.muted;save();
    document.querySelectorAll('video').forEach(v=>v.muted=S.muted);
    document.querySelectorAll('[data-a=mute] b').forEach(b=>b.innerHTML=ic(S.muted?'voloff':'volon'));
    toast(S.muted?'Silenciado':'Sonido activado');
  },
  cm:async e=>{
    curC=e.closest('.card').dataset.id; currentCommentsVideoId=curC;
    if(vid(curC).nc)return toast('Comentarios desactivados');
    sheet('Comentarios','<p class="mu">Cargando…</p>',`<div class="cf"><input id="ci" placeholder="Escribe un comentario…" autocomplete="off"><button class="btn" data-a="cmp">Publicar</button></div>`);
    $('#ci').onkeydown=ev=>{ev.key==='Enter'&&A.cmp()};
    try{await renderCommentSheetFor(curC)}catch(e){if($('.sb'))$('.sb').innerHTML='<p class="mu">Error</p>'}
  },
  cmp:async()=>{
    const t=$('#ci').value.trim();if(!t)return;
    const btn=document.querySelector('[data-a="cmp"]'); if(btn)btn.disabled=true;
    try{await postComment(curC,t);await renderCommentSheetFor(curC)}catch(e){toast('No se pudo publicar')}
    finally{if(btn)btn.disabled=false}
  },
  del:async e=>{
    const id=e.closest('.card').dataset.id;
    const v=vid(id); if(!v)return;
    if(!v.remote){
      if(!confirm('¿Borrar este vídeo local?'))return;
      S.meta=S.meta.filter(x=>x.id!=id);await idb('delete',id);save();go('#/');return;
    }
    if(!confirm('¿Borrar este vídeo de Supabase? Esto lo eliminará para todos.'))return;
    try{
      const url=v.src||'';
      const match=url.match(/\/object\/public\/videos\/(.+)$/);
      if(match&&match[1]) await sb.storage.from(VIDEO_BUCKET).remove([decodeURIComponent(match[1])]).catch(()=>{});
      const {error}=await sb.from('videos').delete().eq('id',id);
      if(error)throw error;
      S.meta=S.meta.filter(x=>x.id!=id);save();toast('Vídeo borrado');go('#/');
    }catch(err){console.error(err);toast('No se pudo borrar: '+(err.message||''))}
  },
  bio:()=>{
    const ln=t=>t?Math.max(0,Math.ceil((t+D7-Date.now())/864e5)):0;
    const a=ln(ME.nAt),b=ln(ME.uAt);
    const nt=d=>d?'Podrás cambiarlo en '+d+(d>1?' días':' día'):'Solo una vez cada 7 días';
    sheet('Editar perfil',`<div style="text-align:center"><button id="ap" data-a="pk">${avt(96)}</button><p><button class="btn o" data-a="pk">Cambiar foto</button></p></div><label for="en">Nombre visible</label><p><input id="en" value="${esc(ME.n)}" maxlength="24" ${a?'disabled':''}></p><p class="mu" style="font-size:12px">${nt(a)}</p><label for="eu">Nombre de usuario</label><p><input id="eu" value="${esc(ME.u)}" maxlength="20" ${b?'disabled':''}></p><p class="mu" style="font-size:12px">${nt(b)}</p><label for="bi">Biografía</label><p><input id="bi" value="${esc(ME.bio||'')}" maxlength="120"></p><input id="pf" type="file" accept="image/*" hidden><button class="btn" data-a="bios">Guardar</button>`);
    $('#pf').onchange=e=>{const f=e.target.files[0];f&&readAv(f)};
  },
  bios:()=>{
    const n=$('#en').value.trim(),u=cl($('#eu').value);
    const cn=!$('#en').disabled&&n!=ME.n,cu=!$('#eu').disabled&&u!=ME.u;
    if(cn&&n.length<2)return toast('El nombre necesita 2 letras mínimo');
    if(cu&&u.length<3)return toast('El usuario necesita 3 caracteres mínimo');
    if(cn){ME.n=n;ME.nAt=Date.now()}
    if(cu){ME.u=u;ME.uAt=Date.now()}
    ME.bio=$('#bi').value;save();closeSheet();toast('Perfil actualizado');profile();
  },
  th:()=>{S.theme={auto:'dark',dark:'light',light:'auto'}[S.theme];theme();save();profile()},
  out:()=>{S.acct=null;ME=null;save();welcome()}
};

document.addEventListener('click',ev=>{
  const al=ev.target.closest('a[href^="#/"]');
  if(al){ev.preventDefault();ME&&go(al.getAttribute('href'));return}
  const b=ev.target.closest('[data-a]');
  if(b){const f=A[b.dataset.a];f&&f(b);return}
  const c=ev.target.closest('.card');
  if(c&&!ev.target.closest('a,button')){
    const n=Date.now(),v=c.querySelector('video');
    const tg=()=>v.paused?v.play().catch(()=>{}):v.pause();
    tg();
    if(n-lastTap<300){tg();A.like({closest:()=>c})}
    lastTap=n;
  }
});

window.addEventListener('hashchange',()=>{if(ME&&location.hash&&location.hash!==H){H=location.hash;route()}});

function route(){
  const[r,a]=H.slice(2).split('/'),p=decodeURIComponent(a||'');
  closeSheet();camOff();
  document.body.classList.remove('nl');
  document.querySelectorAll('video').forEach(v=>{try{v.pause()}catch(e){}});
  if(r!=='live'){
    if(liveChannel){sb&&sb.removeChannel(liveChannel);liveChannel=null}
    currentLive=null;cleanupRTCPeers();stopLiveCamera();
  }
  if(r!=='c'){
    if(chatChannel){sb&&sb.removeChannel(chatChannel);chatChannel=null}
    currentChat={convId:null,otherUser:null,otherUsername:null};
  }
  document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.r==(r=='v'||r=='t'||r=='u'||r=='c'?'':r)));
  try{
    (({'':()=>feed(),v:()=>feed(p),discover,create:()=>open(true),profile,activity,hist:history2,t:()=>tagPage(p),live:livePage,u:()=>publicProfile(p),messages:messagesPage,c:()=>chatPage(p)})[r]||(()=>feed()))();
  }catch(e){
    console.error(e);
    $('#m').innerHTML='<div class="em">Ups, algo salió mal.<br><br><a class="btn" href="#/">Volver</a></div>';
  }
}

/* ---------- Bienvenida ---------- */
function welcome(){
  document.body.classList.add('nl');closeSheet();
  $('#m').innerHTML=`<div class="wl"><div class="wc"><span class="logo">Nova</span><p style="font-size:19px;opacity:.85">Creado por Asier, Ari y Adán Disfrútalo</p>
  <div class="gl" id="wf"><button type="button" id="googleBtn" class="google-btn"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.27c0-.68-.06-1.35-.18-1.98H12v3.75h5.24a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.91-4.18 2.91-7.13z"/><path fill="#34A853" d="M12 21.7c2.62 0 4.82-.87 6.43-2.36l-3.14-2.43c-.87.58-1.98.93-3.29.93-2.53 0-4.68-1.71-5.45-4.01H3.3v2.5A9.72 9.72 0 0 0 12 21.7z"/><path fill="#FBBC05" d="M6.55 13.83A5.84 5.84 0 0 1 6.24 12c0-.64.11-1.26.31-1.83V7.67H3.3A9.7 9.7 0 0 0 2.27 12c0 1.56.37 3.03 1.03 4.33l3.25-2.5z"/><path fill="#EA4335" d="M12 6.16c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.81 3.25 14.62 2.3 12 2.3a9.72 9.72 0 0 0-8.7 5.37l3.25 2.5c.77-2.3 2.92-4.01 5.45-4.01z"/></svg>Continuar con Google</button><div class="auth-divider">o entra con tu perfil de Nova</div><label for="wn">Nombre de visualización</label><input id="wn" maxlength="24" placeholder="Ej. Alex"><label for="wu">Nombre de usuario</label><input id="wu" maxlength="20" placeholder="alex.nova"><p id="we" role="alert" style="color:#ffb4c0;min-height:20px;font-size:13px"></p><button type="button" id="wb" class="btn" style="width:100%;padding:14px;font-size:16px">Entrar a Nova</button></div></div></div>`;
  const enter=async()=>{
    const n=$('#wn').value.trim();
    let u=cl($('#wu').value.trim())||cl(n);
    if(n.length<2){$('#we').textContent='Escribe tu nombre (mínimo 2 letras).';$('#wn').focus();return}
    if(u.length<3)u=(u+'nova'+(Math.random()*900+100|0)).slice(0,20);
    S.acct={n,u,bio:''};ME=S.acct;save();
    try{
      const user=await ensureSupabaseUser();
      try{await ensureSupabaseProfile(user)}catch(e){}
      await refreshCloudFeed();
    }catch(e){console.warn(e)}
    document.body.classList.remove('nl');
    go('#/');
  };
  const google=async()=>{
    if(!sb){$('#we').textContent='No se pudo cargar Supabase.';return}
    try{
      const redirectTo=(location.protocol==='http:'||location.protocol==='https:')?location.href.split('#')[0]:null;
      if(!redirectTo){$('#we').textContent='Publica Nova en https para usar Google.';return}
      const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}});
      if(error)throw error;
    }catch(e){$('#we').textContent=e.message||'Error con Google.'}
  };
  $('#wb').onclick=enter;$('#googleBtn').onclick=google;
  $('#wf').onkeydown=e=>{e.key==='Enter'&&enter()};
}

/* ---------- Realtime global ---------- */
async function subscribeCloudFeed(){
  if(!sb||cloudFeedChannel)return;
  cloudFeedChannel=sb.channel('nova-public-feed')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'videos'},async()=>{await refreshCloudFeed()})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'videos'},async()=>{await refreshCloudFeed()})
    .subscribe(s=>console.log('Feed Realtime:',s));
}
async function subscribeSocial(){
  if(!sb||socialChannel)return;
  socialChannel=sb.channel('nova-social')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'likes'},p=>applyLikeDelta(p.new.video_id,+1))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'likes'},p=>applyLikeDelta(p.old.video_id,-1))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'comments'},async p=>{
      applyCommentDelta(p.new.video_id,+1);
      if(String(p.new.video_id)===String(currentCommentsVideoId)) await renderCommentSheetFor(currentCommentsVideoId);
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'comments'},p=>applyCommentDelta(p.old.video_id,-1))
    .subscribe(s=>console.log('Social Realtime:',s));
}
function applyLikeDelta(videoId,delta){const v=vid(videoId);if(!v)return;v.likeCount=Math.max(0,(v.likeCount||0)+delta);refresh(videoId)}
function applyCommentDelta(videoId,delta){const v=vid(videoId);if(!v)return;v.commentCount=Math.max(0,(v.commentCount||0)+delta);refresh(videoId)}

/* ---------- Arranque ---------- */
(async()=>{
  await Promise.all(S.meta.map(async v=>{
    if(v.remote)return;
    const b=await idb('get',v.id);
    if(b)v.src=URL.createObjectURL(b);
  }));
  S.meta=S.meta.filter(v=>v.src||v.remote);
  theme();

  if(sb){
    try{
      await subscribeCloudFeed();
      await subscribeSocial();
      const {data:{session}}=await sb.auth.getSession();
      if(session?.user){
        supabaseUser=session.user;
        const u=session.user;
        const n=u.user_metadata?.full_name||u.user_metadata?.name||'Nova';
        const base=cl(u.user_metadata?.preferred_username||u.user_metadata?.user_name||u.email?.split('@')[0]||'nova');
        ME=S.acct={n,u:base.slice(0,20)||'nova',bio:''};
        save();
        try{await ensureSupabaseProfile(u)}catch(e){}
        await refreshCloudFeed();
      }
      if(!S.meta.some(v=>v.remote)){
        try{await refreshCloudFeed()}catch(e){}
      }
      const remoteIds=S.meta.filter(v=>v.remote).map(v=>String(v.id));
      if(remoteIds.length){try{await loadSocialState(remoteIds)}catch(e){}}
    }catch(e){console.warn('Supabase pendiente:',e)}
  }

  if(S.acct){ME=S.acct;route()}
  else welcome();
})();
</script>
