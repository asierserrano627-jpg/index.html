async function ensureSupabaseProfile(user){
  if(!sb||!user) throw new Error('Sesión de Supabase no disponible.');
  let desired=cl((ME&&ME.u)||user.user_metadata?.preferred_username||user.user_metadata?.user_name||'');
  if(desired.length<3){
    const base=cl((user.user_metadata?.name||user.user_metadata?.full_name||user.email?.split('@')[0]||'nova'));
    desired=(base||'nova').slice(0,14)+'_'+String(user.id||'').replace(/-/g,'').slice(0,5);
  }
  desired=desired.slice(0,20);

  const existing=await sb.from('profiles').select('id,username').eq('id',user.id).maybeSingle();
  if(existing.error) throw existing.error;
  if(existing.data?.id){
    if(existing.data.username&&ME&&ME.u!==existing.data.username){

    return existing.data.username||desired;
  }
  let payload={id:user.id,username:desired};
  let res=await sb.from('profiles').insert(payload).select('id,username').single();
  let attempts=0;
  while(res.error&&String(res.error.code)==='23505'&&attempts<3){
    attempts++;

    res=await sb.from('profiles').insert(payload).select('id,username').single();

async function publishCloudVideo(file, description){
  if(!sb) throw new Error('Supabase no está disponible.');
  const user=await ensureSupabaseUser();
  const username=await ensureSupabaseProfile(user);
  const mime=file.type||'video/webm';
  let ext='webm';
  if(mime.includes('mp4'))ext='mp4';
  else if(mime.includes('quicktime'))ext='mov';
  else if(mime.includes('webm'))ext='webm';
  else if(mime.includes('ogg'))ext='ogg';

  const uid=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
  const path=`${user.id}/${uid}.${ext}`;

  const upload=await sb.storage.from(VIDEO_BUCKET).upload(path,file,{contentType:mime,upsert:false});
  if(upload.error) throw upload.error;

  const {data:pub}=sb.storage.from(VIDEO_BUCKET).getPublicUrl(path);
  const videoUrl=pub?.publicUrl;
  if(!videoUrl){
    await sb.storage.from(VIDEO_BUCKET).remove([path]).catch(()=>{});
    throw new Error('No se pudo obtener la URL pública del vídeo.');
  }
  const res=await sb.from('videos')
    .insert({
      description:description||'Mi vídeo',
      video_url:videoUrl,
      user_id:user.id,
      username:username,
      avatar_url:ME.av||null,
      views:0,
      admin_likes:0,
      admin_favorites:0
    })
    .select('id,description,video_url,user_id,username,views,avatar_url,admin_likes,admin_favorites').single();
  if(res.error){
    console.error('Nova: error guardando vídeo',res.error);
    await sb.storage.from(VIDEO_BUCKET).remove([path]).catch(()=>{});
    throw new Error(`No se pudo guardar el vídeo: ${res.error.message||'error'}`);
  }
  return {
    id:String(res.data.id),
    d:res.data.description||description||'Mi vídeo',
    tags:[],t:Date.now(),src:res.data.video_url,
    f:'',txt:'',sp:1,nc:false,mu:false,remote:true,
    isPhoto:false,
    userId:res.data.user_id,
    username:res.data.username||username,
    displayName:ME?.n||res.data.username||username,

async function loadSocialState(videoIds){
  if(!sb||!videoIds.length)return;
  const ids=videoIds.map(String);
  const {data:{session}}=await sb.auth.getSession();
  const uid=session?.user?.id;
  const [likes, comments, saves]=await Promise.all([
    sb.from('likes').select('video_id').in('video_id',ids),
    sb.from('comments').select('video_id').in('video_id',ids),
    sb.from('saves').select('video_id').in('video_id',ids)
  ]);
  const likeMap={}, commentMap={}, saveMap={};
  (likes.data||[]).forEach(r=>likeMap[r.video_id]=(likeMap[r.video_id]||0)+1);
  (comments.data||[]).forEach(r=>commentMap[r.video_id]=(commentMap[r.video_id]||0)+1);
  (saves.data||[]).forEach(r=>saveMap[r.video_id]=(saveMap[r.video_id]||0)+1);
  S.meta.forEach(v=>{
    const key=String(v.id);
    if(!ids.includes(key))return;
    v.likeCount=(likeMap[key]||0)+(v.adminLikes||0);
    v.commentCount=commentMap[key]||0;
    v.saveCount=(saveMap[key]||0)+(v.adminFavorites||0);
  });
  if(uid){
    const [myLikes, mySaves]=await Promise.all([
      sb.from('likes').select('video_id').eq('user_id',uid).in('video_id',ids),
      sb.from('saves').select('video_id').eq('user_id',uid).in('video_id',ids)
    ]);
    S.liked={}; S.saved={};
    (myLikes.data||[]).forEach(r=>S.liked[r.video_id]=1);
    (mySaves.data||[]).forEach(r=>S.saved[r.video_id]=1);
    save();
  }
}
async function toggleLike(videoId){
  const user=await ensureSupabaseUser();
  const id=String(videoId);
  const liked=!!S.liked[id];
  if(liked){
    delete S.liked[id];
    await sb.from('likes').delete().eq('video_id',id).eq('user_id',user.id);
  }else{
    S.liked[id]=1;
    await sb.from('likes').insert({video_id:id,user_id:user.id});
  }
  save();
  const v=vid(videoId);
  if(v)v.likeCount=Math.max(0,(v.likeCount||0)+(liked?-1:1));
  refresh(videoId);
  if(navigator.vibrate&&!liked)navigator.vibrate(10);
}

function computeStreakDisplay(c){
  if(!c)return {count:0,active:false};
  const today=new Date().toISOString().slice(0,10);
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  let count=c.streak_count||0;
  const aLast=c.a_last_msg,bLast=c.b_last_msg;
  const bothToday = aLast===today && bLast===today;
  const bothRecent = (aLast===today||aLast===y) && (bLast===today||bLast===y);
  if(count>0){
    if(c.streak_last===today && bothToday){}
    else if(c.streak_last===y && bothRecent){}
    else{count=0}
  }
  const active = count>0 && bothRecent;
  return {count,active};
}
const STREAK_LEVELS=[
  {min:0,cls:'off',glow:'none'},
  {min:1,cls:'lvl1',glow:'0 0 8px rgba(255,180,90,.5)'},
  {min:3,cls:'lvl2',glow:'0 0 14px rgba(255,140,60,.7)'},
  {min:7,cls:'lvl3',glow:'0 0 20px rgba(255,80,60,.9)'},
  {min:14,cls:'lvl4',glow:'0 0 26px rgba(180,90,255,1), 0 0 40px rgba(90,180,255,.7)'}
];
function streakLevel(n){let lv=STREAK_LEVELS[0];for(const l of STREAK_LEVELS){if(n>=l.min)lv=l}return lv}
function updateStreakPill(conv){
  const pill=$('#streakPill'); if(!pill)return;
  const s=computeStreakDisplay(conv);
  const numEl=pill.querySelector('#streakNum');
  const prev=Number(numEl.textContent||0);
  numEl.textContent=s.count;
  const lv=streakLevel(s.count);
  pill.className='streak '+(s.count===0||!s.active?'off':lv.cls);
  pill.style.boxShadow=s.count>0&&s.active?lv.glow:'none';
  if(s.count>prev){
    pill.classList.remove('bump');void pill.offsetWidth;
    pill.classList.add('bump');burstFire(pill);
    toast('¡Racha subida! '+s.count);
  }
}
function burstFire(anchor){
  const rect=anchor.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    p.className='fire-particle';p.innerHTML=sticker(i%2?'fire':'star','sm');
    const angle=(Math.PI*2)*(i/10),dist=40+Math.random()*40;
    p.style.left=cx+'px';p.style.top=cy+'px';
    p.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    p.style.setProperty('--ty',Math.sin(angle)*dist+'px');
    p.style.setProperty('--rot',(Math.random()*360-180)+'deg');
    p.style.fontSize=(10+Math.random()*10)+'px';
    document.body.append(p);setTimeout(()=>p.remove(),900);
  }
}

async function subscribeLive(liveId){

    .on('postgres_changes',{event:'INSERT',schema:'public',table:'live_messages',filter:'live_id=eq.'+liveId},

      })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'lives',filter:'id=eq.'+liveId},payload=>{
      const row=payload.new||{};
      if(currentLive&&String(currentLive.id)===String(liveId))currentLive=row;
      const vc=$('#liveViewerCount'); if(vc)vc.textContent=Number(row.viewer_count||0); const vct=$('#liveViewerCountTop'); if(vct)vct.textContent=Number(row.viewer_count||0);

      if(row.status!=='live'){const ph=$('#feedLivePlaceholder');if(ph)ph.style.display='grid';}
    })
    .on('broadcast',{event:'rtc'},async ({payload})=>{try{await handleRTCSignal(payload)}catch(e){}});
  // Supabase Realtime no permite añadir callbacks postgres_changes después de subscribe().
  // Registramos el listener de regalos ANTES de suscribir el canal.
  await subscribeLiveGifts(liveId);
  liveChannel.subscribe(status=>{
    if(status==='SUBSCRIBED'&&rtcRole==='viewer'){
      liveChannel.send({type:'broadcast',event:'rtc',payload:{type:'viewer-join',from:rtcClientId}});
    }
  });
  // Si el canal ya estaba suscrito o el estado del rol cambió justo antes de suscribir,
  // el viewer-join se vuelve a enviar de forma segura.
  setTimeout(()=>{
    if(liveChannel && liveChannel.state==='joined' && rtcRole==='viewer' && currentLive?.id===liveId){
      liveChannel.send({type:'broadcast',event:'rtc',payload:{type:'viewer-join',from:rtcClientId}}).catch(()=>{});
    }
  },350);
}
function getLiveVideo(){return $('#feedLiveVideo')||$('#liveCam')}
function rtcConfig(){return {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}}
function cleanupRTCPeers(){
  rtcPeers.forEach(pc=>{try{pc.close()}catch(e){}});rtcPeers.clear();rtcRole='';
  const v=getLiveVideo(); if(v&&v.srcObject&&v.srcObject!==liveStream)v.srcObject=null;

async function sendRTC(payload){
  if(!liveChannel)return;
  try{await liveChannel.send({type:'broadcast',event:'rtc',payload:{...payload,liveId:currentLive?.id}})}catch(e){}
}
async function makeBroadcasterPeer(viewerId){
  if(!liveStream||!liveChannel)return;
  const old=rtcPeers.get(viewerId); if(old){try{old.close()}catch(e){};rtcPeers.delete(viewerId)}
  const pc=new RTCPeerConnection(rtcConfig()); rtcPeers.set(viewerId,pc);
  liveStream.getTracks().forEach(track=>pc.addTrack(track,liveStream));
  pc.onicecandidate=e=>{if(e.candidate)sendRTC({type:'ice',to:viewerId,from:rtcClientId,candidate:e.candidate})};
  pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){try{pc.close()}catch(e){};rtcPeers.delete(viewerId)}};
  setTimeout(()=>{if(pc.connectionState!=='connected'){try{pc.close()}catch(e){};rtcPeers.delete(viewerId)}},15000);
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await sendRTC({type:'offer',to:viewerId,from:rtcClientId,offer:pc.localDescription});
}
async function handleRTCSignal(msg){
  if(!msg||msg.liveId!==currentLive?.id)return;
  if(msg.type==='viewer-join'&&rtcRole==='broadcaster'&&msg.from){await makeBroadcasterPeer(msg.from);return}
  if(msg.to&&msg.to!==rtcClientId)return;
  if(msg.type==='offer'&&rtcRole==='viewer'){
    const old=rtcPeers.get('broadcaster');if(old){try{old.close()}catch(e){}}
    const pc=new RTCPeerConnection(rtcConfig()); rtcPeers.set('broadcaster',pc);
    pc.ontrack=e=>{
      const v=getLiveVideo();
      if(v&&e.streams[0]){liveRtcConnected=true;if(liveJoinTimer){clearTimeout(liveJoinTimer);liveJoinTimer=null}v.srcObject=e.streams[0];v.muted=false;v.controls=false;v.style.display='';v.play().catch(()=>{});const off=$('#liveCamOff');if(off)off.style.display='none'}
    };
    pc.onicecandidate=e=>{if(e.candidate)sendRTC({type:'ice',to:msg.from,from:rtcClientId,candidate:e.candidate})};
    pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState))toast('Se perdió el Live')};
    await pc.setRemoteDescription(msg.offer);
    const answer=await pc.createAnswer(); await pc.setLocalDescription(answer);
    await sendRTC({type:'answer',to:msg.from,from:rtcClientId,answer:pc.localDescription});
    return;
  }
  if(msg.type==='answer'&&rtcRole==='broadcaster'&&msg.from){const pc=rtcPeers.get(msg.from);if(!pc)return;await pc.setRemoteDescription(msg.answer);return}
  if(msg.type==='ice'&&msg.from&&msg.candidate){
    const key=rtcRole==='broadcaster'?msg.from:'broadcaster';
    const pc=rtcPeers.get(key);if(!pc)return;
    try{await pc.addIceCandidate(msg.candidate)}catch(e){}
  }
}

async function startLiveCamera(){
  if(liveStream)return liveStream;
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Sin cámara.');
  const video={facingMode:'user',width:{ideal:1080},height:{ideal:1920}};
  let st;

  // En algunos móviles Android el navegador devuelve "Could not start audio source"
  // cuando se solicitan cámara y micrófono en la misma llamada. Abrimos primero
  // la cámara para que un fallo del micrófono nunca impida iniciar el Live.
  try{
    st=await navigator.mediaDevices.getUserMedia({video});
  }catch(e){
    const name=String(e?.name||'');
    const msg=String(e?.message||'');
    if(name==='NotAllowedError')throw new Error('Permiso de cámara denegado. Actívalo en el navegador.');
    if(name==='NotFoundError')throw new Error('No se encontró la cámara.');
    if(name==='NotReadableError' || /Could not start|source/i.test(msg))throw new Error('La cámara está siendo usada por otra aplicación.');
    throw new Error(msg||'No se pudo iniciar la cámara');
  }

  // El micrófono es opcional: si Android no puede abrirlo, el vídeo sigue en directo.
  try{
    const mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    mic.getAudioTracks().forEach(t=>st.addTrack(t));
  }catch(e){
    console.warn('Nova: micrófono no disponible; el Live continuará con vídeo.',e);
  }

  liveStream=st;
  const v=getLiveVideo();
  if(v){v.srcObject=liveStream;v.muted=true;try{await v.play()}catch(e){}}
  return liveStream;
}

    if(error||!data?.length)return [];
    // Un directo solo es mostrable si la cuenta sigue teniendo perfil.
    const ids=[...new Set(data.map(x=>x.user_id).filter(Boolean))];
    if(!ids.length)return [];
    const {data:profiles,error:pe}=await sb.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);
    if(pe)return [];
    const pm=new Map((profiles||[]).map(p=>[String(p.id),p]));
    const valid=data.filter(x=>{
      if(!x.user_id)return false;
      if(!pm.has(String(x.user_id)))return false;
      // Evita que una fila antigua que quedó como "live" aparezca eternamente.
      const started=Date.parse(x.started_at||'');
      if(!Number.isFinite(started))return false;
      return Date.now()-started < 2*60*1000;
    }).map(x=>({...x,profile:pm.get(String(x.user_id))}));
    return valid;
  }catch(e){return []}
}

async function openLiveFromFeed(id){
  if(!id)return;
  go('#/live/'+encodeURIComponent(id));
}
async function activateFeedLive(id){
  if(!id||currentLive?.id===id)return;
  try{
    if(liveChannel){await sb.removeChannel(liveChannel);liveChannel=null}
    cleanupRTCPeers();
    const {data,error}=await sb.from('lives').select('*').eq('id',id).eq('status','live').maybeSingle();
    if(error||!data)return;
    currentLive=data;
    const me=await getMyId();
    if(String(data.user_id)===String(me)){
      const v=$('#feedLiveVideo'); if(v&&liveStream){v.srcObject=liveStream;v.muted=true;v.play().catch(()=>{});const ph=$('#feedLivePlaceholder');if(ph)ph.style.display='none';}
      return;
    }
    const joinRes=await sb.rpc('join_live',{p_live:id}); if(joinRes.error) console.warn('Nova: join_live en feed:',joinRes.error);
    await joinLiveRTC();
    await subscribeLive(id);
  }catch(e){console.warn('Feed Live:',e)}
}
async function deactivateFeedLive(id){
  if(!currentLive||String(currentLive.id)!==String(id))return;
  if(liveChannel){await sb.removeChannel(liveChannel);liveChannel=null}
  cleanupRTCPeers();
  currentLive=null;
  const v=$('#feedLiveVideo');if(v){v.pause();v.srcObject=null}
  const ph=$('#feedLivePlaceholder');if(ph)ph.style.display='grid';
}

async function feed(first){
  let l=[...S.meta];
  if(first){const f=vid(first);if(f)l=[f,...l.filter(v=>v!=f)]}
  const activeLives=await getActiveLives();
  const liveHtml=renderFeedLives(activeLives);
  $('#m').innerHTML=`<div class="feed" id="fd" tabindex="0">${liveHtml}${l.map(slide).join('')||(!liveHtml?`<div class="em" style="height:100%;padding-top:28vh"><b>${ic('play',44)}</b><h2>Aquí aparecerán los vídeos</h2><p>Todavía no se ha publicado nada.</p><div class="chips c"><button class="btn o" id="reloadCloud">Actualizar</button><a class="btn" href="#/create">Crear vídeo</a></div></div>`:'')}</div>`;
  document.querySelectorAll('[data-open-live]').forEach(b=>b.onclick=()=>openLiveFromFeed(b.dataset.openLive));
  const fd=$('#fd');
  if(!fd)return;
  const io=new IntersectionObserver(es=>es.forEach(async e=>{
    if(e.target.matches('.feed-live-slide')){
      const id=e.target.dataset.feedLiveId;
      if(e.isIntersecting){await activateFeedLive(id)}else{await deactivateFeedLive(id)}
      return;
    }
    const vd=e.target.querySelector('video');
    const cd=e.target.querySelector('.card');
    const m=vid(cd.dataset.id)||{};
    if(e.isIntersecting){
      vd.playbackRate=m.sp||1;
      vd.muted=S.muted||!!m.mu;
      vd.play().catch(()=>{});
      currentVideoId=m.id;
      updateAdminPanelForVideo(m.id);
      incrementView(m.id);
      cd._t=setTimeout(()=>{if(!S.hist.includes(m.id)){S.hist.unshift(m.id);S.hist=S.hist.slice(0,50);save()}},2000);
    }else{clearTimeout(cd._t);vd.pause()}
  }),{root:fd,threshold:.6});
  fd.querySelectorAll('.v,.feed-live-slide').forEach(s=>io.observe(s));
}

      <button class="admin-btn" data-adm="addBots">Añadir comentarios</button>
      <div class="admin-counter">Total: <b id="admCommCount">${v.commentCount||0}</b></div>
    </div>
  `;
  document.querySelectorAll('[data-adm]').forEach(b=>b.onclick=()=>handleAdminAction(b.dataset.adm,videoId));
}

async function handleAdminAction(action,videoId){
  const v=vid(videoId);if(!v)return;
  try{
    if(action==='saveLikes'){
      const input=$('#admInLikes');
      const val=Math.max(0,parseInt(input.value)||0);
      const likesReales=(v.likeCount||0)-(v.adminLikes||0);
      const adminVal=Math.max(0,val-likesReales);
      const {error}=await sb.rpc('admin_set_likes',{p_video:v.id,p_value:adminVal});
      if(error)throw error;
      v.adminLikes=adminVal;v.likeCount=likesReales+adminVal;
      $('#admLikeCount').textContent=v.likeCount;
      refresh(videoId);toast('Likes actualizados');
    }else if(action==='saveViews'){
      const input=$('#admInViews');
      const val=Math.max(0,parseInt(input.value)||0);
      const {error}=await sb.rpc('admin_set_views',{p_video:v.id,p_value:val});
      if(error)throw error;
      v.views=val;$('#admViewCount').textContent=val;
      refresh(videoId);toast('Vistas actualizadas');
    }else if(action==='saveFavs'){
      const input=$('#admInFavs');
      const val=Math.max(0,parseInt(input.value)||0);
      const savesReales=(v.saveCount||0)-(v.adminFavorites||0);
      const adminVal=Math.max(0,val-savesReales);
      const {error}=await sb.rpc('admin_set_favorites',{p_video:v.id,p_value:adminVal});
      if(error)throw error;
      v.adminFavorites=adminVal;v.saveCount=savesReales+adminVal;
      $('#admFavCount').textContent=v.saveCount;
      toast('Favoritos actualizados');
    }else if(action==='addBots'){
      const seed=($('#admBotText').value||'guapo').trim();
      const n=Math.max(1,Math.min(50,parseInt($('#admBotNum').value)||5));
      const me=await getMyId();
      for(let i=0;i<n;i++){
        const reply=botReplyFor(seed);
        const {error}=await sb.from('comments').insert({video_id:String(v.id),user_id:me,content:reply});
        if(error)throw error;
      }
      const {count}=await sb.from('comments').select('*',{count:'exact',head:true}).eq('video_id',v.id);
      v.commentCount=count||0;
      $('#admCommCount').textContent=v.commentCount;
      refresh(videoId);toast(n+' comentarios añadidos');
    }
  }catch(e){console.error(e);toast('Error: '+e.message)}
}

async function loadAndRenderMessages(convId){

function renderMessages(box,msgs,me){
  box.innerHTML=msgs.map(m=>{

    return `<div class="msg-row ${mine?'me':'them'}"><div class="bub ${mine?'me':'them'}">${esc(m.content)}<span class="time">${hh}</span></div></div>`;
  }).join('')||'<div class="em" style="padding:30px 10px"><b>'+ic('chat',36)+'</b>Envía el primer mensaje</div>';

async function subscribeChat(convId){
  if(chatChannel){await sb.removeChannel(chatChannel);chatChannel=null}
  chatChannel=sb.channel('nova-chat-'+convId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+convId},
      async payload=>{
        const box=$('#chatBody');if(!box)return;
        const me=await getMyId();
        const m=payload.new;const mine=m.sender_id===me;
        const t=new Date(m.created_at);
        const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
        const empty=box.querySelector('.em');if(empty)box.innerHTML='';
        const row=document.createElement('div');row.className='msg-row '+(mine?'me':'them');
        row.innerHTML=`<div class="bub ${mine?'me':'them'}">${esc(m.content)}<span class="time">${hh}</span></div>`;
        box.append(row);box.scrollTop=box.scrollHeight;
      })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations',filter:'id=eq.'+convId},payload=>{updateStreakPill(payload.new)})
    .subscribe(s=>console.log('Chat Realtime:',s));
}

async function openCameraCreate(first){
  if(first)cam();
  const nocam=(msg)=>{st=null;const v=$('#cv'),n=$('#nc'),er=$('#nce');v&&(v.style.display='none');n&&(n.style.display='flex');er&&(er.textContent=msg||'Permite el acceso a la cámara.')};
  if(!(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return nocam('Tu navegador no admite la cámara.');
  try{
    st&&st.getTracks().forEach(t=>t.stop());
    try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:fc},width:{ideal:1080},height:{ideal:1920}},audio:true})}
    catch(e){if(e&&(e.name==='NotFoundError'||e.name==='OverconstrainedError')){st=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}else throw e}
    const v=$('#cv'),n=$('#nc');

    nocam(msg);

  $('#bannerGalaxy').onclick=()=>{closeSheet();createGalaxyBanner()};
}
async function readBanner(f){
  const u=URL.createObjectURL(f),i=new Image();
  i.onload=async()=>{
    try{
      const c=document.createElement('canvas'); c.width=1200; c.height=400;
      const ctx=c.getContext('2d');
      // Fondo ampliado y desenfocado para evitar recortar/zoomear demasiado la foto principal.
      const bgScale=Math.max(c.width/i.width,c.height/i.height),bw=i.width*bgScale,bh=i.height*bgScale;
      ctx.save(); ctx.filter='blur(24px) brightness(.55)'; ctx.drawImage(i,(c.width-bw)/2,(c.height-bh)/2,bw,bh); ctx.restore();
      const scale=Math.min(c.width/i.width,c.height/i.height)*.94,w=i.width*scale,h=i.height*scale;
      ctx.drawImage(i,(c.width-w)/2,(c.height-h)/2,w,h);
      const data=c.toDataURL('image/jpeg',.88);
      URL.revokeObjectURL(u);
      ME.banner=data; S.acct=ME; save();
      if(sb&&supabaseUser){
        try{
          const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.88));
          const path=`profile-banners/${supabaseUser.id}.jpg`;
          const up=await sb.storage.from(VIDEO_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:true});
          if(!up.error){
            const pub=sb.storage.from(VIDEO_BUCKET).getPublicUrl(path).data.publicUrl;
            ME.banner=pub; S.acct=ME; save();
            const pr=await sb.from('profiles').update({banner_url:pub}).eq('id',supabaseUser.id);
            if(pr.error && !/banner_url|column/i.test(String(pr.error.message||''))) console.warn(pr.error);
          }
        }catch(e){console.warn('Banner cloud:',e)}
      }
      const pv=$('#profileBannerPreview');if(pv)pv.outerHTML=profileBannerHtml();
      toast('Banner actualizado');
    }catch(e){toast('No se pudo crear el banner')}
  };
  i.onerror=()=>toast('No se pudo leer la imagen'); i.src=u;
}
function createGalaxyBanner(){
  const c=document.createElement('canvas');c.width=1200;c.height=400;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1200,400);g.addColorStop(0,'#0a0618');g.addColorStop(.45,'#25145f');g.addColorStop(1,'#07334a');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
  const blobs=[['#8b7bff',210,110,170],['#35d0ff',930,290,210],['#d86cff',620,40,100]];
  blobs.forEach(([col,cx,cy,r])=>{const q=x.createRadialGradient(cx,cy,0,cx,cy,r);q.addColorStop(0,col+'cc');q.addColorStop(1,'transparent');x.fillStyle=q;x.fillRect(cx-r,cy-r,r*2,r*2)});
  for(let i=0;i<85;i++){const px=Math.random()*1200,py=Math.random()*400,sz=Math.random()*2+.4;x.fillStyle=`rgba(255,255,255,${.25+Math.random()*.7})`;x.beginPath();x.arc(px,py,sz,0,Math.PI*2);x.fill()}
  c.toBlob(b=>{if(b){const f=new File([b],'nova-banner.jpg',{type:'image/jpeg'});readBanner(f)}},'image/jpeg',.9);
}
function profileBannerHtml(){
  const b=ME?.banner;
  return `<div id="profileBannerPreview" class="profile-banner${b?'':' empty'}">${b?`<img src="${esc(b)}" alt="Banner de perfil">`:`<div><b>Crea tu banner de perfil</b></div>`}<div class="banner-tools"><button class="btn o" id="bannerEditBtn" type="button">Editar banner</button></div></div>`;
}
function readAv(f){
  const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=256;
    const z=Math.min(i.width,i.height);
    c.getContext('2d').drawImage(i,(i.width-z)/2,(i.height-z)/2,z,z,0,0,256,256);
    URL.revokeObjectURL(u);
    ME.av=c.toDataURL('image/jpeg',.85);save();
    $('#ap').innerHTML=avt(96);toast('Foto actualizada');
    if(sb&&supabaseUser){sb.from('profiles').update({avatar_url:ME.av}).eq('id',supabaseUser.id).then(()=>{},()=>{})}
  };
  i.onerror=()=>toast('No se pudo leer');
  i.src=u;
}
const renderCommentsList=list=>list.length?list.map(c=>`<div class="cm" style="display:flex;gap:8px;align-items:flex-start">${avt(30)}<div style="flex:1;min-width:0"><b>@${esc(c.u)}</b><div>${esc(c.t)}</div></div><button class="btn o" style="padding:4px 10px;font-size:12px" data-del-cm="${c.id}">Borrar</button></div>`).join(''):'<p class="mu">Sé el primero en comentar.</p>';
async function renderCommentSheetFor(videoId){

const A={
  x:closeSheet,
  pk:()=>$('#pf').click(),

  },
  sv:async e=>{const id=e.closest('.card').dataset.id;try{await toggleSave(id);toast(S.saved[id]?'Guardado':'Eliminado')}catch(err){toast('No se pudo')}},
  mute:()=>{S.muted=!S.muted;save();document.querySelectorAll('video').forEach(v=>v.muted=S.muted);document.querySelectorAll('[data-a=mute] b').forEach(b=>b.innerHTML=ic(S.muted?'voloff':'volon'));toast(S.muted?'Silenciado':'Sonido')},
  cm:async e=>{

  del:async e=>{
    const id=e.closest('.card').dataset.id;const v=vid(id);if(!v)return;
    if(!v.remote){if(!confirm('¿Borrar?'))return;S.meta=S.meta.filter(x=>x.id!=id);await idb('delete',id);save();go('#/');return}
    if(!confirm('¿Borrar de Supabase?'))return;
    try{
      const url=v.src||'';const match=url.match(/\/object\/public\/videos\/(.+)$/);
      if(match&&match[1])await sb.storage.from(VIDEO_BUCKET).remove([decodeURIComponent(match[1])]).catch(()=>{});
      const {error}=await sb.from('videos').delete().eq('id',id);
      if(error)throw error;
      S.meta=S.meta.filter(x=>x.id!=id);save();toast('Borrado');go('#/');
    }catch(err){toast('No se pudo borrar')}
  },
  bio:()=>{
    const ln=t=>t?Math.max(0,Math.ceil((t+D7-Date.now())/864e5)):0;
    const a=ln(ME.nAt),b=ln(ME.uAt);
    const nt=d=>d?'En '+d+(d>1?' días':' día'):'Una vez cada 7 días';
    sheet('Editar perfil',`${profileBannerHtml()}<div style="text-align:center"><button id="ap" data-a="pk">${avt(96)}</button><p><button class="btn o" data-a="pk">Cambiar foto</button></p></div><label for="en">Nombre</label><p><input id="en" value="${esc(ME.n)}" maxlength="24" ${a?'disabled':''}></p><p class="mu" style="font-size:12px">${nt(a)}</p><label for="eu">Usuario</label><p><input id="eu" value="${esc(ME.u)}" maxlength="20" ${b?'disabled':''}></p><p class="mu" style="font-size:12px">${nt(b)}</p><label for="bi">Bio</label><p><input id="bi" value="${esc(ME.bio||'')}" maxlength="120"></p><input id="pf" type="file" accept="image/*" hidden><button class="btn" data-a="bios">Guardar</button>`);
    $('#pf').onchange=e=>{const f=e.target.files[0];f&&readAv(f)};
    const be=$('#bannerEditBtn');if(be)be.onclick=openBannerEditor;
  },
  bios:async()=>{
    const n=$('#en').value.trim(),u=cl($('#eu').value);
    const cn=!$('#en').disabled&&n!=ME.n,cu=!$('#eu').disabled&&u!=ME.u;
    if(cn&&n.length<2)return toast('Mínimo 2 letras');
    if(cu&&u.length<3)return toast('Mínimo 3 caracteres');
    if(cn){ME.n=n;ME.nAt=Date.now()}
    if(cu){ME.u=u;ME.uAt=Date.now()}
    ME.bio=$('#bi').value;save();closeSheet();toast('Perfil actualizado');
    if(sb&&supabaseUser){try{await sb.from('profiles').update({username:ME.u,display_name:ME.n,bio:ME.bio}).eq('id',supabaseUser.id)}catch(e){}}
    profile();
  },
  out:()=>{S.acct=null;ME=null;save();welcome()}
};

document.addEventListener('click',ev=>{
  const al=ev.target.closest('a[href^="#/"]');
  if(al){ev.preventDefault();ME&&go(al.getAttribute('href'));return}
  const b=ev.target.closest('[data-a]');
  if(b){const f=A[b.dataset.a];f&&f(b);return}
  const c=ev.target.closest('.card');
  if(c&&!ev.target.closest('a,button')){
    const n=Date.now(),v=c.querySelector('video');
    const tg=()=>v.paused?v.play().catch(()=>{}):v.pause();
    tg();
    if(n-lastTap<300){tg();A.like({closest:()=>c})}
    lastTap=n;
  }
});

window.addEventListener('hashchange',()=>{if(ME&&location.hash&&location.hash!==H){H=location.hash;route()}});

function route(){
  const[r,a]=H.slice(2).split('/'),p=decodeURIComponent(a||'');
  closeSheet();camOff();
  document.body.classList.remove('nl');
  document.querySelectorAll('video').forEach(v=>{try{v.pause()}catch(e){}});
  if(r!=='live'){if(liveChannel){sb&&sb.removeChannel(liveChannel);liveChannel=null}stopLiveHeartbeat();currentLive=null;cleanupRTCPeers();stopLiveCamera()}
  if(r!=='c'){if(chatChannel){sb&&sb.removeChannel(chatChannel);chatChannel=null}currentChat={convId:null,otherUser:null,otherUsername:null}}
  document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.r==(r=='v'||r=='t'||r=='u'||r=='c'?'':r)));
  try{
    (({'':()=>feed(),v:()=>feed(p),discover,create:createMenu,profile,activity:activityPage,hist:history2,t:()=>tagPage(p),live:livePage,u:()=>publicProfile(p),messages:messagesPage,c:()=>chatPage(p)})[r]||(()=>feed()))();
  }catch(e){
    console.error(e);
    $('#m').innerHTML='<div class="em">Ups, algo salió mal.<br><br><a class="btn" href="#/">Volver</a></div>';
  }
}

/* ---------- Bienvenida ---------- */
function welcome(){
  document.body.classList.add('nl');closeSheet();
  const ov=document.getElementById('nova-loading'); ov&&ov.remove();
  $('#m').innerHTML=`<div class="wl"><div class="wc">
    <span class="logo">Nova</span>
    <p style="font-size:19px;opacity:.85">Creado por Asier, Ari y Adán. Disfrútalo</p>
    <div class="gl" id="wf">
      <button type="button" id="googleBtn" class="google-btn">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.27c0-.68-.06-1.35-.18-1.98H12v3.75h5.24a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.91-4.18 2.91-7.13z"/><path fill="#34A853" d="M12 21.7c2.62 0 4.82-.87 6.43-2.36l-3.14-2.43c-.87.58-1.98.93-3.29.93-2.53 0-4.68-1.71-5.45-4.01H3.3v2.5A9.72 9.72 0 0 0 12 21.7z"/><path fill="#FBBC05" d="M6.55 13.83A5.84 5.84 0 0 1 6.24 12c0-.64.11-1.26.31-1.83V7.67H3.3A9.7 9.7 0 0 0 2.27 12c0 1.56.37 3.03 1.03 4.33l3.25-2.5z"/><path fill="#EA4335" d="M12 6.16c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.81 3.25 14.62 2.3 12 2.3a9.72 9.72 0 0 0-8.7 5.37l3.25 2.5c.77-2.3 2.92-4.01 5.45-4.01z"/></svg>
        Continuar con Google
      </button>
      <div class="auth-divider">o crea tu perfil</div>
      <label for="wn">Nombre de visualización</label>
      <input id="wn" maxlength="24" placeholder="Ej. Alex">
      <label for="wu">Nombre de usuario</label>

      <button type="button" id="wb" class="btn" style="width:100%;padding:14px;font-size:16px">Entrar a Nova</button>

  const enter=async()=>{
    const n=$('#wn').value.trim();
    let u=cl($('#wu').value.trim())||cl(n);
    if(n.length<2){$('#we').textContent='Mínimo 2 letras.';$('#wn').focus();return}
    if(u.length<3)u=(u+'nova'+(Math.random()*900+100|0)).slice(0,20);
    S.acct={n,u,bio:''};ME=S.acct;save();
    try{const user=await ensureSupabaseUser();try{await ensureSupabaseProfile(user)}catch(e){}await refreshCloudFeed()}catch(e){}
    document.body.classList.remove('nl');go('#/');

  const google=async()=>{
    if(!sb){$('#we').textContent='Supabase no disponible.';return}
    try{
      const redirectTo=(location.protocol==='http:'||location.protocol==='https:')?location.href.split('#')[0]:null;
      if(!redirectTo){$('#we').textContent='Publica en https';return}
      const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}});
      if(error)throw error;
    }catch(e){$('#we').textContent=e.message}
  };
  $('#wb').onclick=enter;$('#googleBtn').onclick=google;
  $('#wf').onkeydown=e=>{e.key==='Enter'&&enter()};
}

/* ---------- Realtime ---------- */
async function subscribeCloudFeed(){
  if(!sb||cloudFeedChannel)return;
  cloudFeedChannel=sb.channel('nova-public-feed')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'videos'},async()=>{await refreshCloudFeed()})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'videos'},async()=>{await refreshCloudFeed()})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'lives'},async()=>{
      if(location.hash==='#/'||location.hash==='#')await refreshCloudFeed();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'lives',filter:'status=eq.ended'},async()=>{
      if(location.hash==='#/'||location.hash==='#')await refreshCloudFeed();
    })
    .subscribe(s=>console.log('Feed Realtime:',s));
}
async function subscribeSocial(){
  if(!sb||socialChannel)return;
  socialChannel=sb.channel('nova-social')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'likes'},p=>applyLikeDelta(p.new.video_id,+1))
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'likes'},p=>applyLikeDelta(p.old.video_id,-1))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'comments'},async p=>{applyCommentDelta(p.new.video_id,+1);if(String(p.new.video_id)===String(currentCommentsVideoId))await renderCommentSheetFor(currentCommentsVideoId)})
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'comments'},p=>applyCommentDelta(p.old.video_id,-1))
    .subscribe(s=>console.log('Social Realtime:',s));
}
function applyLikeDelta(videoId,delta){const v=vid(videoId);if(!v)return;v.likeCount=Math.max(0,(v.likeCount||0)+delta);refresh(videoId)}
function applyCommentDelta(videoId,delta){const v=vid(videoId);if(!v)return;v.commentCount=Math.max(0,(v.commentCount||0)+delta);refresh(videoId)}

/* ---------- Arranque ---------- */
(async()=>{
  const loading=document.getElementById('nova-loading');
  const hideLoading=()=>{loading&&loading.classList.add('gone');setTimeout(()=>loading&&loading.remove(),700)};

  if(adminEnabled){$('#adminFab').classList.add('on')}

  const waitIntro=()=>new Promise(resolve=>{
    const intro=document.getElementById('intro');
    if(!intro){resolve();return}
    const iv=setInterval(()=>{
      const i=document.getElementById('intro');
      if(!i||i.classList.contains('end')){clearInterval(iv);resolve()}
    },200);
    setTimeout(()=>{clearInterval(iv);resolve()},12000);
  });

  try{
    await Promise.all(S.meta.map(async v=>{
      if(v.remote)return;
      const b=await idb('get',v.id);
      if(b)v.src=URL.createObjectURL(b);
    }));
    S.meta=S.meta.filter(v=>v.src||v.remote);
    theme();
    await waitIntro();

    if(sb){
      try{
        const {data:{session}}=await sb.auth.getSession();
        if(session?.user){
          supabaseUser=session.user;
          const u=session.user;
          const n=u.user_metadata?.full_name||u.user_metadata?.name||'Nova';
          const base=cl(u.user_metadata?.preferred_username||u.user_metadata?.user_name||u.email?.split('@')[0]||'nova');
          const oldAcct=S.acct||{}; ME=S.acct={...oldAcct,n:oldAcct.n||n,u:base.slice(0,20)||oldAcct.u||'nova',bio:oldAcct.bio||''};
          save();
          try{await ensureSupabaseProfile(u)}catch(e){}
        }
        await refreshCloudFeed();
        const remoteIds=S.meta.filter(v=>v.remote).map(v=>String(v.id));
        if(remoteIds.length){try{await loadSocialState(remoteIds)}catch(e){}}
        subscribeCloudFeed();
        subscribeSocial();
        if(supabaseUser){subscribeNotifications().then(refreshNotifBadge).catch(()=>{})}
      }catch(e){console.warn('Supabase pendiente:',e)}
    }

    if(S.acct){ME=S.acct;route()}
    else welcome();
  }catch(e){
    console.error(e);
    if(S.acct){ME=S.acct;route()}
    else welcome();
  }finally{setTimeout(hideLoading,300)}
})();
