async function ensureSupabaseUser(){
  if(!sb) throw new Error('No se pudo cargar Supabase JS.');
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){supabaseUser=session.user;return session.user;}
  const {data,error}=await sb.auth.signInAnonymously();
  if(error){
    if(/anonymous|disabled/i.test(error.message||''))
      throw new Error('Activa "Anonymous sign-ins" en Supabase → Authentication → Providers.');
    throw error;
  }
  supabaseUser=data.user;

}
async function ensureSupabaseProfile(user){
  if(!sb||!user) throw new Error('Sesión de Supabase no disponible.');
  let desired=cl((ME&&ME.u)||user.user_metadata?.preferred_username||user.user_metadata?.user_name||'');
  if(desired.length<3){
    const base=cl((user.user_metadata?.name||user.user_metadata?.full_name||user.email?.split('@')[0]||'nova'));
    desired=(base||'nova').slice(0,14)+'_'+String(user.id||'').replace(/-/g,'').slice(0,5);
  }
  desired=desired.slice(0,20);

  const existing=await sb.from('profiles').select('id,username').eq('id',user.id).maybeSingle();
  if(existing.error) throw existing.error;
  if(existing.data?.id){
    if(existing.data.username&&ME&&ME.u!==existing.data.username){
      ME.u=existing.data.username;S.acct=ME;save();
    }
    return existing.data.username||desired;
  }
  let payload={id:user.id,username:desired};
  let res=await sb.from('profiles').insert(payload).select('id,username').single();
  let attempts=0;
  while(res.error&&String(res.error.code)==='23505'&&attempts<3){
    attempts++;
    payload.username=(desired.slice(0,14)+'_'+Math.random().toString(36).slice(2,7)).slice(0,20);
    res=await sb.from('profiles').insert(payload).select('id,username').single();
  }
  if(res.error) throw res.error;
  if(ME&&ME.u!==payload.username){ME.u=payload.username;S.acct=ME;save()}
  return payload.username;
}

  else if(mime.includes('ogg'))ext='ogg';

  const uid=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
  const path=`${user.id}/${uid}.${ext}`;

async function loadSocialState(videoIds){
  if(!sb||!videoIds.length)return;
  const ids=videoIds.map(String);
  const {data:{session}}=await sb.auth.getSession();
  const uid=session?.user?.id;
  const [likes, comments, saves]=await Promise.all([
    sb.from('likes').select('video_id').in('video_id',ids),
    sb.from('comments').select('video_id').in('video_id',ids),
    sb.from('saves').select('video_id').in('video_id',ids)
  ]);
  const likeMap={}, commentMap={}, saveMap={};
  (likes.data||[]).forEach(r=>likeMap[r.video_id]=(likeMap[r.video_id]||0)+1);
  (comments.data||[]).forEach(r=>commentMap[r.video_id]=(commentMap[r.video_id]||0)+1);
  (saves.data||[]).forEach(r=>saveMap[r.video_id]=(saveMap[r.video_id]||0)+1);
  S.meta.forEach(v=>{
    const key=String(v.id);
    if(!ids.includes(key))return;
    v.likeCount=(likeMap[key]||0)+(v.adminLikes||0);
    v.commentCount=commentMap[key]||0;
    v.saveCount=(saveMap[key]||0)+(v.adminFavorites||0);
  });
  if(uid){
    const [myLikes, mySaves]=await Promise.all([
      sb.from('likes').select('video_id').eq('user_id',uid).in('video_id',ids),
      sb.from('saves').select('video_id').eq('user_id',uid).in('video_id',ids)
    ]);
    S.liked={}; S.saved={};
    (myLikes.data||[]).forEach(r=>S.liked[r.video_id]=1);
    (mySaves.data||[]).forEach(r=>S.saved[r.video_id]=1);
    save();
  }
}

function computeStreakDisplay(c){
  if(!c)return {count:0,active:false};
  const today=new Date().toISOString().slice(0,10);
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  let count=c.streak_count||0;
  const aLast=c.a_last_msg,bLast=c.b_last_msg;
  const bothToday = aLast===today && bLast===today;
  const bothRecent = (aLast===today||aLast===y) && (bLast===today||bLast===y);
  if(count>0){
    if(c.streak_last===today && bothToday){}
    else if(c.streak_last===y && bothRecent){}
    else{count=0}
  }
  const active = count>0 && bothRecent;
  return {count,active};
}
const STREAK_LEVELS=[
  {min:0,cls:'off',glow:'none'},
  {min:1,cls:'lvl1',glow:'0 0 8px rgba(255,180,90,.5)'},
  {min:3,cls:'lvl2',glow:'0 0 14px rgba(255,140,60,.7)'},
  {min:7,cls:'lvl3',glow:'0 0 20px rgba(255,80,60,.9)'},
  {min:14,cls:'lvl4',glow:'0 0 26px rgba(180,90,255,1), 0 0 40px rgba(90,180,255,.7)'}
];
function streakLevel(n){let lv=STREAK_LEVELS[0];for(const l of STREAK_LEVELS){if(n>=l.min)lv=l}return lv}
function updateStreakPill(conv){
  const pill=$('#streakPill'); if(!pill)return;
  const s=computeStreakDisplay(conv);
  const numEl=pill.querySelector('#streakNum');
  const prev=Number(numEl.textContent||0);
  numEl.textContent=s.count;
  const lv=streakLevel(s.count);
  pill.className='streak '+(s.count===0||!s.active?'off':lv.cls);
  pill.style.boxShadow=s.count>0&&s.active?lv.glow:'none';
  if(s.count>prev){
    pill.classList.remove('bump');void pill.offsetWidth;
    pill.classList.add('bump');burstFire(pill);
    toast('¡Racha subida! '+s.count);
  }
}
function burstFire(anchor){
  const rect=anchor.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    p.className='fire-particle';p.innerHTML=sticker(i%2?'fire':'star','sm');
    const angle=(Math.PI*2)*(i/10),dist=40+Math.random()*40;
    p.style.left=cx+'px';p.style.top=cy+'px';
    p.style.setProperty('--tx',Math.cos(angle)*dist+'px');
    p.style.setProperty('--ty',Math.sin(angle)*dist+'px');
    p.style.setProperty('--rot',(Math.random()*360-180)+'deg');
    p.style.fontSize=(10+Math.random()*10)+'px';
    document.body.append(p);setTimeout(()=>p.remove(),900);
  }
}

async function subscribeLive(liveId){

    .on('postgres_changes',{event:'INSERT',schema:'public',table:'live_messages',filter:'live_id=eq.'+liveId},
      async payload=>{
        const m=payload.new;m.__username=await getUsername(m.user_id);
        renderLiveMessage(m);const b=$('#liveMessages');if(b)b.scrollTop=b.scrollHeight;
      })
    .on('broadcast',{event:'live-chat'},payload=>{
      const m=payload.payload||{};
      if(String(m.liveId)!==String(liveId)||!m.message||!m.userId)return;
      if(String(m.clientId)===String(rtcClientId))return;
      m.__username=m.username||'usuario';renderLiveMessage(m);const b=$('#liveMessages');if(b)b.scrollTop=b.scrollHeight;
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'lives',filter:'id=eq.'+liveId},payload=>{
      const row=payload.new||{};
      if(currentLive&&String(currentLive.id)===String(liveId))currentLive=row;
      const vc=$('#liveViewerCount'); if(vc)vc.textContent=Number(row.viewer_count||0); const vct=$('#liveViewerCountTop'); if(vct)vct.textContent=Number(row.viewer_count||0);

      if(row.status!=='live'){const ph=$('#feedLivePlaceholder');if(ph)ph.style.display='grid';}
    })
    .on('broadcast',{event:'rtc'},async ({payload})=>{try{await handleRTCSignal(payload)}catch(e){}});
  // Supabase Realtime no permite añadir callbacks postgres_changes después de subscribe().
  // Registramos el listener de regalos ANTES de suscribir el canal.
  await subscribeLiveGifts(liveId);
  liveChannel.subscribe(status=>{
    if(status==='SUBSCRIBED'&&rtcRole==='viewer'){
      liveChannel.send({type:'broadcast',event:'rtc',payload:{type:'viewer-join',from:rtcClientId,liveId}}).catch(()=>{});
    }
  });
  // Si el canal ya estaba suscrito o el estado del rol cambió justo antes de suscribir,
  // el viewer-join se vuelve a enviar de forma segura.
  setTimeout(()=>{
    if(liveChannel && liveChannel.state==='joined' && rtcRole==='viewer' && currentLive?.id===liveId){
      liveChannel.send({type:'broadcast',event:'rtc',payload:{type:'viewer-join',from:rtcClientId,liveId}}).catch(()=>{});
    }
  },350);
}
function getLiveVideo(){return $('#feedLiveVideo')||$('#liveCam')}
function rtcConfig(){return {iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}}
function cleanupRTCPeers(){
  if(liveViewerRetryTimer){clearInterval(liveViewerRetryTimer);liveViewerRetryTimer=null}
  rtcPeers.forEach(pc=>{try{pc.close()}catch(e){}});rtcPeers.clear();rtcPendingIce.clear();rtcRole='';
  const v=getLiveVideo(); if(v&&v.srcObject&&v.srcObject!==liveStream)v.srcObject=null;
}
async function sendRTC(payload){
  if(!liveChannel)return;
  try{await liveChannel.send({type:'broadcast',event:'rtc',payload:{...payload,liveId:currentLive?.id}})}catch(e){}
}
function queueOrAddIce(key,pc,candidate){
  if(!candidate||!pc)return;
  if(pc.remoteDescription&&pc.remoteDescription.type){pc.addIceCandidate(candidate).catch(()=>{});return}
  const q=rtcPendingIce.get(key)||[];q.push(candidate);rtcPendingIce.set(key,q);
}
async function flushIce(key,pc){
  const q=rtcPendingIce.get(key)||[];rtcPendingIce.delete(key);
  for(const c of q){try{await pc.addIceCandidate(c)}catch(e){}}
}
function sendViewerJoin(){
  if(liveChannel&&liveChannel.state==='joined'&&rtcRole==='viewer'&&currentLive?.id){
    liveChannel.send({type:'broadcast',event:'rtc',payload:{type:'viewer-join',from:rtcClientId,liveId:currentLive.id}}).catch(()=>{});
  }
}
async function makeBroadcasterPeer(viewerId){
  if(!liveStream||!liveChannel)return;
  const old=rtcPeers.get(viewerId); if(old){try{old.close()}catch(e){};rtcPeers.delete(viewerId)}
  const pc=new RTCPeerConnection(rtcConfig()); rtcPeers.set(viewerId,pc);
  liveStream.getTracks().forEach(track=>pc.addTrack(track,liveStream));
  pc.onicecandidate=e=>{if(e.candidate)sendRTC({type:'ice',to:viewerId,from:rtcClientId,candidate:e.candidate})};
  pc.onconnectionstatechange=()=>{
    if(['failed','closed'].includes(pc.connectionState)){try{pc.close()}catch(e){};rtcPeers.delete(viewerId)}
  };
  setTimeout(()=>{if(pc.connectionState!=='connected'){try{pc.close()}catch(e){};rtcPeers.delete(viewerId)}},30000);
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
  await sendRTC({type:'offer',to:viewerId,from:rtcClientId,offer:pc.localDescription});
}
async function handleRTCSignal(msg){
  if(!msg||String(msg.liveId)!==String(currentLive?.id))return;
  if(msg.type==='viewer-join'&&rtcRole==='broadcaster'&&msg.from){await makeBroadcasterPeer(msg.from);return}
  if(msg.type==='host-ready'&&rtcRole==='viewer'&&msg.from){sendViewerJoin();return}
  if(msg.to&&msg.to!==rtcClientId)return;
  if(msg.type==='offer'&&rtcRole==='viewer'){
    const old=rtcPeers.get('broadcaster');if(old){try{old.close()}catch(e){}}
    const pc=new RTCPeerConnection(rtcConfig()); rtcPeers.set('broadcaster',pc);
    pc.ontrack=e=>{
      const v=getLiveVideo();
      if(v&&e.streams[0]){
        liveRtcConnected=true;
        if(liveJoinTimer){clearTimeout(liveJoinTimer);liveJoinTimer=null}
        v.srcObject=e.streams[0];
        // Autoplay móvil es mucho más fiable en silencio. El espectador puede activar el audio con el botón.
        v.muted=true;v.controls=false;v.style.display='';
        v.play().catch(()=>{});
        const off=$('#liveCamOff');if(off)off.style.display='none';
        const sbt=$('#liveSoundBtn');if(sbt)sbt.style.display='block';
      }
    };
    pc.onicecandidate=e=>{if(e.candidate)sendRTC({type:'ice',to:msg.from,from:rtcClientId,candidate:e.candidate})};
    pc.onconnectionstatechange=()=>{
      if(['failed','closed'].includes(pc.connectionState)){
        liveRtcConnected=false;
        const off=$('#liveCamOff');if(off){off.style.display='grid';off.innerHTML='<div><b>Reconectando al Live…</b><span>Intentando recuperar la cámara.</span></div>';}
        setTimeout(sendViewerJoin,700);
      }
    };
    await pc.setRemoteDescription(msg.offer);
    await flushIce('broadcaster',pc);
    const answer=await pc.createAnswer(); await pc.setLocalDescription(answer);
    await sendRTC({type:'answer',to:msg.from,from:rtcClientId,answer:pc.localDescription});
    return;
  }
  if(msg.type==='answer'&&rtcRole==='broadcaster'&&msg.from){const pc=rtcPeers.get(msg.from);if(!pc)return;await pc.setRemoteDescription(msg.answer);await flushIce(msg.from,pc);return}
  if(msg.type==='ice'&&msg.from&&msg.candidate){
    const key=rtcRole==='broadcaster'?msg.from:'broadcaster';
    const pc=rtcPeers.get(key);
    if(!pc){const q=rtcPendingIce.get(key)||[];q.push(msg.candidate);rtcPendingIce.set(key,q);return}
    queueOrAddIce(key,pc,msg.candidate);
  }
}

let liveStream=null;
async function startLiveCamera(){
  if(liveStream)return liveStream;
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('Sin cámara.');
  const video={facingMode:'user',width:{ideal:1080},height:{ideal:1920}};
  let st;

  // En algunos móviles Android el navegador devuelve "Could not start audio source"
  // cuando se solicitan cámara y micrófono en la misma llamada. Abrimos primero
  // la cámara para que un fallo del micrófono nunca impida iniciar el Live.
  try{
    st=await navigator.mediaDevices.getUserMedia({video});
  }catch(e){
    const name=String(e?.name||'');
    const msg=String(e?.message||'');
    if(name==='NotAllowedError')throw new Error('Permiso de cámara denegado. Actívalo en el navegador.');
    if(name==='NotFoundError')throw new Error('No se encontró la cámara.');
    if(name==='NotReadableError' || /Could not start|source/i.test(msg))throw new Error('La cámara está siendo usada por otra aplicación.');
    throw new Error(msg||'No se pudo iniciar la cámara');
  }

  // El micrófono es opcional: si Android no puede abrirlo, el vídeo sigue en directo.
  try{
    const mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    mic.getAudioTracks().forEach(t=>st.addTrack(t));
  }catch(e){
    console.warn('Nova: micrófono no disponible; el Live continuará con vídeo.',e);
  }

  liveStream=st;
  const v=getLiveVideo();
  if(v){v.srcObject=liveStream;v.muted=true;try{await v.play()}catch(e){}}
  return liveStream;
}
function stopLiveCamera(){if(liveStream){liveStream.getTracks().forEach(t=>t.stop());liveStream=null}const v=getLiveVideo();if(v)v.srcObject=null}

    $('#startLiveBtn').style.display='none'; $('#endLiveBtn').style.display=''; const gb=$('#liveGiftBtn');if(gb)gb.style.display='none';

async function joinLive(id){

    if(error)throw error;
    if(data.status!=='live')throw new Error('Ese directo ya no está disponible');
    currentLive=data; liveRtcConnected=false; if(liveJoinTimer)clearTimeout(liveJoinTimer); giftCombo={senderId:null,count:0,lastAt:0}; const vc=$('#liveViewerCount'); if(vc)vc.textContent=Number(data.viewer_count||0); stopLiveCamera(); cleanupRTCPeers();
    const me=await getMyId();

    const joinRes=await sb.rpc('join_live',{p_live:id}); if(joinRes.error) console.warn('Nova: join_live:',joinRes.error); const uname=await getUsername(me); const msgRes=await sb.from('live_messages').insert({live_id:id,user_id:me,message:`@${uname} se unió al live`}); if(msgRes.error) console.warn('Nova: mensaje de entrada:',msgRes.error);

    $('#startLiveBtn').style.display='none'; $('#endLiveBtn').style.display='none'; const gb=$('#liveGiftBtn');if(gb)gb.style.display=isLiveOwner()?'none':'flex';
    liveJoinTimer=setTimeout(()=>{if(currentLive&&String(currentLive.id)===String(id)&&!liveRtcConnected){sendViewerJoin();}},35000);
    if(liveViewerRetryTimer)clearInterval(liveViewerRetryTimer);
    let tries=0;
    liveViewerRetryTimer=setInterval(()=>{
      if(liveRtcConnected||!currentLive||String(currentLive.id)!==String(id)){clearInterval(liveViewerRetryTimer);liveViewerRetryTimer=null;return}

}

async function getActiveLives(){
  if(!sb)return [];
  try{
    const me=await getMyId();
    const {data,error}=await sb.from('lives').select('id,title,user_id,started_at,viewer_count,status').eq('status','live').order('started_at',{ascending:false}).limit(30);
    if(error||!data?.length)return [];
    // Un directo solo es mostrable si la cuenta sigue teniendo perfil.
    const ids=[...new Set(data.map(x=>x.user_id).filter(Boolean))];
    if(!ids.length)return [];
    const {data:profiles,error:pe}=await sb.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);
    if(pe)return [];
    const pm=new Map((profiles||[]).map(p=>[String(p.id),p]));
    const valid=data.filter(x=>{
      if(!x.user_id)return false;
      if(!pm.has(String(x.user_id)))return false;
      // Evita que una fila antigua que quedó como "live" aparezca eternamente.
      return isLiveFresh(x);
    }).map(x=>({...x,profile:pm.get(String(x.user_id))}));
    return valid;
  }catch(e){return []}
}

const BOT_NAMES=['carlos_92','maria.x','javito','luciaG','dani_rm','sofi_99','alex7','pedri_fan','nuria_v','manu.g','lorena.c','iker_boy','irene.r','pablo_23','raquel.x','ruben_g','cris.m','sara_love','juanma','nerea_4'];
const BOT_RESPONSES={
  guapo:['¡Está increíble!','Uff, qué guapo','Totalmente de acuerdo','Sí, sí, sí','Menudo nivel','Está brutal'],
  feo:['No es para tanto 😅','Bueno, para gustos colores','Yo no lo veo así','Hay mejores, la verdad'],
  increible:['¡Sí! Impresionante','Nunca vi algo así','Qué locura'],
  bueno:['Está muy bien 👌','Buen trabajo','Sigue así'],
  malo:['No me convence mucho 🤔','Podría estar mejor','Le falta algo…'],
  gracioso:['JAJAJAJA','Me muero de risa','Qué bueno'],
  default:['¡Qué bueno!','Me encanta','Uff','Brutal','Está genial','Muy top']
};
function botReplyFor(text){
  const t=text.toLowerCase();
  for(const key in BOT_RESPONSES){if(key==='default')continue;if(t.includes(key))return BOT_RESPONSES[key][Math.floor(Math.random()*BOT_RESPONSES[key].length)]}
  return BOT_RESPONSES.default[Math.floor(Math.random()*BOT_RESPONSES.default.length)];
}

async function handleAdminAction(action,videoId){
  const v=vid(videoId);if(!v)return;
  try{
    if(action==='saveLikes'){
      const input=$('#admInLikes');
      const val=Math.max(0,parseInt(input.value)||0);
      const likesReales=(v.likeCount||0)-(v.adminLikes||0);
      const adminVal=Math.max(0,val-likesReales);
      const {error}=await sb.rpc('admin_set_likes',{p_video:v.id,p_value:adminVal});
      if(error)throw error;
      v.adminLikes=adminVal;v.likeCount=likesReales+adminVal;
      $('#admLikeCount').textContent=v.likeCount;
      refresh(videoId);toast('Likes actualizados');
    }else if(action==='saveViews'){
      const input=$('#admInViews');
      const val=Math.max(0,parseInt(input.value)||0);
      const {error}=await sb.rpc('admin_set_views',{p_video:v.id,p_value:val});
      if(error)throw error;
      v.views=val;$('#admViewCount').textContent=val;
      refresh(videoId);toast('Vistas actualizadas');
    }else if(action==='saveFavs'){
      const input=$('#admInFavs');
      const val=Math.max(0,parseInt(input.value)||0);
      const savesReales=(v.saveCount||0)-(v.adminFavorites||0);
      const adminVal=Math.max(0,val-savesReales);
      const {error}=await sb.rpc('admin_set_favorites',{p_video:v.id,p_value:adminVal});
      if(error)throw error;
      v.adminFavorites=adminVal;v.saveCount=savesReales+adminVal;
      $('#admFavCount').textContent=v.saveCount;
      toast('Favoritos actualizados');
    }else if(action==='addBots'){
      const seed=($('#admBotText').value||'guapo').trim();
      const n=Math.max(1,Math.min(50,parseInt($('#admBotNum').value)||5));
      const me=await getMyId();
      for(let i=0;i<n;i++){
        const reply=botReplyFor(seed);
        const {error}=await sb.from('comments').insert({video_id:String(v.id),user_id:me,content:reply});
        if(error)throw error;
      }
      const {count}=await sb.from('comments').select('*',{count:'exact',head:true}).eq('video_id',v.id);
      v.commentCount=count||0;
      $('#admCommCount').textContent=v.commentCount;
      refresh(videoId);toast(n+' comentarios añadidos');
    }
  }catch(e){console.error(e);toast('Error: '+e.message)}
}

async function openCameraCreate(first){
  if(first)cam();

  if(!(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return nocam('Tu navegador no admite la cámara.');
  try{
    st&&st.getTracks().forEach(t=>t.stop());
    try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:fc},width:{ideal:1080},height:{ideal:1920}},audio:true})}
    catch(e){if(e&&(e.name==='NotFoundError'||e.name==='OverconstrainedError')){st=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}else throw e}

function start(){

async function readBanner(f){
  const u=URL.createObjectURL(f),i=new Image();
  i.onload=async()=>{
    try{
      const c=document.createElement('canvas'); c.width=1200; c.height=400;
      const ctx=c.getContext('2d');
      // Fondo ampliado y desenfocado para evitar recortar/zoomear demasiado la foto principal.
      const bgScale=Math.max(c.width/i.width,c.height/i.height),bw=i.width*bgScale,bh=i.height*bgScale;
      ctx.save(); ctx.filter='blur(24px) brightness(.55)'; ctx.drawImage(i,(c.width-bw)/2,(c.height-bh)/2,bw,bh); ctx.restore();
      const scale=Math.min(c.width/i.width,c.height/i.height)*.94,w=i.width*scale,h=i.height*scale;
      ctx.drawImage(i,(c.width-w)/2,(c.height-h)/2,w,h);
      const data=c.toDataURL('image/jpeg',.88);
      URL.revokeObjectURL(u);
      ME.banner=data; S.acct=ME; save();
      if(sb&&supabaseUser){
        try{
          const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.88));
          const path=`profile-banners/${supabaseUser.id}.jpg`;
          const up=await sb.storage.from(VIDEO_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:true});
          if(!up.error){
            const pub=sb.storage.from(VIDEO_BUCKET).getPublicUrl(path).data.publicUrl;
            ME.banner=pub; S.acct=ME; save();
            const pr=await sb.from('profiles').update({banner_url:pub}).eq('id',supabaseUser.id);
            if(pr.error && !/banner_url|column/i.test(String(pr.error.message||''))) console.warn(pr.error);
          }
        }catch(e){console.warn('Banner cloud:',e)}
      }
      const pv=$('#profileBannerPreview');if(pv)pv.outerHTML=profileBannerHtml();
      toast('Banner actualizado');
    }catch(e){toast('No se pudo crear el banner')}
  };
  i.onerror=()=>toast('No se pudo leer la imagen'); i.src=u;
}
function createGalaxyBanner(){
  const c=document.createElement('canvas');c.width=1200;c.height=400;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1200,400);g.addColorStop(0,'#0a0618');g.addColorStop(.45,'#25145f');g.addColorStop(1,'#07334a');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
  const blobs=[['#8b7bff',210,110,170],['#35d0ff',930,290,210],['#d86cff',620,40,100]];
  blobs.forEach(([col,cx,cy,r])=>{const q=x.createRadialGradient(cx,cy,0,cx,cy,r);q.addColorStop(0,col+'cc');q.addColorStop(1,'transparent');x.fillStyle=q;x.fillRect(cx-r,cy-r,r*2,r*2)});
  for(let i=0;i<85;i++){const px=Math.random()*1200,py=Math.random()*400,sz=Math.random()*2+.4;x.fillStyle=`rgba(255,255,255,${.25+Math.random()*.7})`;x.beginPath();x.arc(px,py,sz,0,Math.PI*2);x.fill()}
  c.toBlob(b=>{if(b){const f=new File([b],'nova-banner.jpg',{type:'image/jpeg'});readBanner(f)}},'image/jpeg',.9);
}
function profileBannerHtml(){
  const b=ME?.banner;
  return `<div id="profileBannerPreview" class="profile-banner${b?'':' empty'}">${b?`<img src="${esc(b)}" alt="Banner de perfil">`:`<div><b>Crea tu banner de perfil</b></div>`}<div class="banner-tools"><button class="btn o" id="bannerEditBtn" type="button">Editar banner</button></div></div>`;
}
function readAv(f){
  const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=256;
    const z=Math.min(i.width,i.height);
    c.getContext('2d').drawImage(i,(i.width-z)/2,(i.height-z)/2,z,z,0,0,256,256);
    URL.revokeObjectURL(u);
    ME.av=c.toDataURL('image/jpeg',.85);save();
    $('#ap').innerHTML=avt(96);toast('Foto actualizada');
    if(sb&&supabaseUser){sb.from('profiles').update({avatar_url:ME.av}).eq('id',supabaseUser.id).then(()=>{},()=>{})}
  };
  i.onerror=()=>toast('No se pudo leer');

async function openDuet(videoId){
  const v=vid(videoId);if(!v)return;
  document.body.classList.add('nl');
  $('#m').innerHTML=`<div class="duet-sheet"><div class="feature-box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">Dueto</h2><button class="cb" id="duetClose">${ic('x',22)}</button></div><div class="duet-stage"><video id="duetOriginal" autoplay muted loop playsinline crossorigin="anonymous"></video><video id="duetMe" autoplay muted playsinline></video><span class="duet-label">DUETO</span></div><div class="chips" style="margin-top:12px"><button class="btn o" id="duetFlip">Girar</button><button class="btn" id="duetRec">Grabar</button></div><p id="duetStatus" class="mu" style="margin-top:8px;font-size:12px">Pulsa Grabar para activar la cámara y comenzar.</p></div></div>`;
  $('#duetClose').onclick=()=>go('#/');
  let stream=null,rec=null,chunks=[],raf=0,recording=false,canvas=null,ctx=null;
  const original=$('#duetOriginal'),me=$('#duetMe'),btn=$('#duetRec'),status=$('#duetStatus');
  let originalObjectUrl='';
  try{
    original.crossOrigin='anonymous';
    const response=await fetch(v.src,{mode:'cors',credentials:'omit'});
    if(!response.ok)throw new Error('No se pudo cargar el vídeo original del dueto.');
    const blob=await response.blob();
    originalObjectUrl=URL.createObjectURL(blob);
    original.src=originalObjectUrl;
    await new Promise((resolve,reject)=>{original.onloadeddata=resolve;original.onerror=()=>reject(new Error('El vídeo original no permite grabar el dueto.'))});
    await original.play().catch(()=>{});
  }catch(e){
    status.textContent='Este vídeo no permite crear el dueto porque el servidor bloquea la composición.';
    btn.disabled=true;
    console.error('Dueto CORS:',e);
    toast('Este vídeo no permite grabar un dueto');
  }
  const stopAll=()=>{if(raf)cancelAnimationFrame(raf);raf=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;me.srcObject=null;if(originalObjectUrl){URL.revokeObjectURL(originalObjectUrl);originalObjectUrl=''}};
  const draw=()=>{
    if(!canvas||!ctx)return;
    ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
    const w=canvas.width/2;
    const w2=canvas.width-w;
    const fit=(el,x,cw)=>{const vw=el.videoWidth||360,vh=el.videoHeight||640,sc=Math.max(cw/vw,canvas.height/vh),dw=vw*sc,dh=vh*sc;ctx.drawImage(el,x+(cw-dw)/2,(canvas.height-dh)/2,dw,dh)};
    fit(original,0,w);fit(me,w,w2);raf=requestAnimationFrame(draw);
  };
  const startRecording=async()=>{
    if(recording)return;
    btn.disabled=true;status.textContent='Solicitando cámara y micrófono…';
    try{
      if(!navigator.mediaDevices?.getUserMedia)throw new Error('Tu navegador no permite usar la cámara desde este archivo. Ábrelo en Chrome/HTTPS.');
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});
      me.srcObject=stream;await me.play().catch(()=>{});
      canvas=document.createElement('canvas');canvas.width=720;canvas.height=1280;ctx=canvas.getContext('2d');draw();
      const out=canvas.captureStream(30),audio=stream.getAudioTracks()[0];if(audio)out.addTrack(audio);
      const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
      const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
      if(!window.MediaRecorder)throw new Error('MediaRecorder no está disponible en este navegador.');
      rec=new MediaRecorder(out,mt?{mimeType:mt}:{});chunks=[];recording=true;
      rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
      rec.onerror=e=>{console.error(e);recording=false;btn.disabled=false;status.textContent='No se pudo grabar el dueto.';stopAll();toast('Error al grabar el dueto')};
      rec.onstop=()=>{const type=rec.mimeType||'video/webm';const b=new Blob(chunks,{type});recording=false;btn.disabled=false;btn.textContent='Grabar';status.textContent='Dueto grabado. Abriendo publicación…';stopAll();if(b.size<1000){toast('La grabación quedó vacía');return}editor(new File([b],'dueto.webm',{type}),'')};
      rec.start(250);btn.disabled=false;btn.textContent='Parar y continuar';status.textContent='● Grabando dueto…';toast('Grabando dueto');
    }catch(e){console.error('Dueto:',e);btn.disabled=false;status.textContent=String(e.message||e);toast('No se pudo iniciar el dueto')}
  };
  btn.onclick=()=>{if(recording){if(rec&&rec.state!=='inactive')rec.stop()}else startRecording()};
  $('#duetFlip').onclick=()=>{me.style.transform=me.style.transform?'':'scaleX(-1)'};
  $('#duetClose').addEventListener('click',stopAll,{once:false});
}

  });

  try{
    await Promise.all(S.meta.map(async v=>{
      if(v.remote)return;
      const b=await idb('get',v.id);
      if(b)v.src=URL.createObjectURL(b);
    }));
    S.meta=S.meta.filter(v=>v.src||v.remote);
    theme();
    await waitIntro();

    if(sb){
      try{
        const {data:{session}}=await sb.auth.getSession();
        if(session?.user){
          supabaseUser=session.user;
          const u=session.user;
          const n=u.user_metadata?.full_name||u.user_metadata?.name||'Nova';
          const base=cl(u.user_metadata?.preferred_username||u.user_metadata?.user_name||u.email?.split('@')[0]||'nova');
          const oldAcct=S.acct||{}; ME=S.acct={...oldAcct,n:oldAcct.n||n,u:base.slice(0,20)||oldAcct.u||'nova',bio:oldAcct.bio||''};
          save();
          try{await ensureSupabaseProfile(u)}catch(e){}
        }
        await refreshCloudFeed();
        const remoteIds=S.meta.filter(v=>v.remote).map(v=>String(v.id));
        if(remoteIds.length){try{await loadSocialState(remoteIds)}catch(e){}}
        subscribeCloudFeed();
        subscribeSocial();
        if(supabaseUser){subscribeNotifications().then(refreshNotifBadge).catch(()=>{})}
      }catch(e){console.warn('Supabase pendiente:',e)}
    }

    if(S.acct){ME=S.acct;route()}
    else welcome();
  }catch(e){
    console.error(e);
    if(S.acct){ME=S.acct;route()}
    else welcome();
  }finally{setTimeout(hideLoading,300)}
})();

function nvClothesOverlay(ids=[]){let a=Array.isArray(ids)?ids:[];let out='';if(a.includes('hoodie'))out+=`<path d="M105 177 Q150 151 195 177 L207 248 Q184 264 150 259 Q116 264 93 248Z" fill="#6249b7" stroke="#a997ff" stroke-width="3"/><path d="M120 181 Q150 198 180 181" fill="none" stroke="#d9d2ff" stroke-width="4"/>`;if(a.includes('cape')||a.includes('nova-cape'))out+=`<path d="M105 176 Q150 157 195 176 L222 252 Q150 279 78 252Z" fill="url(#petbg${nvPetState.pet})" stroke="#8b7bff" stroke-width="3"/><path d="M83 220 Q150 190 217 220" fill="none" stroke="#35d0ff" stroke-width="2" opacity=".7"/>`;if(a.includes('scarf'))out+=`<path d="M99 169 Q150 184 201 169 L195 194 Q150 207 105 194Z" fill="#2e83c7" stroke="#77dfff" stroke-width="2"/>`;if(a.includes('crown'))out+=`<path d="M119 66 L129 43 150 62 171 43 181 66Z" fill="#ffd85a" stroke="#fff0a0" stroke-width="3"/>`;if(a.includes('glasses'))out+=`<g fill="#35d0ff" fill-opacity=".22" stroke="#d5fbff" stroke-width="3"><rect x="119" y="101" width="25" height="19" rx="7"/><rect x="156" y="101" width="25" height="19" rx="7"/><path d="M144 108h12"/></g>`;if(a.includes('bow'))out+=`<g transform="translate(150 171)"><path d="M0 0 Q-27 -18 -39 -3 Q-31 18 0 8Z" fill="#ff5cba" stroke="#ffb1e0" stroke-width="2"/><path d="M0 0 Q27 -18 39 -3 Q31 18 0 8Z" fill="#8b7bff" stroke="#c5bbff" stroke-width="2"/><circle r="7" fill="#ffd76a"/></g>`;if(a.includes('backpack'))out+=`<path d="M94 190 Q76 196 82 239 Q88 250 103 243 L111 200Z" fill="#2c9e9a" stroke="#70fff5" stroke-width="2"/><path d="M206 190 Q224 196 218 239 Q212 250 197 243 L189 200Z" fill="#2c9e9a" stroke="#70fff5" stroke-width="2"/>`;return out}
function nvClothingIcon(type){const base=`<svg viewBox="0 0 120 120"><defs><linearGradient id="ci" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7bff"/><stop offset="1" stop-color="#35d0ff"/></linearGradient></defs>`;let x='';if(type==='cape'||type==='hoodie')x=`<path d="M30 32 Q60 15 90 32 L105 100 Q60 113 15 100Z" fill="url(#ci)" stroke="#ddd" stroke-width="3"/><path d="M40 34 Q60 48 80 34" fill="none" stroke="#fff" stroke-width="3"/>`;if(type==='crown')x=`<path d="M20 85 L27 37 52 64 60 30 72 64 94 37 101 85Z" fill="#ffd75b" stroke="#fff" stroke-width="3"/>`;if(type==='scarf')x=`<path d="M17 40 Q60 58 103 40 L98 65 Q60 80 22 65Z" fill="#35aee9"/><path d="M65 65L85 105 102 96 82 58Z" fill="#8b7bff"/>`;if(type==='glasses')x=`<g fill="#35d0ff" fill-opacity=".3" stroke="#fff" stroke-width="4"><rect x="13" y="45" width="40" height="28" rx="10"/><rect x="67" y="45" width="40" height="28" rx="10"/><path d="M53 55h14"/></g>`;if(type==='bow')x=`<path d="M60 60Q30 25 17 45Q25 75 60 67Z" fill="#ff5cba"/><path d="M60 60Q90 25 103 45Q95 75 60 67Z" fill="#8b7bff"/><circle cx="60" cy="60" r="10" fill="#ffd75b"/>`;if(type==='backpack')x=`<rect x="27" y="25" width="66" height="78" rx="18" fill="#2c9e9a" stroke="#70fff5" stroke-width="4"/><path d="M40 27Q60 5 80 27" fill="none" stroke="#70fff5" stroke-width="6"/><circle cx="60" cy="62" r="12" fill="#8b7bff"/>`;return base+x+'</svg>'}
function nvPetName(){return (NOVA_PETS.find(p=>p.id===nvPetState.pet)||NOVA_PETS[0]).name}

function openNovaPetWorld(){const old=document.querySelector('.nova-pet-overlay');if(old)old.remove();const o=document.createElement('div');o.className='nova-dog-overlay nova-pet-overlay';o.innerHTML=`<div class="nova-dog-panel" style="max-width:720px"><div class="nova-dog-head"><div><b>Nova Pets</b><div class="mu">Elige a tu compañero y cuídalo cada día</div></div><button class="btn o" id="nvPetClose">Cerrar</button></div><div style="padding:12px;overflow:auto;max-height:calc(100vh - 90px)" id="nvPetWorldBody">${nvPetWorldCard()}</div></div>`;document.body.appendChild(o);const refresh=()=>{const b=$('#nvPetWorldBody');if(b)b.innerHTML=nvPetWorldCard();bind()};function bind(){o.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{nvPetState.pet=b.dataset.pet;nvSavePet();refresh();nvPetToast('Mascota seleccionada: '+nvPetName())});const pet=$('#nvPetNow');if(pet)pet.onclick=()=>{nvResetPetDay();if(nvPetState.strokes>=10){nvPetToast('Ya has usado tus 10 caricias de hoy 🤍');return}nvPetState.strokes++;nvPetState.coins+=2;nvSavePet();refresh();const prev=$('#nvWorldPreview');if(prev){prev.animate([{transform:'scale(1)'},{transform:'scale(1.05) rotate(-2deg)'},{transform:'scale(1)'}],{duration:500});}nvPetToast('+2 monedas galácticas ✨')};const cb=$('#nvOpenClothes2');if(cb)cb.onclick=openNovaClothes}bind();o.querySelector('#nvPetClose').onclick=()=>o.remove()}
function openNovaClothes(){const old=document.querySelector('.nova-clothes-overlay');if(old)old.remove();const o=document.createElement('div');o.className='nova-dog-overlay nova-clothes-overlay';o.innerHTML=`<div class="nova-dog-panel" style="max-width:760px"><div class="nova-dog-head"><div><b>Armario Nova</b><div class="mu">Ropa, accesorios y tu probador</div></div><button class="btn o" id="nvClClose">Cerrar</button></div><div class="nvcloset"><div class="nvcloset-head"><div class="nvcloset-coins">${nvCoinSVG()} <span id="nvClosetCoins">${nvPetState.coins}</span></div><button class="btn o" id="nvFittingOpen">Probador</button></div><div class="nvclothes" id="nvClothesGrid"></div></div></div>`;document.body.appendChild(o);function render(){const g=$('#nvClothesGrid');if(!g)return;g.innerHTML=NOVA_CLOTHES.map(c=>{const owned=nvPetState.owned.includes(c.id),worn=nvPetState.worn.includes(c.id);return `<div class="nvcloth"><div class="nvcloth-preview">${nvClothingIcon(c.svg)}</div><div class="nvcloth-title">${esc(c.name)} ${c.exclusive?'<span style="color:#ffd75b">★</span>':''}</div><div class="nvcloth-sub">${esc(c.desc)}</div><div class="nvcloth-price">${nvCoinSVG()} ${c.price} ${c.exclusive?'· EXCLUSIVA':''}</div><div class="nvcloth-buttons"><button class="nvcloth-btn buy" data-buy="${c.id}" ${owned?'disabled':''}>${owned?'Comprada':'Comprar'}</button><button class="nvcloth-btn" data-try="${c.id}">Probar</button></div><button class="nvcloth-btn" style="width:100%;margin-top:6px" data-wear="${c.id}">${worn?'Quitar':'Poner'}</button></div>`}).join('');g.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const c=NOVA_CLOTHES.find(x=>x.id===b.dataset.buy);if(!c)return;if(nvPetState.coins<c.price){nvPetToast('No tienes suficientes monedas');return}nvPetState.coins-=c.price;nvPetState.owned.push(c.id);nvSavePet();render();novaRefreshPetSettings();nvPetToast('¡Compraste '+c.name+'!')});g.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{const id=b.dataset.wear;i function openNovaFitting(clothId){const c=NOVA_CLOTHES.find(x=>x.id===clothId)||NOVA_CLOTHES[0];const old=document.querySelector('.nvfitting');if(old)old.remove();const f=document.createElement('div');f.className='nvfitting';f.innerHTML=`<div class="nvfitting-head"><div><div class="nvfitting-title">Probador Nova</div><div class="mu" style="font-size:11px">${esc(c.name)}</div></div><button class="btn o" id="nvFitExit">Volver</button></div><div class="nvfitting-stage"><div class="nvfit-note" id="nvFitNote">Tu mascota está entrando…</div><div class="nvfitting-room"><div class="nvcurtain left"><div class="nvcurtain-fold"></div></div><div class="nvcurtain right"><div class="nvcurtain-fold"></div></div><div class="nvfitting-pet enter" id="nvFitPet">${nvAnimalSVG(nvPetState.pet,[...nvPetState.worn,clothId])}</div></div></div><div class="nvfit-controls"><button class="btn o" id="nvFitBack">Volver</button><div class="nvfit-count"><b id="nvFitText">Preparando el probador…</b><div class="nvfit-bar"><i id="nvFitBar"></i></div></div></div>`;document.body.appendChild(f);const pet=$('#nvFitPet'),left=f.querySelector('.nvcurtain.left'),right=f.querySelector('.nvcurtain.right'),note=$('#nvFitNote'),bar=$('#nvFitBar'),txt=$('#nvFitText');setTimeout(()=>{pet.classList.remove('enter');pet.classList.add('walk');note.textContent='¡Ha llegado al probador!';setTimeout(()=>{left.classList.remove('open');right.classList.remove('open');note.textContent='Cerrando la cortina…';setTimeout(()=>{let t=5;txt.textContent='Cambiándose… '+t+'s';const iv=setInterval(()=>{t--;bar.style.transform=`scaleX(${(5-t)/5})`;txt.textContent=t?`Cambiándose… ${t}s`:'¡Listo!';if(t<=0){clearInterval(iv);setTimeout(()=>{left.classList.add('open');right.classList.add('open');note.textContent='¡Tu mascota sale con el conjunto!';},350)}},1000)},650)},1050)},350);const close=()=>f.remove();f.querySelector('#nvFitExit').onclick=close;f.querySelector('#nvFitBack').onclick=close}

<script>
(function(){
  'use strict';

  /* ---------- NUEVAS 12 MASCOTAS ---------- */
  NOVA_PETS.splice(0,NOVA_PETS.length,
    {id:'golden',name:'Golden Retriever',kind:'dog',c1:'#e9ad4c',c2:'#8d4e20',c3:'#fff0bf'},
    {id:'husky',name:'Husky Ártico',kind:'husky',c1:'#dcecff',c2:'#52657b',c3:'#fff'},
    {id:'cat',name:'Gato Nebulosa',kind:'cat',c1:'#9f8cff',c2:'#40366e',c3:'#e9ddff'},
    {id:'fox',name:'Zorro Aurora',kind:'fox',c1:'#ef763b',c2:'#812c25',c3:'#fff0dc'},
    {id:'bunny',name:'Conejo Nube',kind:'rabbit',c1:'#e7c9e4',c2:'#ad789f',c3:'#fff4fb'},
    {id:'panda',name:'Panda Lunar',kind:'panda',c1:'#f7f7fa',c2:'#22232b',c3:'#fff'},
    {id:'redpanda',name:'Panda Rojo',kind:'redpanda',c1:'#d26745',c2:'#6d2c25',c3:'#ffd4b0'},
    {id:'koala',name:'Koala',kind:'koala',c1:'#b4bbc5',c2:'#5b6470',c3:'#e4e8ed'},
    {id:'axolotl',name:'Ajolote Rosa',kind:'axolotl',c1:'#ff92bb',c2:'#c43e75',c3:'#ffd8e8'},
    {id:'penguin',name:'Pingüino Polar',kind:'penguin',c1:'#566a83',c2:'#1d2534',c3:'#f8fbff'},
    {id:'tiger',name:'Tigre Solar',kind:'tiger',c1:'#f3a83b',c2:'#6e321d',c3:'#ffe9b1'},
    {id:'dragon',name:'Dragón Estelar',kind:'dragon',c1:'#55d7c5',c2:'#5140a8',c3:'#eaffff'}
  );

  /* SVG con siluetas distintas, sombreado, ojos, detalles y pequeñas animaciones */
  function novaPetSvgV4(id,clothes){
    const p=NOVA_PETS.find(x=>x.id===id)||NOVA_PETS[0], c=Array.isArray(clothes)?clothes:[];
    const gid='g'+String(id).replace(/[^a-z0-9]/gi,'')+Math.random().toString(36).slice(2,7);
    const defs=`<defs>
      <linearGradient id="${gid}body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${p.c1}"/><stop offset="1" stop-color="${p.c2}"/></linearGradient>
      <radialGradient id="${gid}belly"><stop stop-color="${p.c3}"/><stop offset="1" stop-color="${p.c1}"/></radialGradient>
      <linearGradient id="${gid}shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <filter id="${gid}shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".35"/></filter>
    </defs>`;
    const eyes=`<g class="pet-eyes"><ellipse cx="137" cy="116" rx="9" ry="12" fill="#12131c"/><ellipse cx="163" cy="116" rx="9" ry="12" fill="#12131c"/><circle cx="134" cy="112" r="3.2" fill="#fff"/><circle cx="160" cy="112" r="3.2" fill="#fff"/></g>`;
    const smile=`<path d="M141 139 Q150 146 159 139" fill="none" stroke="#3a2029" stroke-width="3.2" stroke-linecap="round"/>`;
    let ears='',head='',body='',tail='',extras='';
    if(p.kind==='husky'){
      ears=`<path d="M103 91 L103 39 Q105 28 114 36 L143 73Z" fill="url(#${gid}body)" stroke="#38475c" stroke-width="3"/><path d="M197 91 L197 39 Q195 28 186 36 L157 73Z" fill="url(#${gid}body)" stroke="#38475c" stroke-width="3"/>`;
      head=`<path d="M93 108 Q97 58 150 55 Q203 58 207 108 Q203 169 150 181 Q97 169 93 108Z" fill="url(#${gid}body)" stroke="#344356" stroke-width="3"/><path d="M111 82 Q150 65 189 82 L181 137 Q150 157 119 137Z" fill="#f8fbff" opacity=".95"/><path d="M150 70V149" stroke="#a8c1d8" stroke-width="5"/>`;
      body=`<path d="M105 177 Q93 198 104 259 Q150 277 196 259 Q207 198 195 177 Q176 163 150 163 Q124 163 105 177Z" fill="url(#${gid}body)" stroke="#344356" stroke-width="3"/><ellipse cx="150" cy="218" rx="32" ry="39" fill="#fff" opacity=".82"/>`;
    } else if(p.kind==='cat'){
      ears=`<path d="M105 91 L100 35 Q100 25 110 34 L143 67Z" fill="url(#${gid}body)" stroke="#39304f" stroke-width="3"/><path d="M195 91 L200 35 Q200 25 190 34 L157 67Z" fill="url(#${gid}body)" stroke="#39304f" stroke-width="3"/><path d="M108 55L120 73 132 66Z" fill="#ffb7db"/><path d="M192 55L180 73 168 66Z" fill="#ffb7db"/>`;
      head=`<path d="M98 101 Q101 58 150 55 Q199 58 202 101 L194 153 Q180 181 150 183 Q120 181 106 153Z" fill="url(#${gid}body)" stroke="#39304f" stroke-width="3"/>`;
      body=`<path d="M108 179 Q96 202 105 259 Q150 273 195 259 Q204 202 192 179 Q174 164 150 164 Q126 164 108 179Z" fill="${p.c2}" stroke="#39304f" stroke-width="3"/><path d="M190 213 Q232 185 215 147" fill="none" stroke="${p.c1}" stroke-width="18" stroke-linecap="round"/>`;
      extras=`<path d="M109 128L76 121M108 139L73 143M191 128L224 121M192 139L227 143" stroke="#e7ddff" stroke-width="2" stroke-linecap="round"/>`;
    } else if(p.kind==='fox'){
      ears=`<path d="M106 91L104 31L144 72Z" fill="url(#${gid}body)" stroke="#63291f" stroke-width="3"/><path d="M194 91L196 31L156 72Z" fill="url(#${gid}body)" stroke="#63291f" stroke-width="3"/><path d="M111 55L114 78 132 68Z" fill="#ffcfbb"/><path d="M189 55L186 78 168 68Z" fill="#ffcfbb"/>`;
      head=`<path d="M97 105 Q102 61 150 57 Q198 61 203 105 L190 157 Q173 183 150 184 Q127 183 110 157Z" fill="url(#${gid}body)" stroke="#63291f" stroke-width="3"/><path d="M113 122 Q150 151 187 122 Q177 169 150 173 Q123 169 113 122Z" fill="${p.c3}"/>`;
      body=`<path d="M110 178 Q98 205 108 258 Q150 272 192 258 Q202 205 190 178 Q173 164 150 164 Q127 164 110 178Z" fill="${p.c2}"/><path d="M188 214 Q231 192 217 155" fill="none" stroke="${p.c1}" stroke-width="21" stroke-linecap="round"/>`;
    } else if(p.kind==='rabbit'){
      ears=`<ellipse cx="125" cy="48" rx="18" ry="53" fill="url(#${gid}body)" stroke="#986f91" stroke-width="3" transform="rotate(-9 125 48)"/><ellipse cx="175" cy="48" rx="18" ry="53" fill="url(#${gid}body)" stroke="#986f91" stroke-width="3" transform="rotate(9 175 48)"/><ellipse cx="125" cy="48" rx="7" ry="38" fill="#eea9c9"/><ellipse cx="175" cy="48" rx="7" ry="38" fill="#eea9c9"/>`;
      head=`<ellipse cx="150" cy="112" rx="57" ry="63" fill="url(#${gid}body)" stroke="#986f91" stroke-width="3"/>`;
      body=`<ellipse cx="150" cy="214" rx="53" ry="56" fill="${p.c2}"/><ellipse cx="113" cy="263" rx="21" ry="13" fill="${p.c1}"/><ellipse cx="187" cy="263" rx="21" ry="13" fill="${p.c1}"/><circle cx="150" cy="172" r="15" fill="#fff" opacity=".22"/>`;
    } else if(p.kind==='panda'||p.kind==='redpanda'||p.kind==='koala'){
      ears=`<circle cx="109" cy="70" r="27" fill="${p.c2}"/><circle cx="191" cy="70" r="27" fill="${p.c2}"/>`;
      head=`<ellipse cx="150" cy="113" rx="59" ry="61" fill="${p.c1}" stroke="#30323b" stroke-width="3"/>`;
      body=`<ellipse cx="150" cy="215" rx="55" ry="57" fill="${p.c2}"/><ellipse cx="150" cy="215" rx="31" ry="39" fill="${p.c3}" opacity=".75"/>`;
      if(p.kind==='panda')extras=`<ellipse cx="128" cy="112" rx="14" ry="18" fill="#222" transform="rotate(-25 128 112)"/><ellipse cx="172" cy="112" rx="14" ry="18" fill="#222" transform="rotate(25 172 112)"/>`;
      if(p.kind==='redpanda')extras=`<path d="M99 89Q150 69 201 89" fill="none" stroke="#fff0d8" stroke-width="8" opacity=".8"/><path d="M195 216Q235 195 218 157" fill="none" stroke="#f2b36f" stroke-width="15" stroke-linecap="round"/>`;
      if(p.kind==='koala')extras=`<ellipse cx="150" cy="132" rx="17" ry="13" fill="#252a33"/><path d="M124 96L109 109M176 96L191 109" stroke="#eef1f5" stroke-width="4" stroke-linecap="round"/>`;
    } else if(p.kind==='axolotl'){
      ears=`<path d="M105 92 Q72 77 60 46 Q89 48 113 72Z" fill="${p.c2}" stroke="#a63868" stroke-width="3"/><path d="M195 92 Q228 77 240 46 Q211 48 187 72Z" fill="${p.c2}" stroke="#a63868" stroke-width="3"/><path d="M103 105 Q70 103 47 81 Q79 74 111 88Z" fill="#ffb1ca"/><path d="M197 105 Q230 103 253 81 Q221 74 189 88Z" fill="#ffb1ca"/>`;
      head=`<ellipse cx="150" cy="116" rx="60" ry="62" fill="url(#${gid}body)" stroke="#a63868" stroke-width="3"/>`;
      body=`<ellipse cx="150" cy="216" rx="53" ry="54" fill="${p.c2}"/><path d="M110 215Q150 240 190 215" fill="none" stroke="#ff9fc2" stroke-width="8" opacity=".55"/>`;
    } else if(p.kind==='penguin'){
      ears=`<circle cx="109" cy="77" r="20" fill="${p.c2}"/><circle cx="191" cy="77" r="20" fill="${p.c2}"/>`;
      head=`<ellipse cx="150" cy="112" rx="55" ry="62" fill="${p.c2}" stroke="#18202d" stroke-width="3"/><ellipse cx="150" cy="125" rx="37" ry="43" fill="${p.c3}"/>`;
      body=`<ellipse cx="150" cy="213" rx="55" ry="62" fill="${p.c2}" stroke="#18202d" stroke-width="3"/><ellipse cx="150" cy="213" rx="35" ry="46" fill="${p.c3}"/><path d="M99 190Q62 208 82 228" fill="none" stroke="#536a84" stroke-width="17" stroke-linecap="round"/><path d="M201 190Q238 208 218 228" fill="none" stroke="#536a84" stroke-width="17" stroke-linecap="round"/>`;
      extras=`<path d="M142 131L150 137 158 131 150 145Z" fill="#ffb94d"/><ellipse cx="124" cy="270" rx="24" ry="10" fill="#f3b64e"/><ellipse cx="176" cy="270" rx="24" ry="10" fill="#f3b64e"/>`;
    } else if(p.kind==='tiger'){
      ears=`<circle cx="108" cy="72" r="23" fill="url(#${gid}body)" stroke="#6b301c" stroke-width="3"/><circle cx="192" cy="72" r="23" fill="url(#${gid}body)" stroke="#6b301c" stroke-width="3"/>`;
      head=`<ellipse cx="150" cy="112" rx="59" ry="61" fill="url(#${gid}body)" stroke="#6b301c" stroke-width="3"/>`;
      body=`<path d="M108 178Q95 201 106 259Q150 275 194 259Q205 201 192 178Q174 164 150 164Q126 164 108 178Z" fill="url(#${gid}body)" stroke="#6b301c" stroke-width="3"/><ellipse cx="150" cy="215" rx="31" ry="40" fill="#ffe9b1" opacity=".9"/>`;
      extras=`<path d="M119 76L128 105M181 76L172 105M103 103L128 119M197 103L172 119M108 141L130 136M192 141L170 136" stroke="#632719" stroke-width="7" stroke-linecap="round"/>`;
    } else if(p.kind==='dragon'){
      ears=`<path d="M111 84L91 48 126 67Z" fill="${p.c2}" stroke="#3c3180" stroke-width="3"/><path d="M189 84L209 48 174 67Z" fill="${p.c2}" stroke="#3c3180" stroke-width="3"/>`;
      head=`<path d="M96 104Q101 59 150 56Q199 59 204 104L193 154Q176 181 150 182Q124 181 107 154Z" fill="url(#${gid}body)" stroke="#3c3180" stroke-width="3"/>`;
      body=`<path d="M108 178Q95 203 107 259Q150 276 193 259Q205 203 192 178Q174 164 150 164Q126 164 108 178Z" fill="${p.c2}" stroke="#3c3180" stroke-width="3"/><path d="M193 220Q232 196 220 164" fill="none" stroke="${p.c1}" stroke-width="18" stroke-linecap="round"/>`;
      extras=`<path d="M116 78L107 58M184 78L193 58" stroke="#d6ffff" stroke-width="5" stroke-linecap="round"/><circle cx="116" cy="92" r="3" fill="#fff"/><circle cx="184" cy="92" r="3" fill="#fff"/>`;
    } else {
      ears=`<path d="M106 95Q91 62 104 45Q119 42 135 77Z" fill="url(#${gid}body)" stroke="#70451f" stroke-width="3"/><path d="M194 95Q209 62 196 45Q181 42 165 77Z" fill="url(#${gid}body)" stroke="#70451f" stroke-width="3"/>`;
      head=`<path d="M97 105Q100 63 150 58Q200 63 203 105L193 155Q176 182 150 183Q124 182 107 155Z" fill="url(#${gid}body)" stroke="#70451f" stroke-width="3"/>`;
      body=`<path d="M108 178Q98 201 108 258Q150 275 192 258Q202 201 192 178Q174 164 150 164Q126 164 108 178Z" fill="${p.c2}" stroke="#70451f" stroke-width="3"/><ellipse cx="150" cy="215" rx="30" ry="38" fill="${p.c3}" opacity=".9"/><path d="M190 216Q229 195 217 158" fill="none" stroke="${p.c1}" stroke-width="20" stroke-linecap="round"/>`;
    }
    const outfit=nvClothesOverlay(clothes);
    return `<svg class="nvpet-svg nvpet-v4" viewBox="0 0 300 300" role="img" aria-label="${esc(p.name)}" style="--petA:${p.c1};--petB:${p.c2}" xmlns="http://www.w3.org/2000/svg"><style>.nvpet-v4{animation:nvPetFloat 3.2s ease-in-out infinite;overflow:visible}.nvpet-v4 .pet-eyes{transform-origin:150px 116px;animation:nvPetBlink 5s infinite}.nvpet-v4:hover{filter:drop-shadow(0 0 13px rgba(139,123,255,.7))}@keyframes nvPetFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes nvPetBlink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}} </style>${defs}<ellipse cx="150" cy="274" rx="73" ry="11" fill="#000" opacity=".22"/> <g filter="url(#${gid}shadow)">${body}${ears}${head}${extras}${eyes}${smile}${outfit}</g><path d="M115 82Q150 55 185 82" fill="none" stroke="url(#${gid}shine)" stroke-width="7" stroke-linecap="round" opacity=".35"/></svg>`;
  }
  window.nvAnimalSVG=novaPetSvgV4;

  /* ---------- CUIDADO: caca, comida, baño, sueño, juego ---------- */
  const careKey='novaPetCareV4';
  let care=(()=>{try{return Object.assign({hunger:78,clean:92,energy:86,fun:80,poop:false,lastFeed:0,lastBath:0},JSON.parse(localStorage.getItem(careKey)||'{}'))}catch(e){return {hunger:78,clean:92,energy:86,fun:80,poop:false,lastFeed:0,lastBath:0}}})();
  const saveCare=()=>localStorage.setItem(careKey,JSON.stringify(care));
  function careToast(t){let x=document.querySelector('.nsv2-toast');if(!x){x=document.createElement('div');x.className='nsv2-toast';document.body.appendChild(x)}x.textContent=t;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),1900)}
  function poopSvg(){return `<svg class="poop-svg" viewBox="0 0 80 80"><defs><radialGradient id="poopG"><stop stop-color="#b87945"/><stop offset="1" stop-color="#5b301e"/></radialGradient></defs><path d="M21 61Q15 48 27 42Q18 29 31 23Q36 10 50 19Q63 18 64 31Q76 39 64 49Q67 64 52 67H30Q23 66 21 61Z" fill="url(#poopG)" stroke="#e0a16b" stroke-width="2"/><circle cx="39" cy="31" r="2.5" fill="#fff4d6" opacity=".7"/><path d="M31 57Q42 62 53 56" fill="none" stroke="#4b2819" stroke-width="3" stroke-linecap="round"/></svg>`}
  function petCarePanel(type,close){
    const p=NOVA_PETS.find(x=>x.id===nvPetState.pet)||NOVA_PETS[0];
    let title='Mascota',body='';
    if(type==='poop'){title='Caca';body=`<div class="nsv2-card"><h3 style="margin:0 0 4px">${care.poop?'Hay una caca que recoger 💩':'Todo limpio ✨'}</h3><p class="nsv2-sub">${care.poop?'Tu mascota necesita que limpies el suelo.':'Tu mascota está limpia y feliz.'}</p><div class="nsv2-poop ${care.poop?'':'clean'}"><div class="pet-mini">${nvAnimalSVG(p.id,nvPetState.worn)}</div>${poopSvg()}</div><button class="nsv2-btn primary" style="width:100%;margin-top:10px" id="carePoop">${care.poop?'🧹 Recoger caca':'💩 Hacer caca'}</button></div>`}
    if(type==='food'){title='Comida';body=`<div class="nsv2-card"><h3 style="margin:0">Dar de comer a ${esc(p.name)}</h3><p class="nsv2-sub">La comida sube el hambre y hace una pequeña animación.</p><div class="nsv2-statrow"><span class="nsv2-pill">🍗 Hambre ${care.hunger}%</span><span class="nsv2-pill">⚡ Energía ${care.energy}%</span></div><div class="nsv2-actions" style="margin-top:10px"><button class="nsv2-action" data-food="snack"><span class="ico">🍪</span><span>Snack<small>+12 hambre</small></span></button><button class="nsv2-action" data-food="meal"><span class="ico">🍗</span><span>Comida<small>+25 hambre</small></span></button><button class="nsv2-action" data-food="star"><span class="ico">✨</span><span>Comida estelar<small>+40 hambre</small></span></button><button class="nsv2-action" data-food="water"><span class="ico">💧</span><span>Agua<small>+18 energía</small></span></button></div></div>`}
    if(type==='bath'){title='Baño';body=`<div class="nsv2-card"><h3 style="margin:0">Baño de burbujas</h3><p class="nsv2-sub">Tu mascota entra en la bañera, aparecen burbujas, se limpia y después se seca.</p><div class="pet-bath-stage" id="careBathStage"><div class="bath-water"></div><div class="bath-bubbles"><i></i><i></i><i></i><i></i><i></i></div><div class="bath-pet" id="careBathPet">${nvAnimalSVG(p.id,nvPetState.worn)}</div><div class="bath-towel" id="bathTowel">TOALLA</div></div><div class="nsv2-statrow"><span class="nsv2-pill">Limpieza ${care.clean}%</span><span class="nsv2-pill" id="bathStatus">Listo para bañar</span></div><button class="nsv2-btn primary" style="width:100%;margin-top:10px" id="careBath">Bañar a ${esc(p.name)}</button></div>`}

  /* ---------- DUETO V4: vídeo + foto, composición real en canvas ---------- */
  const oldOpenDuet=window.openDuet;
  window.openDuet=async function(videoId){
    const v=vid(videoId);if(!v)return;
    document.body.classList.add('nl');
    $('#m').innerHTML=`<div class="duet-sheet"><div class="feature-box" style="max-width:700px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div><h2 style="margin:0">Dueto</h2><div class="mu">Tu cámara a la derecha · contenido original a la izquierda</div></div><button class="cb" id="duetV4Close">${ic('x',22)}</button></div><div class="duet-stage"><video id="duetV4Original" autoplay muted loop playsinline crossorigin="anonymous" style="display:none"></video><img id="duetV4Image" alt="Contenido del dueto" style="display:none;width:100%;height:100%;object-fit:cover;background:#000"><video id="duetV4Me" autoplay muted playsinline></video><span class="duet-label">DUETO</span></div><div class="chips" style="margin-top:12px"><button class="btn o" id="duetV4Flip">Girar cámara</button><button class="btn" id="duetV4Rec">Grabar dueto</button></div><p id="duetV4Status" class="mu" style="margin-top:8px;font-size:12px">Preparando el contenido original…</p></div></div>`;
    const close=()=>{try{stream?.getTracks().forEach(t=>t.stop())}catch(e){};if(raf)cancelAnimationFrame(raf);if(objectUrl)URL.revokeObjectURL(objectUrl);go('#/')};$('#duetV4Close').onclick=close;
    const original=$('#duetV4Original'),img=$('#duetV4Image'),me=$('#duetV4Me'),btn=$('#duetV4Rec'),status=$('#duetV4Status');let stream=null,rec=null,chunks=[],canvas=null,ctx=null,raf=0,objectUrl='',flip=false,sourceType='video',sourceReady=false;
    async function loadSource(){
      try{
        const response=await fetch(v.src,{mode:'cors',credentials:'omit'});if(!response.ok)throw new Error('No se pudo descargar el contenido original.');
        const b=await response.blob();objectUrl=URL.createObjectURL(b);
        if(b.type.startsWith('image/')){sourceType='image';img.src=objectUrl;await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});img.style.display='block';sourceReady=true;status.textContent='Foto lista. Pulsa Grabar para crear un dueto en vídeo.'}
        else{sourceType='video';original.src=objectUrl;await new Promise((res,rej)=>{original.onloadedmetadata=res;original.onerror=rej});await original.play().catch(()=>{});original.style.display='block';sourceReady=true;status.textContent='Vídeo listo. Pulsa Grabar para comenzar.'}
      }catch(e){sourceReady=false;status.textContent='No se puede componer este contenido desde el navegador. Comprueba que el bucket de vídeos permita CORS.';btn.disabled=true;console.error('Dueto V4',e)}
    }
    await loadSource();
    function draw(){if(!canvas||!ctx)return;ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);const half=canvas.width/2;const drawCover=(el,x,w)=>{const vw=el.videoWidth||el.naturalWidth||360,vh=el.videoHeight||el.naturalHeight||640,sc=Math.max(w/vw,canvas.height/vh),dw=vw*sc,dh=vh*sc;ctx.save();if(el===me&&flip){ctx.translate(x+w,0);ctx.scale(-1,1);ctx.drawImage(el,(w-dw)/2,(canvas.height-dh)/2,dw,dh)}else ctx.drawImage(el,x+(w-dw)/2,(canvas.height-dh)/2,dw,dh);ctx.restore()};const src=sourceType==='image'?img:original;drawCover(src,0,half);drawCover(me,half,half);ctx.fillStyle='#fff';ctx.fillRect(half-1,0,2,canvas.height);raf=requestAnimationFrame(draw)}

        rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
        rec.onerror=e=>{recordingBusy=false;btn.disabled=false;btn.textContent='Grabar dueto';status.textContent='Error al grabar el dueto.';console.error(e)};
        rec.onstop=()=>{
          const type=rec.mimeType||'video/webm', b=new Blob(chunks,{type});

    btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();stopRecording()});

<script id="nova-v6-actions-fix">
(function(){
  if(window.__novaV6ActionsFix)return; window.__novaV6ActionsFix=true;
  const q=s=>document.querySelector(s);
  const qsa=s=>Array.from(document.querySelectorAll(s));
  const fireToast=t=>{try{if(typeof careToast==='function')careToast(t);else if(typeof toast==='function')toast(t)}catch(e){}}
  function settingsOpen(){return !!document.querySelector('.nova-settings-v2')}
  function doCare(type){
    if(typeof petCarePanel==='function'){
      petCarePanel(type);
      return true;
    }
    return false;
  }
  document.addEventListener('click',function(e){
    const t=e.target.closest && e.target.closest('button,a');
    if(!t||!settingsOpen())return;
    const careType=t.getAttribute('data-care');
    if(careType){
      e.preventDefault(); e.stopImmediatePropagation();
      if(careType==='petpick'){
        const tabs=qsa('.nsv2-tab'); const b=tabs.find(x=>x.dataset.tab==='petpick');
        if(b)b.click(); else if(typeof window.__novaRenderPetPick==='function')window.__novaRenderPetPick();
      }else if(careType==='clothes'){
        const b=q('.nsv2-tab[data-tab="clothes"]'); if(b)b.click();
      }else doCare(careType);
      return;
    }
    const play=t.getAttribute('data-play');
    if(play){
      e.preventDefault(); e.stopImmediatePropagation();
      try{care.fun=Math.min(100,care.fun+18);care.energy=Math.max(0,care.energy-5);saveCare();fireToast(play==='ball'?'Pelota Nova: ¡a jugar!':play==='dance'?'¡Baile activado!':play==='toy'?'¡Juguete activado!':'¡Estrellas activadas!');
        const art=t.closest('.nova-care-panel,.nova-settings-v2')?.querySelector('.nsv2-pet-art');
        if(art)art.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-12px) rotate(-3deg) scale(1.06)'},{transform:'translateY(0) scale(1)'}],{duration:700,easing:'cubic-bezier(.2,1.5,.3,1)'});
      }catch(err){}
      return;
    }
    const food=t.getAttribute('data-food');
    if(food){
      e.preventDefault(); e.stopImmediatePropagation();
      try{care.hunger=Math.min(100,care.hunger+(food==='star'?40:food==='meal'?25:food==='water'?5:12));if(food==='water')care.energy=Math.min(100,care.energy+18);care.poop=true;care.lastFeed=Date.now();saveCare();fireToast(food==='water'?'¡Agua servida!':'¡Comida servida!')}catch(err){}
      return;
    }
    if(t.id==='carePoop'){
      e.preventDefault();e.stopImmediatePropagation();care.poop=!care.poop;saveCare();fireToast(care.poop?'Tu mascota ha hecho caca':'¡Caca recogida!');petCarePanel('poop');return;
    }
    if(t.id==='careBath'){
      e.preventDefault();e.stopImmediatePropagation();care.clean=100;care.fun=Math.min(100,care.fun+4);care.lastBath=Date.now();saveCare();fireToast('¡Baño terminado!');setTimeout(()=>petCarePanel('bath'),350);return;
    }
    if(t.id==='careSleep'){
      e.preventDefault();e.stopImmediatePropagation();care.energy=100;saveCare();fireToast('Tu mascota ha descansado');return;
    }
    if(t.id==='strokeV4'||t.id==='nsv2Pet'){
      e.preventDefault();e.stopImmediatePropagation();
      if(typeof nvResetPetDay==='function')nvResetPetDay();
      if(nvPetState.strokes>=10){fireToast('Ya has usado las 10 caricias de hoy');return;}
      nvPetState.strokes++;nvPetState.coins+=2;nvSavePet();fireToast('+2 monedas galácticas');
      const b=t.closest('.nova-settings-v2')?.querySelector('.nsv2-pet-art');if(b)b.animate([{transform:'scale(1)'},{transform:'scale(1.08) rotate(-3deg)'},{transform:'scale(1)'}],{duration:550});
      return;
    }
  },true);

  // Reasigna los botones de pestañas cada vez que se abre la configuración.
  const obs=new MutationObserver(function(){
    const root=document.querySelector('.nova-settings-v2'); if(!root)return;
    qsa('.nsv2-tab').forEach(b=>{if(b.dataset.novaV6Bound)return;b.dataset.novaV6Bound='1';b.style.pointerEvents='auto';});
    qsa('.nsv2-action,.nsv2-btn,.nsv2-tab').forEach(b=>{b.style.touchAction='manipulation';b.style.webkitTapHighlightColor='transparent'});
  });
  obs.observe(document.body,{childList:true,subtree:true});
})();
</script>

<script id="nova-care-final-fix">
(function(){
  if(window.__novaCareFinalFix)return; window.__novaCareFinalFix=true;
  const $=(s,r=document)=>r.querySelector(s);
  const toastSafe=(m)=>{try{if(typeof careToast==='function')careToast(m);else if(typeof toast==='function')toast(m)}catch(e){}};
  function saveSafe(){try{if(typeof saveCare==='function')saveCare()}catch(e){try{localStorage.setItem('novaPetCareV4',JSON.stringify(care))}catch(_){}}}
  function animate(selector,kind){
    const el=$(selector,document.querySelector('.nova-care-panel')||document);
    if(!el)return;
    let frames=[{transform:'translateY(0) scale(1)'},{transform:'translateY(-14px) scale(1.05)'},{transform:'translateY(0) scale(1)'}];
    if(kind==='dance')frames=[{transform:'rotate(0) scale(1)'},{transform:'rotate(-8deg) translateY(-10px)'},{transform:'rotate(8deg) translateY(-6px)'},{transform:'rotate(0)'}];
    el.animate(frames,{duration:900,easing:'cubic-bezier(.2,1.4,.3,1)'});
  }
  function openCare(type){
    try{ if(typeof petCarePanel==='function'){petCarePanel(type);return true;} }catch(e){console.error(e)}
    return false;
  }
  document.addEventListener('click',function(e){
    const b=e.target.closest?.('[data-care],[data-play],[data-food],#carePoop,#careBath,#careSleep');
    if(!b)return;
    if(b.closest('.nsv2-rail'))return;
    if(b.hasAttribute('data-care')){
      e.preventDefault(); e.stopImmediatePropagation();
      const type=b.getAttribute('data-care');
      if(type==='petpick'){document.querySelector('.nsv2-tab[data-tab="petpick"]')?.click();return;}
      if(type==='clothes'){document.querySelector('.nsv2-tab[data-tab="clothes"]')?.click();return;}
      openCare(type); return;
    }
    if(b.hasAttribute('data-play')){
      e.preventDefault(); e.stopImmediatePropagation();
      const type=b.getAttribute('data-play');
      try{care.fun=Math.min(100,Number(care.fun||0)+18);care.energy=Math.max(0,Number(care.energy||0)-5);saveSafe();}catch(_){ }
      const panel=b.closest('.nova-care-panel');
      const status=$('#playStatus',panel||document);
      if(status)status.textContent=type==='ball'?'¡Corre detrás de la pelota!':type==='dance'?'¡Está bailando!':type==='toy'?'¡Juega con su juguete!':'¡Persigue las estrellas!';
      animate('#carePlayPet',type==='dance'?'dance':'jump');
      const ball=$('#playBall',panel||document); if(ball&&type==='ball'){ball.classList.remove('run');void ball.offsetWidth;ball.classList.add('run');setTimeout(()=>ball.classList.remove('run'),1500)}
      toastSafe(type==='ball'?'¡Pelota!':type==='dance'?'¡Baile!':type==='toy'?'¡Juguete!':'¡Estrellas!'); return;
    }
    if(b.hasAttribute('data-food')){
      e.preventDefault(); e.stopImmediatePropagation();
      const type=b.getAttribute('data-food');
      try{care.hunger=Math.min(100,Number(care.hunger||0)+(type==='star'?40:type==='meal'?25:type==='water'?5:12));if(type==='water')care.energy=Math.min(100,Number(care.energy||0)+18);care.poop=true;care.lastFeed=Date.now();saveSafe();}catch(_){ }
      animate('.nsv2-pet-art','jump'); toastSafe(type==='water'?'¡Agua servida!':'¡Comida servida!'); return;
    }
    if(b.id==='carePoop'){
      e.preventDefault(); e.stopImmediatePropagation();
      try{care.poop=!care.poop;saveSafe();}catch(_){ }
      toastSafe(care.poop?'¡Tu mascota ha hecho caca!':'¡Caca recogida!');
      openCare('poop'); return;
    }
    if(b.id==='careBath'){
      e.preventDefault(); e.stopImmediatePropagation();
      try{care.clean=100;care.fun=Math.min(100,Number(care.fun||0)+8);care.lastBath=Date.now();saveSafe();}catch(_){ }
      toastSafe('¡Baño terminado!'); return;
    }
    if(b.id==='careSleep'){
      e.preventDefault(); e.stopImmediatePropagation();
      try{care.energy=100;saveSafe();}catch(_){ }
      toastSafe('🌙 Tu mascota ha descansado'); return;
    }
  },true);
})();
</script>

    <div class="nx-profile-info"><div class="nx-profile-name">${NX.esc(window.ME?.u||'Nova user')}</div><div class="nx-profile-title">${NX.esc(d.profile?.title||'Rookie')}</div><div class="nx-profile-stats"><span>🔥 ${d.streak||0} días</span><span>⭐ ${d.xp} XP</span><span>🪙 ${d.coins}</span></div></div>
   </section>
   <section class="nx-profile-panel"><h3>Marco de perfil</h3><div class="nx-frame-grid">${['galaxy','neon','aurora','solar','ice'].map(f=>`<button data-frame="${f}" class="${d.frame===f?'sel':''}" ${f==='neon'&&!neon?'disabled':''}>${f.toUpperCase()}${f==='neon'&&!neon?' · BLOQUEADO':''}</button>`).join('')}</div></section>
   <section class="nx-profile-panel"><h3>Tema de perfil</h3><p class="nx-profile-note">${neon?'Tienes ropa NEON equipada: puedes activar el tema NEON completo.':'Equipa una prenda NEON en tu mascota para desbloquear el tema NEON.'}</p><div class="nx-theme-actions"><button data-profile-theme="galaxy">GALAXY</button><button data-profile-theme="neon" ${neon?'':'disabled'}>NEON</button></div></section>
   <section class="nx-profile-panel"><h3>Logros</h3><div class="nx-ach">${['Primer nivel','Primera misión','Racha de 3 días','Mascota feliz','Coleccionista'].map((x,i)=>`<span class="${d.ach.includes(i)?'on':''}">${x}</span>`).join('')}</div></section>
 </div>`;
 document.body.appendChild(o);o.querySelector('.nx-x').onclick=()=>o.remove();
 o.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{if(b.disabled)return;d.frame=b.dataset.frame;NX.save(d);o.remove();novaProfileFullscreen()});
 o.querySelectorAll('[data-profile-theme]').forEach(b=>b.onclick=()=>{const id=b.dataset.profileTheme;if(id==='neon'&&!neon){NX.toast('Equipa ropa NEON en tu mascota para desbloquearlo');return}applyTheme(id);d.theme=id;NX.save(d);o.remove();novaProfileFullscreen()});
}
function stories(){const d=NX.get();const now=Date.now();if(d.story&&now-d.storyAt<86400000){NX.toast('Ya tienes una historia activa')}else{d.story='Nova Story';d.storyAt=now;NX.save(d);NX.addXP(15);NX.toast('Historia publicada durante 24 h')}}
/* Reliable care controls: one delegated handler + state updates */
document.addEventListener('click',function(e){
 const b=e.target.closest('[data-care]');if(b){e.preventDefault();e.stopPropagation();const t=b.dataset.care;if(t==='poop'||t==='play'||t==='food'||t==='bath'||t==='stats'||t==='sleep'){if(typeof petCarePanel==='function')petCarePanel(t);else NX.toast('Carga de cuidados no disponible');return}if(t==='petpick'){try{document.querySelector('.nsv2-tab[data-tab="petpick"]')?.click()}catch(_){}}}
 const cp=e.target.closest('#carePoop');if(cp){e.preventDefault();if(typeof care!=='undefined'){care.poop=!care.poop;care.fun=Math.min(100,care.fun+5);if(!care.poop)care.clean=Math.min(100,care.clean+12);saveCare();NX.addXP(10);NX.get().stats.cares++;NX.save(NX.get());if(typeof petCarePanel==='function')petCarePanel('poop')}return}
 const pl=e.target.closest('[data-play]');if(pl&&document.querySelector('.nova-care-panel')){const p=document.querySelector('.nova-care-panel'),stage=p.querySelector('#carePlayPet'),status=p.querySelector('#playStatus');if(typeof care!=='undefined'){care.fun=Math.min(100,care.fun+18);care.energy=Math.max(0,care.energy-5);saveCare();NX.addXP(12);const d=NX.get();d.stats.plays=(d.stats.plays||0)+1;NX.save(d);if(status)status.textContent='¡Actividad completada!';if(stage)stage.animate([{transform:'translateX(0)'},{transform:'translateX(20px) rotate(4deg)'},{transform:'translateX(-20px) rotate(-4deg)'},{transform:'translateX(0)'}],{duration:1000});NX.toast('¡+12 XP por jugar!')}}
 const like=e.target.closest('.like,.heart,.btn-like,[data-like]');if(like){const d=NX.get();d.stats.likes=(d.stats.likes||0)+1;NX.save(d);if(d.effects){const x=document.createElement('div');x.className='nx-like-burst';x.textContent='✦';document.body.appendChild(x);setTimeout(()=>x.remove(),900)}}
 const careAction=e.target.closest('#careBath,#careSleep,[data-food]');if(careAction){const d=NX.get();d.stats.cares=(d.stats.cares||0)+1;NX.save(d);NX.addXP(8)}
},true);
/* Fix sleep if the original handler is intercepted by overlay */
document.addEventListener('click',function(e){if(e.target.closest('#careSleep')){setTimeout(()=>{if(typeof care!=='undefined'){care.energy=100;saveCare()};NX.toast('Energía al máximo ✦')},30)}},true);
/* Floating shortcuts */
/* inject a Themes tab into existing settings rail */
const oldOpen=window.openSettings;window.openSettings=function(){oldOpen?.();setTimeout(()=>{const rail=document.querySelector('.nsv2-rail');if(!rail)return;const add=(id,label,icon,fn)=>{if(rail.querySelector('[data-tab="'+id+'"]'))return;const b=document.createElement('button');b.className='nsv2-tab';b.dataset.tab=id;b.innerHTML='<b>'+icon+'</b><span>'+label+'</span>';rail.appendChild(b);b.onclick=fn};add('nxworld','Nova World','NW',()=>world());add('nxthemes','Temas','✦',()=>themesUI(document.querySelector('.nx-overlay')||document.body));add('nxprofile','Perfil','P',()=>novaProfileFullscreen());},40)};
/* automatic theme + progression */
const dd=NX.get();if(dd.theme==='neon'&&!neonUnlocked()){dd.theme='galaxy';NX.save(dd)}applyTheme(dd.theme||'aurora');NX.streak();
window.NovaExpansion={world,profile,themes,applyTheme,stories,quests,games};
})();
</script></body></html>
