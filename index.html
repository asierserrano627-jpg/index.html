<style>

async function getMyId(){if(supabaseUser)return supabaseUser.id;const {data:{session}}=await sb.auth.getSession();if(session?.user){supabaseUser=session.user;return session.user.id}const u=await ensureSupabaseUser();return u.id}
async function ensureSupabaseUser(){if(!sb)throw new Error('Sin Supabase');const {data:{session}}=await sb.auth.getSession();if(session?.user){supabaseUser=session.user;return session.user}const {data,error}=await sb.auth.signInAnonymously();if(error)throw error;supabaseUser=data.user;return data.user}
async function ensureSupabaseProfile(user){
  if(!sb||!user)throw new Error('Sin sesión.');
  let desired=cl((ME&&ME.u)||user.user_metadata?.preferred_username||user.user_metadata?.user_name||'');
  if(desired.length<3)desired=(cl(user.user_metadata?.name||'nova')||'nova').slice(0,14)+'_'+String(user.id).replace(/-/g,'').slice(0,5);
  desired=desired.slice(0,20);
  const existing=await sb.from('profiles').select('id,username').eq('id',user.id).maybeSingle();
  if(existing.data?.id)return existing.data.username||desired;
  let res=await sb.from('profiles').insert({id:user.id,username:desired}).select('id,username').single();
  let a=0;while(res.error&&String(res.error.code)==='23505'&&a<3){a++;desired=(desired.slice(0,14)+'_'+Math.random().toString(36).slice(2,7)).slice(0,20);res=await sb.from('profiles').insert({id:user.id,username:desired}).select('id,username').single()}
  if(res.error)throw res.error;return res.data.username;
}

/* VIDEO */
const VIDEO_BUCKET='videos';
async function loadCloudVideos(){
  const {data:rows,error}=await sb.from('videos').select('id,description,video_url,user_id,username,views,avatar_url,admin_likes,admin_favorites').order('id',{ascending:false});
  if(error)throw error;
  const authorIds=[...new Set((rows||[]).map(v=>v.user_id).filter(Boolean))];
  let umap={};
  if(authorIds.length){const {data:profs}=await sb.from('profiles').select('id,username,display_name,avatar_url').in('id',authorIds);(profs||[]).forEach(p=>umap[p.id]={username:p.username,display_name:p.display_name,avatar_url:p.avatar_url})}
  const allIds=(rows||[]).map(v=>String(v.id));
  let commentCounts={};
  if(allIds.length){const {data:cc}=await sb.from('comments').select('video_id').in('video_id',allIds);(cc||[]).forEach(c=>commentCounts[c.video_id]=(commentCounts[c.video_id]||0)+1)}
  const remote=(rows||[]).filter(v=>v&&v.video_url).map(v=>{
    const prof=umap[v.user_id]||{};
    return {id:String(v.id),d:v.description||'Mi vídeo',tags:[],t:0,src:v.video_url,f:'',txt:'',sp:1,nc:false,mu:false,remote:true,userId:v.user_id||null,username:v.username||prof.username||'usuario',avatarUrl:v.avatar_url||prof.avatar_url||null,views:v.views||0,adminLikes:v.admin_likes||0,adminFavorites:v.admin_favorites||0,likeCount:0,commentCount:commentCounts[String(v.id)]||0,saveCount:0};
  });
  const remoteIds=new Set(remote.map(v=>String(v.id)));
  const kept=S.meta.filter(v=>!remoteIds.has(String(v.id)));
  S.meta=[...remote,...kept];save();return remote.length;
}
async function publishCloudVideo(file,description){
  const user=await ensureSupabaseUser();const username=await ensureSupabaseProfile(user);
  const mime=file.type||'video/webm';let ext='webm';if(mime.includes('mp4'))ext='mp4';else if(mime.includes('quicktime'))ext='mov';
  const uid=Math.random().toString(36).slice(2);const path=`${user.id}/${uid}.${ext}`;
  const up=await sb.storage.from(VIDEO_BUCKET).upload(path,file,{contentType:mime,upsert:false});
  if(up.error)throw up.error;
  const {data:pub}=sb.storage.from(VIDEO_BUCKET).getPublicUrl(path);
  const videoUrl=pub?.publicUrl;if(!videoUrl){await sb.storage.from(VIDEO_BUCKET).remove([path]).catch(()=>{});throw new Error('Sin URL')}
  const res=await sb.from('videos').insert({description:description||'Mi vídeo',video_url:videoUrl,user_id:user.id,username,avatar_url:ME.av||null,views:0,admin_likes:0,admin_favorites:0}).select('id,description,video_url,user_id,username,views,avatar_url,admin_likes,admin_favorites').single();
  if(res.error){await sb.storage.from(VIDEO_BUCKET).remove([path]).catch(()=>{});throw res.error}
  return {id:String(res.data.id),d:res.data.description,tags:[],t:Date.now(),src:res.data.video_url,f:'',txt:'',sp:1,nc:false,mu:false,remote:true,userId:res.data.user_id,username:res.data.username,avatarUrl:res.data.avatar_url||ME.av||null,views:0,adminLikes:0,adminFavorites:0,likeCount:0,commentCount:0,saveCount:0};
}

/* SOCIAL */
async function loadSocialState(videoIds){
  if(!sb||!videoIds.length)return;const ids=videoIds.map(String);
  const {data:{session}}=await sb.auth.getSession();const uid=session?.user?.id;
  const [likes,comments,saves]=await Promise.all([sb.from('likes').select('video_id').in('video_id',ids),sb.from('comments').select('video_id').in('video_id',ids),sb.from('saves').select('video_id').in('video_id',ids)]);
  const likeMap={},commentMap={},saveMap={};
  (likes.data||[]).forEach(r=>likeMap[r.video_id]=(likeMap[r.video_id]||0)+1);
  (comments.data||[]).forEach(r=>commentMap[r.video_id]=(commentMap[r.video_id]||0)+1);
  (saves.data||[]).forEach(r=>saveMap[r.video_id]=(saveMap[r.video_id]||0)+1);
  S.meta.forEach(v=>{const key=String(v.id);if(!ids.includes(key))return;v.likeCount=(likeMap[key]||0)+(v.adminLikes||0);v.commentCount=commentMap[key]||0;v.saveCount=(saveMap[key]||0)+(v.adminFavorites||0)});
  if(uid){const [myLikes,mySaves]=await Promise.all([sb.from('likes').select('video_id').eq('user_id',uid).in('video_id',ids),sb.from('saves').select('video_id').eq('user_id',uid).in('video_id',ids)]);S.liked={};S.saved={};(myLikes.data||[]).forEach(r=>S.liked[r.video_id]=1);(mySaves.data||[]).forEach(r=>S.saved[r.video_id]=1);save()}
}
async function toggleLike(videoId){const user=await ensureSupabaseUser();const id=String(videoId);const liked=!!S.liked[id];if(liked){delete S.liked[id];await sb.from('likes').delete().eq('video_id',id).eq('user_id',user.id)}else{S.liked[id]=1;await sb.from('likes').insert({video_id:id,user_id:user.id})}save();const v=vid(videoId);if(v)v.likeCount=Math.max(0,(v.likeCount||0)+(liked?-1:1));refresh(videoId);if(navigator.vibrate&&!liked)navigator.vibrate(10)}
async function toggleSave(videoId){const user=await ensureSupabaseUser();const id=String(videoId);const saved=!!S.saved[id];if(saved){delete S.saved[id];await sb.from('saves').delete().eq('video_id',id).eq('user_id',user.id)}else{S.saved[id]=1;await sb.from('saves').insert({video_id:id,user_id:user.id})}save();refresh(videoId)}
async function loadComments(videoId){const {data,error}=await sb.from('comments').select('id,content,created_at,user_id,profiles(username)').eq('video_id',String(videoId)).order('created_at',{ascending:false}).limit(100);if(error)return[];return (data||[]).map(c=>({u:c.profiles?.username||'usuario',t:c.content,ts:c.created_at,id:c.id,uid:c.user_id}))}
async function postComment(videoId,content){const user=await ensureSupabaseUser();await ensureSupabaseProfile(user);const {error}=await sb.from('comments').insert({video_id:String(videoId),user_id:user.id,content});if(error)throw error;const v=vid(videoId);if(v)v.commentCount=(v.commentCount||0)+1;refresh(videoId)}

function computeStreakDisplay(c){if(!c)return{count:0,active:false};const today=new Date().toISOString().slice(0,10);const y=new Date(Date.now()-864e5).toISOString().slice(0,10);let count=c.streak_count||0;const aLast=c.a_last_msg,bLast=c.b_last_msg;const bothToday=aLast===today&&bLast===today;const bothRecent=(aLast===today||aLast===y)&&(bLast===today||bLast===y);if(count>0){if(!((c.streak_last===today&&bothToday)||(c.streak_last===y&&bothRecent)))count=0}return{count,active:count>0&&bothRecent}}

/* ACARICIAR */
function pettingAnimation(){
  const petEl=document.querySelector('.pet-big')||document.querySelector('.chat-pet');
  if(!petEl)return;
  petEl.classList.add('petting');setTimeout(()=>petEl.classList.remove('petting'),1000);
  const rect=petEl.getBoundingClientRect();
  for(let i=0;i<5;i++){const h=document.createElement('div');h.className='pet-hearts';h.textContent=i%2?'💖':'✨';h.style.left=(rect.left+rect.width/2)+'px';h.style.top=(rect.top+rect.height/2)+'px';h.style.setProperty('--hx',(Math.random()*60-30)+'px');h.style.animationDelay=(i*.08)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),1400)}
  if(navigator.vibrate)navigator.vibrate(20);

  $('#m').innerHTML=`<div class="wl"><div class="wc"><span class="logo">Nova</span><p style="font-size:19px;opacity:.85">Creado por Asier, Ari y Adán</p><div class="gl" id="wf"><button type="button" id="googleBtn" class="google-btn"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.27c0-.68-.06-1.35-.18-1.98H12v3.75h5.24a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.91-4.18 2.91-7.13z"/><path fill="#34A853" d="M12 21.7c2.62 0 4.82-.87 6.43-2.36l-3.14-2.43c-.87.58-1.98.93-3.29.93-2.53 0-4.68-1.71-5.45-4.01H3.3v2.5A9.72 9.72 0 0 0 12 21.7z"/><path fill="#FBBC05" d="M6.55 13.83A5.84 5.84 0 0 1 6.24 12c0-.64.11-1.26.31-1.83V7.67H3.3A9.7 9.7 0 0 0 2.27 12c0 1.56.37 3.03 1.03 4.33l3.25-2.5z"/><path fill="#EA4335" d="M12 6.16c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.81 3.25 14.62 2.3 12 2.3a9.72 9.72 0 0 0-8.7 5.37l3.25 2.5c.77-2.3 2.92-4.01 5.45-4.01z"/></svg>Google</button><div class="auth-divider">o crea tu perfil</div><label>Nombre</label><input id="wn" maxlength="24" placeholder="Alex"><label>Usuario</label><input id="wu" maxlength="20" placeholder="alex.nova"><p id="we" style="color:#ffb4c0;min-height:20px;font-size:13px"></p><button id="wb" class="btn" style="width:100%;padding:14px">Entrar a Nova</button></div></div></div>`;
  const enter=async()=>{const n=$('#wn').value.trim();let u=cl($('#wu').value.trim())||cl(n);if(n.length<2){$('#we').textContent='Nombre mínimo 2';return}if(u.length<3)u=(u+'nova'+(Math.random()*900+100|0)).slice(0,20);S.acct={n,u,bio:''};ME=S.acct;save();try{const user=await ensureSupabaseUser();try{await ensureSupabaseProfile(user)}catch(e){}await refreshCloudFeed()}catch(e){}document.body.classList.remove('nl');go('#/')};
  const google=async()=>{try{const redirectTo=location.href.split('#')[0];const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}});if(error)throw error}catch(e){$('#we').textContent=e.message}};
  $('#wb').onclick=enter;$('#googleBtn').onclick=google;
}

/* ARRANQUE */
(async()=>{
  const loading=document.getElementById('nova-loading');
  const hideLoading=()=>{loading&&loading.classList.add('gone');setTimeout(()=>loading&&loading.remove(),700)};
  if(adminEnabled)$('#adminFab').classList.add('on');
  theme();
  await new Promise(r=>setTimeout(r,800));
  try{
    if(sb){
      const {data:{session}}=await sb.auth.getSession();
      if(session?.user){
        supabaseUser=session.user;
        const u=session.user;
        const n=u.user_metadata?.full_name||u.user_metadata?.name||'Nova';
        const base=cl(u.user_metadata?.preferred_username||u.user_metadata?.user_name||u.email?.split('@')[0]||'nova');
        ME=S.acct={n,u:base.slice(0,20)||'nova',bio:''};
        save();
        try{await ensureSupabaseProfile(u)}catch(e){}
        const {data:prof}=await sb.from('profiles').select('coins,owned_dogs,owned_clothes,equipped_pet_profile').eq('id',u.id).maybeSingle();
        if(prof){myCoins=prof.coins??500;myOwnedDogs=prof.owned_dogs||['chihuahua'];myOwnedClothes=prof.owned_clothes||[];equippedPetProfile=prof.equipped_pet_profile||null}
      }
      await refreshCloudFeed();
    }
  }catch(e){console.warn('Supabase:',e)}
  if(S.acct){ME=S.acct;route()}else welcome();
  setTimeout(hideLoading,300);
})();
</script>
